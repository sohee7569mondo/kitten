<style id="ss-foot-css">

  background:none !important; border:0 !important; padding:0 !important; margin:0 !important;
  max-width:none !important; width:auto !important;
}
#ss-footer{
  --gold:#D4AF6A; --gold-soft:#C9A66B;
  --star:#F2ECE0; --ink-soft:rgba(242,236,224,.72); --ink-dim:rgba(242,236,224,.42);
  --line:rgba(212,175,106,.18);
  background:#0D0A1A; border-top:1px solid var(--line);
  padding:52px 24px 40px !important; text-align:center; position:relative; z-index:1;
  font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-weight:300; line-height:1.7; word-break:keep-all;
}
#ss-footer *{box-sizing:border-box;}
#ss-footer a{color:inherit; text-decoration:none;}
#ss-footer .ssf-logo{width:250px; max-width:70%; height:auto; margin:0 auto 18px; display:block; border-radius:6px;}

  letter-spacing:.08em; font-size:1rem; margin-bottom:18px;}

         alt="스텔라사주" width="339" height="156" loading="lazy">

  <div class="ssf-fine">
    &copy; STELLA SAJU <span class="sep">&middot;</span> 이 콘텐츠는 재미를 위한 참고용입니다
  </div>
</div>

<script>
/* 친구 추천 링크 기억하기 ─────────────────────────────────────
   stellasaju.com/?ref=A7K2M9 처럼 들어오시면 그 코드를 30일 동안 쿠키에 담아둡니다.
   가입이 끝나면 서버가 이 쿠키를 보고 추천한 분께 구슬을 얹습니다.

   PHP 쪽에도 같은 일을 하는 코드가 있지만, 페이지가 캐시되면 PHP 가 안 돌 수도 있어
   브라우저에서도 한 번 더 담아둡니다. 푸터는 모든 쪽에 붙으니 어디로 들어오셔도 잡힙니다. */
(function(){
  try{
    /* 물음표 뒤 값은 URLSearchParams 로 읽습니다.
       정규식으로 하면 앰퍼샌드가 들어가는데, 워드프레스가 그 글자를 바꿔버립니다. */
    var code = new URLSearchParams(location.search).get('ref');
    if(!code){ return; }
    code = code.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
    if(code.length < 4){ return; }
    if(code.length > 12){ return; }
    var till = new Date(Date.now() + 30*24*60*60*1000).toUTCString();
    document.cookie = 'stella_ref=' + code + '; expires=' + till + '; path=/; SameSite=Lax';
  }catch(err){}
})();

(function(){
  var img = document.querySelector('#ss-footer .ssf-logo');
  if(!img) return;
  var swap = function(){
    img.style.display='none';
    var f = document.querySelector('#ss-footer .ssf-fallback');
    if(f) f.style.display='block';
  };
  if(img.complete && img.naturalWidth === 0) swap();
  img.addEventListener('error', swap);
})();
</script>
