      {k:'월간', el:GAN_EL[p.month.gan], yin:GAN_YIN[p.month.gan], han:p.month.han.charAt(0)},
      {k:'월지', el:JI_EL[p.month.ji],   yin:JI_YIN[p.month.ji],   han:p.month.han.charAt(1)},
      {k:'일지', el:JI_EL[p.day.ji],     yin:JI_YIN[p.day.ji],     han:p.day.han.charAt(1)}
    ];
    if(p.hour){
      slots.push({k:'시간', el:GAN_EL[p.hour.gan], yin:GAN_YIN[p.hour.gan], han:p.hour.han.charAt(0)});
      slots.push({k:'시지', el:JI_EL[p.hour.ji],   yin:JI_YIN[p.hour.ji],   han:p.hour.han.charAt(1)});
    }

    var count={}, gcount={};
    slots.forEach(function(s){
      count[s.sip]=(count[s.sip]||0)+1;
      var g=GROUP[s.sip];
      gcount[g]=(gcount[g]||0)+1;
    });

    /* 가장 두꺼운 십성 두 개 */
    var ranked=Object.keys(count).map(function(k){ return {sip:k, n:count[k]}; })
      .sort(function(a,b){ return b.n-a.n; });

    /* 축 계산 */
    var axis={};
    Object.keys(AXES).forEach(function(key){
      var A=AXES[key], sa=0, sb=0;
      A.a.forEach(function(s){ sa+=(count[s]||0); });
      A.b.forEach(function(s){ sb+=(count[s]||0); });
      var lean='';
      if(sa>sb) lean='A';
      if(sb>sa) lean='B';

      sun: SUN[chart.stars.sun.name] || '',
      asc: ASC[chart.stars.ascendant.name] || '',
      mc:  MC[chart.stars.midheaven.name] || ''
    };

  var PICKS={

    var v=answers[key];  if(!v){ return ''; }
    if(v===pair[0]){ return 'A'; }
    if(v===pair[1]){ return 'B'; }
    return '';
  }

  /* 그 축을 거스르는 자리가 구체적으로 어떤 자리인지 */
  var AGAINST={
    solo:{ A:'사람들 사이에서 하루 종일 말을 맞춰야 하는 자리',
           B:'혼자 방에서 처음부터 끝까지 다 끝내야 하는 자리' },
    form:{ A:'눈에 보이지 않는 것만 종일 다루는 자리',
           B:'정해진 물건을 똑같이 반복해서 만드는 자리' },
    many:{ A:'여러 건을 동시에 굴려야 하는 자리',
           B:'한 가지만 몇 년씩 붙잡고 있어야 하는 자리' },
    risk:{ A:'달마다 판이 바뀌는 자리',
           B:'정해진 절차만 그대로 반복하는 자리' },
    make:{ A:'답이 없는 것을 처음부터 만들어야 하는 자리',
           B:'남이 정한 답을 그대로 지켜야 하는 자리' }
  };
  /* 기울기의 크기를 말로 */
  function tiltWord(d){
    if(d>=4){ return '아주 크게'; }
    if(d===3){ return '크게'; }
    if(d===2){ return '뚜렷하게'; }
    return '조금';
  }
  function otherName(key, side){
    var A=R.AXES[key];
    return side==='A' ? A.A : A.B;
  }

  function gapBlock(key, title){
    var A=it.axis[key];
    var d=Math.abs(A.a-A.b);
    var out='<h3>'+title+'</h3>';

    if(!A.lean){
      out+='<p>사주는 이 저울에서 <em>어느 쪽으로도 기울지 않았습니다</em> — '+A.a+' 대 '+A.b+'. '+
           '이 축은 그때그때 상황에 맞추셔도 크게 무리가 없습니다. '+
           '반대로 말하면, 여기서는 남들이 부러워할 만큼 유연하실 수 있어요.</p>';
    } else {
      out+='<p>사주는 <em>'+A.name+'</em> 쪽으로 '+tiltWord(d)+' 기울어 있습니다 — '+
           A.a+' 대 '+A.b+'. '+A.say+'입니다.</p>';
      out+='<p>그래서 <em>'+AGAINST[key][A.lean]+'</em>에 오래 서 계시면, '+
           '같은 일을 해도 남보다 힘이 더 듭니다. 게을러서가 아니라 '+
           '결을 거슬러 밀고 있어서입니다. '+
           (d>=3 ? '기울기가 큰 편이라 이 차이는 시간이 지나도 잘 줄지 않습니다.'
                 : '기울기가 아주 크지는 않아서, 버틸 만한 정도로 지나갈 수도 있습니다.')+'</p>';
    }

    var side=pickedSide(key);
    if(side){
      if(A.lean){
        if(side===A.lean){
          out+='<p>답해주신 것도 같은 쪽이었습니다. <em>여기는 어긋나지 않습니다</em> — '+
               '이 저울에서는 마음 놓고 가셔도 됩니다.</p>';
        } else {
          out+='<p>그런데 답해주실 때는 <em>'+otherName(key, side)+'</em> 쪽을 고르셨습니다. '+
               '<em>여기가 어긋나는 자리입니다.</em> 타고난 결은 '+A.name+' 쪽인데 '+
               '지금은 '+otherName(key, side)+' 쪽으로 살고 계시다는 뜻이니, '+
               '요즘 유난히 힘드셨다면 그건 당신 탓이 아닙니다.</p>';
        }
      } else {
        out+='<p>답해주신 것은 <em>'+otherName(key, side)+'</em> 쪽이었습니다. '+
             '사주가 평평하니 이 축은 고르신 대로 가셔도 됩니다.</p>';
      }
    }
    return out;
  }

  page(
    '<p class="eyebrow">어긋나는 자리</p>'+
    '<h2>맞지 않는 곳도 적어둡니다</h2>'+
    '<p class="dek">이 장이 없는 풀이는 믿지 마세요</p>'+
    '<p>사주가 가리키는 쪽과 지금 살고 계신 쪽이 늘 같지는 않습니다. '+
    '다르다고 해서 사주가 틀린 것도, 당신이 틀린 것도 아닙니다. '+
    '다만 <em>그 어긋난 만큼 힘이 더 든다</em>는 뜻입니다. '+
    '저울을 하나씩 보겠습니다. 숫자는 여덟 글자 가운데 몇 자가 그쪽 편인지입니다.</p>'+
    gapBlock('solo','혼자냐, 함께냐')+
    gapBlock('form','실물이냐, 무형이냐'), null, 'two');

  page(
    '<p class="eyebrow">어긋나는 자리</p>'+
    '<h2>남은 저울 셋</h2>'+
    gapBlock('many','하나냐, 여럿이냐')+
    gapBlock('risk','안정이냐, 변화냐')+
    gapBlock('make','정답이냐, 창조냐')+
    '<hr>'+
    '<p>다섯 저울이 전부 맞는 사람은 없습니다. 하나나 둘쯤 어긋나 있는 게 보통이에요. '+
    '중요한 건 <em>어긋난 자리를 고치는 것이 아니라 알고 있는 것</em>입니다. '+
    '알고 있으면 "내가 부족한가" 대신 "여기는 원래 나한테 두 배로 드는 자리지" 하고 넘어갈 수 있으니까요.</p>', null, 'two');

  /* ── 12 타로 ─────────────────────────────────────────── */
  page(
    '<p class="eyebrow">마지막에 놓는 세 장</p>'+
    '<h2>오늘의 카드</h2>'+
    '<p class="dek">사주는 태어날 때 정해진 것을, 카드는 오늘의 것을 읽습니다</p>'+
    '<div class="cards">'+
      [['I','지금 서 있는 자리'],['II','넘어야 할 것'],['III','그 너머']].map(function(c){
        return '<div class="card"><div class="num">'+c[0]+'</div><div class="lb">'+c[1]+'</div></div>';
      }).join('')+
    '</div>'+
    '<p>세 장을 뽑아주셨습니다. 카드의 뜻풀이는 발행이 열리면 이 자리에 들어갑니다. '+
    '지금은 자리만 잡아두었습니다.</p>');

  /* ── 13 맺음말 ───────────────────────────────────────── */
  page(
    '<p class="eyebrow">맺음말</p>'+
    '<h2>'+esc(name)+'님께</h2>'+
    '<p class="lead">'+g.close+'</p>'+
    '<div class="sig">— '+g.name+'</div>', 'close');

  /* ── 14 배웅 ─────────────────────────────────────────── */
  /* 마지막 장에서 '여덟 글자'라고만 하면 무슨 말인지 다시 헷갈립니다.
     그 자리에서 실제 글자를 같이 보여줍니다. 시간을 모르시면 여섯 자입니다. */
  var eightChars = chart.pillars.year.han + ' ' + chart.pillars.month.han + ' ' + chart.pillars.day.han;
  if(chart.pillars.hour){ eightChars += ' ' + chart.pillars.hour.han; }

  page(
    '<div class="fw-portrait"><img src="https://stellasaju.com/wp-content/uploads/2026/08/'+g.face+'" '+
      'alt="'+g.name+'" width="1408" height="1408"></div>'+
    '<div class="fw-name">'+g.name+'</div>'+
    '<div class="fw-en">'+g.en+'</div>'+
    '<div class="fw-words">'+
      '<p>여기까지 읽어주셔서 고맙습니다. 맨 앞에서 세운 여덟 글자 — '+
      '태어나신 해 · 달 · 날 · 시를 두 자씩 옮겨 적은 <em>'+eightChars+'</em> — 는 '+
      esc(name)+'님 것이고, 앞으로도 바뀌지 않습니다. '+
      '바뀌는 건 그걸 가지고 무엇을 하느냐뿐이에요.</p>'+
      '<p>풀이는 길을 정해주지 않습니다. 다만 어느 쪽이 오르막이고 어느 쪽이 내리막인지를 알려줄 뿐입니다. '+
      '오르막을 가더라도, 오르막인 줄 알고 가면 덜 억울합니다.</p>'+
      '<div class="fw-last">'+g.last+'</div>'+
    '</div>'+
    '<p class="fine">본 콘텐츠는 전통 사주명리학과 서양점성술에 기반한 오락적 콘텐츠이며,<br>'+
    '의료 · 법률 · 투자에 관한 조언이 아닙니다.</p>', 'farewell');

  $('bkBook').innerHTML = pages.join('');
  $('bkTitle').textContent = g.name + ' · ' + topic;
  $('bkN').textContent = n + '쪽';
  $('bkPrint').addEventListener('click', function(){ window.print(); });

  /* 낱장 크기를 하나로 맞춥니다.
     내용이 짧은 장이 있으면 책이 아니라 전단지처럼 보입니다.
     가장 긴 장을 재서 나머지를 거기에 맞춥니다. */
  var sheets=[].slice.call(document.querySelectorAll('#ssb .page'));
  function evenOut(){
    /* 재는 동안 낱장 높이를 잠깐 풀어야 하는데, 그 순간 문서가 확 줄어듭니다.
       그대로 두면 읽던 자리가 앞쪽으로 튕기므로 스크롤 위치를 붙잡아 뒀다 되돌립니다. */
    var keep = window.pageYOffset || document.documentElement.scrollTop || 0;
    sheets.forEach(function(el){ el.style.minHeight=''; });
    var tall=0;
    sheets.forEach(function(el){
      var h=el.getBoundingClientRect().height;
      if(h>tall){ tall=h; }
    });
    tall=Math.ceil(tall);
    sheets.forEach(function(el){ el.style.minHeight=tall+'px'; });
    if(keep>0){ window.scrollTo(0, keep); }
  }
  evenOut();

  /* 모바일에서 스크롤하면 주소창이 접혔다 펴지면서 resize 가 옵니다.
     그때는 높이만 바뀌고 가로폭은 그대로입니다. 그 김에 낱장을 다시 재면
     읽던 자리가 앞 장으로 튕기므로, 가로폭이 실제로 바뀔 때만 다시 잽니다. */
  var lastW = window.innerWidth;
  var t=null;
  window.addEventListener('resize', function(){
    if(window.innerWidth===lastW){ return; }
    lastW = window.innerWidth;
    if(t){ clearTimeout(t); }
    t=setTimeout(evenOut, 180);
  });
})();
</script>
