      '지쳤을 때, 놀랐을 때, 아무도 안 볼 때 튀어나오는 쪽이요. '+
      '해는 남들이 아는 당신이고 달은 당신만 아는 당신입니다.</p>'+
      '<div class="tw"><table><tbody>'+fourRows+'</tbody></table></div>'+
      (hourKnown ? '' :
        '<p class="mini">태어난 시간을 모르셔서 문 앞의 자리(상승궁)와 바깥의 자리(천정)는 뺐습니다. '+
        '이 둘은 시각이 십 분만 달라져도 통째로 바뀌는 자리라, 모르는 채로 적으면 지어낸 말이 됩니다.</p>')+
      '<h3>달 '+msign+'</h3>'+
      '<p>'+MOON[msign].what+'</p>'+
      '<p>'+MOON[msign].rest+' 여기가 중요합니다 — 쉬는 방식이 남과 다르면, '+
      '남들이 쉰다는 대로 따라 해봐야 채워지지 않습니다.</p>'+
      '<p>'+MOON[msign].care+'</p>'+
      edgeTxt);

    var sameSun=(st.sun.name===msign);
    var sunW=SIGN_W[st.sun.name];
    var sunMoon;
    if(sameSun){
      sunMoon='해와 달이 같은 '+msign+'에 겹쳐 있습니다. 낮의 나와 밤의 내가 같은 사람이에요. '+
        '숨기는 것이 없어 편한 대신, 지쳤을 때 도망갈 다른 얼굴이 없습니다. '+
        '한쪽이 무너지면 통째로 무너지는 구조라, 쉬는 자리를 따로 만들어 두셔야 합니다.';
    } else {
      if(sunW[0]===mw[0]){
        sunMoon='해는 '+st.sun.name+', 달은 '+msign+'입니다. 자리는 다른데 결이 같아요 — '+
          '둘 다 '+sunW[0]+'입니다. 하고 싶은 것과 마음이 편한 것이 대체로 같은 쪽을 가리킵니다. '+
          '드문 편이고, 사는 데 힘이 덜 듭니다.';
      } else {
        sunMoon='해는 '+st.sun.name+'('+sunW[0]+')인데 달은 '+msign+'('+mw[0]+')입니다. '+
          '하려는 것과 편한 것이 서로 다른 쪽을 가리킵니다. '+
          '그래서 잘 해내고 나서도 이상하게 허전한 날이 있고, 반대로 아무것도 안 했는데 '+
          '마음이 채워지는 날이 있습니다. 둘 중 하나가 틀린 게 아니라 원래 둘입니다. '+
          '낮에 '+ro(sunW[0])+' 살았으면 밤에는 '+ro(mw[0])+' 쉬셔야 합니다.';
      }
    }

    page(
      '<p class="eyebrow">더 깊이 · 하나</p>'+
      '<h2>태어나던 밤, 달은 이만큼 차 있었습니다</h2>'+
      '<p class="dek">해와 달이 얼마나 벌어져 있었는지가 달의 모양입니다</p>'+
      '<p>달의 모양은 해와 달이 얼마나 벌어져 있는지로 정해집니다. '+
      '태어나신 순간 달은 '+litWord+', 삭에서 세어 '+moonAge+'일째였습니다. '+
      '<em>'+phase.n+'</em>이에요.</p>'+
      '<p>'+phase.d+'</p>'+
      '<hr>'+
      '<h3>해와 달, 두 자리를 겹치면</h3>'+
      '<p>'+sunMoon+'</p>'+
      '<div class="voice"><div class="who">'+gname+'</div>'+
      '<p>같은 밤에 두 번 다시 같은 하늘은 오지 않습니다. '+
      esc(name)+'님의 하늘은 그날 그 모양이었고, 그건 앞으로도 바뀌지 않아요. '+
      '달을 알고 나면 한 가지가 편해집니다 — 왜 남들 쉬는 대로 쉬어도 안 쉬어졌는지가요.</p></div>');

    /* ── 꼭지 둘 · 네 자리가 그리는 지도 ────────────────────── */
    var pts=[{k:'해', s:st.sun.name},{k:'달', s:msign}];
    if(hourKnown){
      pts.push({k:'상승궁', s:st.ascendant.name});
      pts.push({k:'천정', s:st.midheaven.name});
    }
    var wcnt={'불':0,'흙':0,'공기':0,'물':0};
    var mcnt={'활동':0,'고정':0,'변화':0};
    pts.forEach(function(p){
      var w=SIGN_W[p.s];
      p.w=w[0]; p.m=w[1];
      wcnt[w[0]]+=1; mcnt[w[1]]+=1;
    });
    var ptRows=pts.map(function(p){
      return '<tr><td class="k">'+p.k+'</td><td>'+p.s+'</td><td>'+p.w+'</td><td>'+WMODE[p.m].t+'</td></tr>';
    }).join('');

    var WLIST=['불','흙','공기','물'];
    var wRows=WLIST.map(function(w){
      var n=wcnt[w], lab='없음';
      if(n===1){ lab='하나'; }
      if(n===2){ lab='둘'; }
      if(n>=3){ lab='셋 이상'; }
      return '<tr><td class="k">'+w+'</td><td>'+WEL[w].t+'</td><td>'+n+'자리 · '+lab+'</td></tr>';
    }).join('');

    var wMuch=WLIST.filter(function(w){ return wcnt[w]>=2; });
    var wNone=WLIST.filter(function(w){ return wcnt[w]===0; });

    var mapTxt='';
    if(wMuch.length){
      mapTxt+='<p>당신에게 몰려 있는 결은 '+R.joinWa(wMuch,'<em>','</em>')+'입니다. '+
        wMuch.map(function(w){ return WEL[w].much; }).join(' ')+'</p>';
    } else {
      mapTxt+='<p>네 자리가 네 결에 하나씩 고르게 흩어져 있습니다. 드문 모양이에요. '+
        '어느 쪽으로도 크게 쏠리지 않아 무슨 자리에 놓아도 굴러갑니다. '+
        '대신 <em>내가 뭘 제일 좋아하는 사람인지</em>가 평생 잘 안 잡힙니다.</p>';
    }
    if(wNone.length){
      mapTxt+='<p>반대로 '+R.joinWa(wNone,'<em>','</em>')+' 쪽은 한 자리도 없습니다. '+
        wNone.map(function(w){ return WEL[w].none; }).join(' ')+' '+
        '없는 결은 채워지지 않습니다. 다만 그 결을 가진 사람에게 유난히 마음이 갑니다 — '+
        '내게 없는 것을 그 사람이 대신 해주니까요.</p>';
    }

    page(
      '<p class="eyebrow">더 깊이 · 둘</p>'+
      '<h2>'+cw(pts.length)+' 자리가 그리는 지도</h2>'+
      '<p class="dek">별자리 하나로 사람을 나누지 않습니다. 자리를 겹쳐야 한 사람이 나옵니다</p>'+
      '<p>서양 별자리는 열두 자리를 넷으로 다시 묶습니다 — '+
      '나서는 결(불) · 쌓는 결(흙) · 잇는 결(공기) · 스미는 결(물). '+
      '당신의 '+cw(pts.length)+' 자리가 이 넷 가운데 어디에 몰려 있는지를 보면, '+
      '태양 별자리 하나로는 안 보이던 것이 나옵니다.</p>'+
      '<div class="tw"><table><thead><tr><th>자리</th><th>별자리</th><th>결</th><th>성질</th></tr></thead>'+
      '<tbody>'+ptRows+'</tbody></table></div>'+
      '<div class="tw"><table><thead><tr><th>결</th><th>무엇인가</th><th>당신</th></tr></thead>'+
      '<tbody>'+wRows+'</tbody></table></div>'+
      mapTxt);

    var mTop='활동', mn=-1;
    ['활동','고정','변화'].forEach(function(k){ if(mcnt[k]>mn){ mn=mcnt[k]; mTop=k; } });
    var mTie=['활동','고정','변화'].filter(function(k){ return mcnt[k]===mn; });

    var modeTxt;
    if(mTie.length>1){
      modeTxt='<p>성질은 '+mTie.map(function(k){ return '<em>'+WMODE[k].t+'</em>'; }).join(' · ')+
        '로 갈려 있습니다. 한쪽으로 몰리지 않은 모양이라, 시작할 때와 버틸 때와 물러설 때를 '+
        '상황 따라 바꿔 쓰실 수 있습니다. 대신 <em>어느 것이 내 기본값인지</em>를 스스로 정해두지 않으면 '+
        '매번 처음부터 고민하게 됩니다.</p>';
    } else {
      modeTxt='<p>'+cw(pts.length)+' 자리 가운데 '+cw(mn)+
        ' 자리가 <em>'+WMODE[mTop].t+'</em>입니다. '+
        WMODE[mTop].d+'</p>';
    }

    var dayEl=chart.dayMaster.element;
    var moonEl=W2EL[mw[0]];
    var rel, relSay;
    if(moonEl===dayEl){ rel='같은 기운';
      relSay='밤의 자리와 낮의 자리가 같은 연료를 씁니다. 쉬는 방식과 일하는 방식이 닮아 있어요. '+
        '효율은 좋은데, 한쪽이 지치면 다른 쪽으로 갈아탈 데가 없습니다.'; }
    else if(SAENG[moonEl]===dayEl){ rel='달이 나를 채우는 사이';
      relSay='밤의 자리가 낮의 자리를 채워주는 모양입니다. 제대로 쉬면 확실히 회복되는 사람이에요. '+
        '문제는 대개 <em>안 쉬어서</em>지 못 쉬어서가 아닙니다.'; }
    else if(SAENG[dayEl]===moonEl){ rel='내가 달에게 내주는 사이';
      relSay='낮의 자리가 밤의 자리에게 내주는 모양입니다. 쉬려고 한 일이 또 하나의 일이 됩니다 — '+
        '취미도 잘해야 하고, 쉬는 날에도 무언가를 만들고 있죠. '+
        '아무것도 만들지 않는 시간을 일정처럼 잡아두셔야 합니다.'; }
    else if(GEUK[moonEl]===dayEl){ rel='달이 나를 누르는 사이';
      relSay='밤의 자리가 낮의 자리를 누르는 모양입니다. 쉬려고 누우면 오히려 생각이 몰려옵니다. '+
        '가만히 있는 것이 당신에게는 휴식이 아니에요. 몸이나 손을 쓰는 쪽으로 쉬셔야 풀립니다.'; }
    else { rel='내가 달을 누르는 사이';
      relSay='낮의 자리가 밤의 자리를 누르는 모양입니다. 마음이 보내는 신호를 의지로 덮어버립니다. '+
        '괜찮다고 말하는 동안 몸이 먼저 셈을 하고 있어요. 지금 어떤지를 소리 내어 말하는 연습이 필요합니다.'; }

    page(
      '<p class="eyebrow">더 깊이 · 둘</p>'+
      '<h2>그래서 어떤 결로 사는 사람인지</h2>'+
      modeTxt+
      '<hr>'+
      '<h3>밤의 자리와 낮의 자리</h3>'+
      '<p>여기서 한 번 건너가 봅니다. 서양의 넷은 사주의 다섯에 대충 이렇게 놓입니다 — '+
      '불은 화, 흙은 토, 공기는 목, 물은 수. '+
      '당신의 달은 '+mw[0]+' 쪽이라 사주 말로는 <em>'+moonEl+'</em>입니다. '+
      '앞에서 본 당신 자신은 일간 '+it.day.kor+', 기운으로는 <em>'+stellaEl(dayEl)+'</em>'+
      (batchim(dayEl)?'이었습니다':'였습니다')+'. '+
      '둘은 <em>'+rel+'</em>예요.</p>'+
      '<p>'+relSay+'</p>'+
      '<div class="voice"><div class="who">'+gname+'</div>'+
      '<p>하늘은 명령하지 않습니다. 다만 어느 쪽이 덜 힘든지를 알려줄 뿐이에요. '+
      '오늘 알아두실 것은 하나입니다 — 당신이 쉬는 방식은 남과 다르고, 그건 게으른 것이 아니라 '+
      '태어난 밤의 하늘이 그렇게 생겼던 것뿐입니다.</p></div>');

    /* ── 꼭지 셋 · 별과 여덟 글자가 겹치는 자리 ─────────────── */
    var fmap={ '목':0, '화':0, '토':0, '금':0, '수':0 };
    chart.five.forEach(function(f){ fmap[f.element]=f.count; });

    var crossRows=WLIST.map(function(w){
      var el=W2EL[w], sn=wcnt[w], jn=fmap[el], say;
      if(sn>=2){
        if(jn>=3){ say='<em>양쪽이 같은 말을 합니다.</em> 여기는 웬만해선 안 틀립니다.'; }
        else if(jn===0){ say='별에는 몰려 있는데 여덟 글자에는 한 자도 없습니다. 어긋나는 자리예요.'; }
        else { say='별 쪽이 조금 더 강합니다. 겉으로 드러나는 쪽이 이 결이에요.'; }
      } else if(sn===0){
        if(jn>=3){ say='여덟 글자에는 강한데 별에는 없습니다. 속으로만 이 결이 도는 자리예요.'; }
        else if(jn===0){ say='<em>양쪽 다 비어 있습니다.</em> 평생 남에게 빌려 쓰는 결입니다.'; }
        else { say='별에는 없고 여덟 글자에만 조금 있습니다. 속으로만 도는 결이에요.'; }
      } else {
        say='한쪽으로 치우치지 않은 자리입니다.';
      }
      return '<tr><td class="k">'+w+' · '+el+'</td><td>'+sn+'자리</td><td>'+jn+'자</td><td>'+say+'</td></tr>';
    }).join('');

    var agree=WLIST.filter(function(w){ var el=W2EL[w]; if(wcnt[w]<2){ return false; } return fmap[el]>=3; });
    var bothNone=WLIST.filter(function(w){ var el=W2EL[w]; if(wcnt[w]!==0){ return false; } return fmap[el]===0; });
    var split=WLIST.filter(function(w){
      var el=W2EL[w];
      if(wcnt[w]>=2){ if(fmap[el]===0){ return true; } }
      if(wcnt[w]===0){ if(fmap[el]>=3){ return true; } }
      return false;
    });

    var crossTxt='';
    if(agree.length){
      crossTxt+='<p>동양과 서양이 같은 곳을 가리킨 자리가 있습니다 — '+R.joinWa(agree,'<em>','</em>')+'입니다. '+
        '전혀 다른 두 계산이 같은 답을 냈다는 뜻이에요. 이런 자리는 <em>가장 확실한 자리</em>입니다. '+
        '무엇을 고르실 때 여기부터 세우시면 됩니다.</p>';
    }
    if(split.length){
      crossTxt+='<p>어긋난 자리도 적어둡니다 — '+R.joinWa(split,'<em>','</em>')+'입니다. '+
        '한쪽에는 몰려 있는데 다른 쪽에는 비어 있어요. '+
        '이런 자리는 <em>남이 보는 나와 내가 아는 내가 다른 데</em>가 됩니다. '+
        '남들은 당신이 그 결을 잘한다고 여기는데 정작 본인은 힘들거나, 그 반대이거나요. '+
        '설명을 두 번 하게 되는 자리가 여기서 나옵니다.</p>';
    }
    if(bothNone.length){
      crossTxt+='<p>양쪽 다 비어 있는 자리는 '+R.joinWa(bothNone,'<em>','</em>')+'입니다. '+
        '이건 흠이 아니라 <em>평생 남에게 빌려 쓰는 결</em>이에요. '+
        '그 결을 가진 사람이 곁에 있으면 일이 훨씬 수월해집니다. 혼자 채우려 하지 마세요.</p>';
    }
    if(!crossTxt){
      crossTxt='<p>크게 겹치지도, 크게 어긋나지도 않았습니다. 두 계산이 조용히 같은 방향을 보고 있어요. '+
        '이런 분은 한쪽 풀이만 듣고도 크게 헷갈리지 않습니다.</p>';
    }

    page(
      '<p class="eyebrow">더 깊이 · 셋</p>'+
      '<h2>별과 여덟 글자가 겹치는 자리</h2>'+
      '<p class="dek">사주가 흙의 언어라면 별자리는 빛의 언어입니다</p>'+
      '<p>여기까지 같은 사람을 두 번 읽었습니다. 태어난 시각을 옛 글자 여덟 자로 옮긴 것이 하나, '+
      '그 순간의 하늘을 별자리로 옮긴 것이 하나예요. 재는 방식이 아예 다릅니다. '+
      '그래서 <em>둘이 같은 곳을 가리키면</em> 그 지점은 웬만해선 틀리지 않습니다.</p>'+
      '<div class="tw"><table><thead><tr><th>결</th><th>별에서</th><th>여덟 글자에서</th><th>읽으면</th></tr></thead>'+
      '<tbody>'+crossRows+'</tbody></table></div>'+
      '<p class="mini">사주의 다섯 가운데 <em>금(쇠)</em>에 맞는 자리는 서양 쪽에 없습니다. '+
      '끊고 다듬는 결은 사주에서만 봅니다 — 여덟 글자에 금은 '+
      (fmap['금'] ? fmap['금']+'자 있었습니다.' : '한 자도 없었습니다.')+'</p>'+
      crossTxt);

    var topSip=it.top.map(function(t){ return t.sip; });
    page(
      '<p class="eyebrow">더 깊이 · 셋</p>'+
      '<h2>두 언어를 한 문장으로</h2>'+
      '<p>줄이면 이렇습니다. 여덟 글자로는 '+R.joinWa(topSip,'<em>','</em>')+
      (batchim(topSip[topSip.length-1])?'이':'가')+' 뼈대인 사람이고, '+
      '하늘로는 낮에 <em>'+st.sun.name+'</em>, 밤에 <em>'+msign+'</em>인 사람입니다. '+
      (hourKnown ? '처음 본 사람에게는 <em>'+st.ascendant.name+'</em>로 보이고, '+
                   '바깥에서는 <em>'+st.midheaven.name+'</em>의 자리에 놓입니다. ' : '')+
      '이 문장 하나면 오늘 읽은 것이 다 들어 있습니다.</p>'+
      '<p>별자리와 사주는 서로를 증명하지 않습니다. 하나가 맞다고 다른 하나가 맞는 게 아니에요. '+
      '다만 두 자로 잰 길이가 같게 나오면, 그 길이는 믿어도 됩니다. '+
      '위 표에서 <em>같은 말을 한 자리</em>가 그 길이입니다.</p>'+
      '<div class="voice"><div class="who">'+gname+'</div>'+
      '<p>태어난 순간 하늘엔 별이 있었죠. 그 별들은 '+esc(name)+'님에게 무엇이 되라고 하지 않았습니다. '+
      '다만 어느 쪽으로 서 있으면 덜 시린지를 그려두었을 뿐이에요. '+
      '오늘 그 그림을 보셨으니, 이제 그걸 흠으로 여기지 않으셔도 됩니다.</p></div>');

    /* ══ 3. 책에 끼워 넣습니다 ═════════════════════════════════ */
    var pages=box.getElementsByClassName('page');
    var anchor=null, i, eb;
    for(i=0;i<pages.length;i++){
      eb=pages[i].getElementsByClassName('eyebrow')[0];
      if(!eb){ continue; }
      if(eb.textContent==='마지막에 놓는 세 장'){ anchor=pages[i]; break; }
    }
    if(!anchor){
      for(i=0;i<pages.length;i++){
        eb=pages[i].getElementsByClassName('eyebrow')[0];
        if(!eb){ continue; }
        if(eb.textContent==='맺음말'){ anchor=pages[i]; break; }
      }
    }
    if(!anchor){ anchor=pages[pages.length-1]; }

    var hold=document.createElement('div');
    hold.innerHTML=made.join('');
    while(hold.firstChild){ anchor.parentNode.insertBefore(hold.firstChild, anchor); }

    renumber();
    evenOut();
    var lastW=window.innerWidth, timer=null;
    window.addEventListener('resize', function(){
      if(window.innerWidth===lastW){ return; }
      lastW=window.innerWidth;
      if(timer){ clearTimeout(timer); }
      timer=setTimeout(evenOut, 260);
    });
  }

  /* 쪽 번호를 다시 매깁니다 (표지는 번호가 없습니다) */
  function renumber(){
    var box=document.getElementById('ssb');
    if(!box){ return; }
    var pages=box.getElementsByClassName('page'), i, f, n=0;
    for(i=0;i<pages.length;i++){
      n+=1;
      f=pages[i].getElementsByClassName('folio')[0];
      if(f){ f.textContent=two(n); }
    }
    var bkN=document.getElementById('bkN');
    if(bkN){ bkN.textContent=n+'쪽'; }
  }

  /* 낱장 높이를 다시 하나로 맞춥니다 */
  function evenOut(){
    var box=document.getElementById('ssb');
    if(!box){ return; }
    var keep=window.pageYOffset;
    if(!keep){ keep=document.documentElement.scrollTop; }
    if(!keep){ keep=0; }
    var sheets=[].slice.call(box.getElementsByClassName('page'));
    sheets.forEach(function(el){ el.style.minHeight=''; });
    var tall=0;
    sheets.forEach(function(el){
      var h=el.getBoundingClientRect().height;
      if(h>tall){ tall=h; }
    });
    tall=Math.ceil(tall);
    sheets.forEach(function(el){ el.style.minHeight=tall+'px'; });
    if(keep>0){ window.scrollTo(0, keep); }
  }

  /* 앞의 렌더러가 책을 다 그린 뒤에 붙어야 합니다 */
  function go(){ setTimeout(start, 0); }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', go);
  } else { go(); }
})();
</script>

<script>
/* ═══ 문장이 끝나면 줄을 바꿉니다 (2026-08-31) ═══
   한 문단 안에서 문장이 어중간하게 이어져 붙어 보였습니다.
   마침표 뒤에서 줄을 바꿔 문장 하나가 한 줄로 서게 합니다.
   글자는 하나도 바꾸지 않고 줄만 바꿉니다.
   두 번 돌아도 안전합니다 — 이미 바꾼 자리는 마침표 뒤가 여백이 아니라
   태그라서 다시 잡히지 않습니다.
   주의 · 이 안에서 앰퍼샌드를 쓰지 않습니다. */
(function(){
  var stellaSentenceBreak=1;
  var root=null;

  function fix(){
    if(!root){ return; }
    var ps=root.getElementsByTagName('p');
    var i, h, n;
    for(i=0;i<ps.length;i++){
      h=ps[i].innerHTML;
      if(!h){ continue; }
      /* 링크가 든 문단은 건드리지 않습니다 */
      if(h.indexOf('<a ')>=0){ continue; }
      /* 마침표 뒤에 여백이 있고 그다음에 글자가 오면 줄을 바꿉니다.
         마침표 앞이 여백이나 마침표나 닫는 꺾쇠면 건너뜁니다 (1. 2. 같은 번호 매김 보호) */
      n=h.replace(/([^s.>0-9][.])s+(?=[^s<])/g, '$1<br>');
      if(n!==h){ ps[i].innerHTML=n; }
    }
  }

  function start(){
    root=document.getElementById('bkBook');
    if(!root){ setTimeout(start, 300); return; }
    fix();
    if(window.MutationObserver){
      var mo=new MutationObserver(function(){
        mo.disconnect();
        fix();
        mo.observe(root, {childList:true, subtree:true});
      });
      mo.observe(root, {childList:true, subtree:true});
    }
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>

      if(!A){ return ''; }
      var m=T[key];
      if(!m){ return ''; }
      return m[A.name] || '';
    }
    var a1=pick('solo'), a2=pick('form'), a3=pick('many');
    if(!a1){ return; }
    if(!a2){ return; }
    if(!a3){ return; }
    var ps=box.getElementsByTagName('p'), i, head=null;
    for(i=0;i<ps.length;i++){
      if(String(ps[i].textContent).indexOf('정리하면')===0){ head=ps[i]; break; }
    }
    if(!head){ return; }
    var page=head.parentNode;
    if(!page){ return; }
    var tail=head.nextSibling, gone=[];
    while(tail){
      if(tail.nodeType===1){
        if(String(tail.className).indexOf('mini')>=0){ break; }
        if(tail.tagName==='H2'){ break; }
        if(tail.tagName==='H3'){ break; }
        gone.push(tail);
      }
      tail=tail.nextSibling;
    }
    for(i=0;i<gone.length;i++){ page.removeChild(gone[i]); }
    var hold=document.createElement('div');
    hold.innerHTML =
      '<p>정리하면 — 세 가지가 보입니다.</p>'+
      '<p>· '+a1+'</p>'+
      '<p>· '+a2+'</p>'+
      '<p>· '+a3+'</p>'+
      '<p>'+T.close+'</p>';
    head.innerHTML='정리하면 — 세 가지가 보입니다.';
    var at=head.nextSibling;
    var kids=[].slice.call(hold.childNodes);
    for(i=1;i<kids.length;i++){
      if(at){ page.insertBefore(kids[i], at); }
      else { page.appendChild(kids[i]); }
    }
    var hrs=page.getElementsByTagName('hr');
    if(hrs.length>1){ hrs[0].parentNode.removeChild(hrs[0]); }
    var h3=box.getElementsByTagName('h3'), key, t;
    for(i=0;i<h3.length;i++){
      t=String(h3[i].textContent);
      if(t.indexOf('자리')<0){ continue; }
      if(t.indexOf('—')>=0){ continue; }
      for(key in EASY){
        if(!Object.prototype.hasOwnProperty.call(EASY,key)){ continue; }
        if(t.indexOf(key)!==0){ continue; }
        h3[i].innerHTML = EASY[key]+' <span style="font-weight:400;opacity:.72">— '+t+'</span>';
      }
    }
    box.setAttribute('data-sum','1');
  }
  function go(){ setTimeout(run, 60); setTimeout(run, 700); }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', go);
  } else { go(); }
})();
</script>

<script>
/* ═══ 계산 장들을 부록으로 ═══  APPX-5  2026-09-02
   네 번 고쳤는데 계속 물러납니다. 짐작을 그만하고 어느 문턴에서
   물러났는지를 화면에 찍게 만들었습니다.
   주소 뒤에 #appxdiag 를 붙이면 이유가 왼쪽 아래에 뜨고,
   안 붙이면 평소대로 일만 합니다.
   이 안에서 두 글자짜리 논리기호를 쓰지 않습니다. */
(function(){
  'use strict';
  var DIAG = (String(location.hash).indexOf('appxdiag')>=0);
  function two(n){ return (n<10?'0':'')+n; }

  function attempt(){
    var book=document.getElementById('bkBook');
    if(!book){ return '① bkBook 을 못 찾음'; }
    if(book.getAttribute('data-appx')==='1'){ return 'ok · 이미 옆겼음'; }
    if(book.getAttribute('data-folded')!=='1'){
      return '② 접기가 아직 · data-folded = ' + book.getAttribute('data-folded');
    }
    var pages=[].slice.call(book.getElementsByClassName('page'));
    if(pages.length<6){ return '③ 낱장이 ' + pages.length + '장뿐'; }

    var i, eb, endEl=null, endAt=-1;
    for(i=0;i<pages.length;i++){
      eb=pages[i].getElementsByClassName('eyebrow')[0];
      if(!eb){ continue; }
      if(String(eb.textContent).indexOf('1부')===0){ endEl=pages[i]; endAt=i; break; }
    }
    if(!endEl){
      var names=[];
      for(i=0;i<pages.length;i++){
        eb=pages[i].getElementsByClassName('eyebrow')[0];
        names.push(i + ':' + (eb ? String(eb.textContent) : '-'));
        if(i>7){ break; }
      }
      return '④ 1부를 못 찾음 · ' + names.join(' / ');
    }
    var holder=endEl.parentNode;
    if(!holder){ return '⑤ 담긴 곳이 없음'; }

    var startEl=pages[1];
    if(!startEl){ return '⑥ 여는 글이 없음'; }
    if(startEl.parentNode!==holder){
      return '⑦ 여는 글과 1부의 부모가 다름 · 1부는 ' + endAt + '번째 낱장';
    }

    var take=[], n=startEl.nextSibling, met=false;
    while(n){
      if(n===endEl){ met=true; break; }
      if(n.nodeType===1){ take.push(n); }
      n=n.nextSibling;
    }
    if(!met){ return '⑧ 여는 글에서 1부까지 못 걸어감 · 지난 것 ' + take.length + '개'; }
    if(take.length<1){ return '⑨ 옆길 것이 없음'; }
    if(take.length>12){ return '⑩ 옆길 것이 ' + take.length + '개 · 너무 많음'; }

    var cover=document.createElement('div');
    cover.className='page';
    cover.innerHTML=
      '<p class="eyebrow">부록</p>'+
      '<h2>이 책이 어떻게 나왔는지</h2>'+
      '<p class="dek">궁금하실 때만 텕보시면 됩니다</p>'+
      '<p>여기서부터는 계산입니다. 태어난 시각을 어떻게 바로잡았는지, '+
      '여덟 글자가 무엇인지, 오행과 대운이 무엇인지 — 앞에서 읽으신 이야기가 '+
      '전부 여기서 나왔습니다.</p>'+
      '<p>몰라도 앞의 이야기를 읽는 데에는 아무 지장이 없습니다. 다만 '+
      '<em>왜 그런 말이 나왔지</em> 싶으실 때 여기를 텕보시면 답이 있습니다.</p>'+
      '<div class="folio"></div>';

    holder.appendChild(cover);
    for(i=0;i<take.length;i++){ holder.appendChild(take[i]); }

    var all=book.getElementsByClassName('page'), f, cnt=0;
    for(i=0;i<all.length;i++){
      cnt+=1;
      f=all[i].getElementsByClassName('folio')[0];
      if(f){ f.textContent=two(cnt); }
    }
    var bkN=document.getElementById('bkN');
    if(bkN){ bkN.textContent=cnt+'쪽'; }

    var sheets=[].slice.call(book.getElementsByClassName('page'));
    sheets.forEach(function(el){ el.style.minHeight=''; });
    var tall=0;
    sheets.forEach(function(el){
      var h=el.getBoundingClientRect().height;
      if(h>tall){ tall=h; }
    });
    tall=Math.ceil(tall);
    sheets.forEach(function(el){ el.style.minHeight=tall+'px'; });

    book.setAttribute('data-appx','1');
    return 'ok · ' + take.length + '개를 옆겼습니다';
  }

  function show(msg){
    if(!DIAG){ return; }
    var d=document.getElementById('appxdiag');
    if(!d){
      d=document.createElement('div');
      d.id='appxdiag';
      d.style.cssText='position:fixed;left:10px;bottom:10px;z-index:99999;'+
        'background:#111;color:#eee;padding:12px 14px;border-radius:10px;'+
        'font:13px/1.6 system-ui;max-width:420px;border:1px solid #555';
      document.body.appendChild(d);
    }
    d.textContent='부록 : ' + msg;
  }

  var tries=0;
  function tick(){
    tries+=1;
    var r='';
    try{ r=attempt(); }catch(e){ r='✖ ' + (e ? e.message : '오류'); }
    show(r + '  (' + tries + '번째)');
    if(String(r).indexOf('ok')===0){ return; }
    if(String(r).indexOf('✖')===0){ return; }
    if(tries>60){ return; }
    setTimeout(tick, 400);
  }
  function go(){ setTimeout(tick, 1200); }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', go);
  } else { go(); }
})();
</script>

<script>
/* 직성의 신 1부 · 긴 글로 다시 쓴 것  LENS-LONG-2  2026-09-02
   직장운만 한 자리당 600~700자이고 나머지 다섯 주제는 200자 안팎이었습니다.

   한마디로 · 그러니 이렇게.

   0번 조각을 건드리지 않고 그 위에 덮어씁니다.

   이 안에서 두 글자짜리 논리기호를 쓰지 않습니다. */
(function(){
  'use strict';
  var prev = window.__stellaCareerLens;

  var MORE = {
  '취업운':{
    '비겁':'남 밑에서 시작하는 것을 유난히 어려워하는 자리입니다. 면접에서도 시키는 대로 하겠다는 말이 잘 안 나와요.</p><p>이를테면 「저는 이렇게 해보고 싶습니다」가 먼저 나와서 면접관이 갸웃하거나, 신입인데도 자기 방식이 있어서 부딪히거나, 규칙이 빡빡한 곳일수록 답답해지는 것이 여기에 해당해요.</p><p>반대로 알아서 하라고 맡겨주는 곳에 들어가면 사람이 완전히 달라집니다. 같은 사람이 다른 사람처럼 일해요.</p><p>다만 첫 자리에서 자주 부딪힙니다.</p><p>「시키는 것만 하면 되는데 왜 자꾸 의견을 내냐」는 말을 들으셨거나, 몇 달 못 버티고 나온 자리가 있으실 거예요.</p><p>한마디로 <em>지시받는 자리에서는 작아지고, 맡기는 자리에서는 커지는 사람</em>이에요.</p><p>회사 이름보다 얼마나 맡기는 곳인지를 먼저 보세요. 면접에서 「제가 맡게 될 범위가 어디까지인가요」를 꼭 물어보시고요.',
    '식상':'보여줄 것이 있을 때 붙는 자리입니다. 말로 설명하는 면접보다 만든 것을 꺼내 보이는 자리에서 훨씬 잘 되세요.</p><p>이를테면 포트폴리오 한 장이 이력서 세 장보다 크게 먹히거나, 과제 전형에서 뒤집으시거나, 「이건 제가 만든 겁니다」 하고 꺼낸 순간 분위기가 바뀌는 것이 여기에 해당해요.</p><p>반대로 서류와 스펙만으로 줄 세우는 곳에서는 실력보다 낮게 매겨집니다.</p><p>다만 보여줄 것을 만드는 데 시간을 안 쓰고 지원만 계속하기 쉽습니다.</p><p>이력서만 스무 곳에 넣고 「왜 연락이 안 오지」 하신 적이 있으실 거예요.</p><p>한마디로 <em>이력서보다 만든 것으로 붙는 사람</em>입니다.</p><p>지원하는 시간의 절반은 보여줄 것을 만드는 데 쓰세요. 열 곳에 넣을 시간에 다섯 곳에 넣고 나머지로 하나 만드시는 편이 빠릅니다.',
    '재성':'조건을 또렷하게 볼 줄 아는 자리입니다. 연봉과 대우를 따지는 것이 속물이 아니라 당신에게는 맞는 기준이에요.</p><p>이를테면 남들이 「일단 들어가고 보자」 할 때 혼자 조건표를 만들어 비교하시거나, 그 기준으로 고르신 자리에서 오래 다니셨거나, 조건이 애매한 곳은 결국 안 가게 되는 것이 여기에 해당해요.</p><p>반대로 조건은 안 보고 사람만 보고 들어간 자리에서는 얼마 못 갑니다.</p><p>다만 조건만 보고 들어가서 사람 때문에 나오기도 합니다.</p><p>연봉은 딱 맞았는데 같이 일하는 사람이 안 맞아 반년 만에 나오신 적이 있으실 거예요.</p><p>한마디로 <em>조건을 보는 눈은 정확한데, 사람은 한 번 더 봐야 하는 사람</em>이에요.</p><p>들어가시기 전에 그곳에 다니는 사람 한 명은 만나보세요. 조건표에 「같이 일할 사람」 칸을 하나 더 만드시면 됩니다.',
    '관성':'들어가는 문이 정해진 곳이 맞는 자리입니다. 공채나 자격이나 시험처럼 절차가 있는 쪽에서 오히려 잘 붙으세요.</p><p>이를테면 서류와 인적성과 면접으로 이어지는 큰 회사 전형에서 강하시거나, 시험 날짜가 정해지면 그때부터 사람이 달라지거나, 「언제까지 뭘 내면 된다」가 있어야 마음이 놓이는 것이 여기에 해당해요.</p><p>반대로 아는 사람 소개로 흐지부지 들어간 자리는 들어가서도 마음이 안 놓입니다.</p><p>다만 준비 기간이 길어집니다.</p><p>남들 다 취업할 때 혼자 시험 준비를 하고 계셔서 조급했던 적이 있으실 거예요.</p><p>한마디로 <em>정해진 문으로 들어갈 때 가장 강한 사람</em>입니다.</p><p>준비 기간이 길어도 그 길이 당신에게는 빠른 길이에요. 다만 끝나는 날은 미리 적어두세요.',
    '인성':'자격과 문서가 열쇠가 되는 자리입니다. 배워둔 것과 따둔 것이 실제로 문을 엽니다.</p><p>이를테면 남들이 「그거 쓸데없다」던 공부가 지원 자격이 되어 있거나, 자격증 하나로 지원할 수 있는 곳이 갑자기 늘거나, 이력서에 쓸 게 없다 싶었는데 배운 것들을 모아보니 한 줄이 되는 것이 여기에 해당해요.</p><p>반대로 자격이나 배움과 상관없이 몸으로 때우는 자리에서는 오래 못 버팁니다.</p><p>다만 준비를 끝내는 날을 스스로 못 정하십니다.</p><p>「아직 덜 됐다」 싶어 지원을 미루다가 공고가 닫힌 적이 있으실 거예요.</p><p>한마디로 <em>준비가 힘이 되는 사람인데, 지원을 미루는 것이 가장 큰 손해인 사람</em>입니다.</p><p>아직 덜 됐다 싶어도 한 번 넣어보세요. 떨어져도 그 과정이 다음 준비가 됩니다.'},
  '이직운':{
    '비겁':'지금 자리에서 인정을 못 받는다고 느낄 때 움직이는 자리입니다. 돈보다 대접이 이유인 경우가 많아요.</p><p>이를테면 내가 한 일을 다른 사람이 발표하는 걸 보고 마음이 식거나, 연봉은 그대로여도 「여기서는 나를 안 봐준다」 싶어 알아보기 시작하거나, 옮기고 나서 돈은 비슷한데 훨씬 편해지신 적이 있는 것이 여기에 해당해요.</p><p>반대로 대접받는 자리에서는 조건이 조금 모자라도 오래 버티십니다.</p><p>다만 홧김에 정하기 쉽습니다.</p><p>크게 상한 날 바로 이력서를 열어 그 주에 지원해버리신 적이 있으실 거예요.</p><p>한마디로 <em>대접받는 자리로 가야 하는 사람인데, 화가 난 날에는 정하면 안 되는 사람</em>이에요.</p><p>마음이 상한 날로부터 이레는 두고 정하세요. 그날 쓴 이력서는 이레 뒤에 다시 읽어보시고요.',
    '식상':'만들 것이 없어지면 옮기고 싶어지는 자리입니다. 회사가 나쁘지 않은데 지루해서 나오려는 것이라면 그건 충분히 맞는 이유예요.</p><p>이를테면 일이 손에 익어 눈 감고도 하게 된 순간부터 마음이 뜨거나, 새 일이 생기면 갑자기 회사가 좋아지거나, 옮길 데를 알아보면서 「거기 가면 뭘 만들 수 있지」부터 보는 것이 여기에 해당해요.</p><p>반대로 만들 것이 계속 생기는 자리에서는 조건이 좀 나빠도 안 나가십니다.</p><p>다만 옮겨도 만들 것이 없으면 반년 만에 똑같아집니다.</p><p>회사를 옮겼는데 하는 일이 똑같아서 또 답답해지신 적이 있으실 거예요.</p><p>한마디로 <em>회사를 바꾸는 것보다 하는 일을 바꿔야 하는 사람</em>입니다.</p><p>옮기실 곳에서 무엇을 만들게 되는지를 먼저 확인하세요. 그게 안 보이면 회사 이름이 좋아도 반년입니다.',
    '재성':'숫자로 값을 매길 수 있을 때 옮기기 좋은 자리입니다. 내가 낸 성과를 숫자로 정리하실 수 있으면 협상에서 강해져요.</p><p>이를테면 「제가 맡은 뒤로 이만큼 올랐습니다」 한 장으로 조건이 달라지거나, 면접에서 숫자를 꺼낸 순간 상대의 태도가 바뀌거나, 연봉 협상에서 물러서지 않고 버티신 적이 있는 것이 여기에 해당해요.</p><p>반대로 성과가 숫자로 안 나오는 자리에서는 값을 제대로 못 받으십니다.</p><p>다만 말로만 하면 손해를 봅니다.</p><p>「알아서 챙겨주시겠죠」 하고 들어갔다가 일 년 뒤에 후회하신 적이 있으실 거예요.</p><p>한마디로 <em>말로 하면 손해 보고, 숫자로 하면 이기는 사람</em>이에요.</p><p>옮기시기 전에 지난 몇 해를 숫자로 한 장 정리해두세요. 그 한 장이 연봉을 정합니다.',
    '관성':'자리와 직책이 올라가는 이직이어야 마음이 놓이는 자리입니다. 옆으로 가는 이동은 옮기고도 계속 아쉬우세요.</p><p>이를테면 연봉이 더 높은데도 직책이 그대로여서 망설이시거나, 팀장이라는 한 글자 때문에 조건이 조금 낮은 곳을 고르시거나, 맡는 범위가 커지면 힘들어도 신이 나는 것이 여기에 해당해요.</p><p>반대로 하는 일은 같고 회사만 바뀌는 이동에서는 반년 뒤에 또 지칩니다.</p><p>다만 그 자리에 맞춰 책임도 같이 커집니다.</p><p>직책은 올라갔는데 사람 관리까지 떠안아 몸이 상하신 적이 있으실 거예요.</p><p>한마디로 <em>얼마를 더 받느냐보다 무엇을 맡느냐가 중요한 사람</em>입니다.</p><p>직책이 그대로인 이직은 한 번 더 생각해보세요. 대신 맡는 범위가 커진다면 조건이 조금 모자라도 괜찮습니다.',
    '인성':'배울 것이 있는 곳으로 가야 하는 자리입니다. 조건이 좋아도 더 배울 게 없는 곳에 가면 금방 시들해지세요.</p><p>이를테면 면접에서 「여기서 뭘 배울 수 있나요」를 먼저 묻게 되거나, 배우고 싶은 사람이 있는 팀이면 연봉을 낮춰서라도 가시거나, 가르쳐줄 사람이 없는 자리는 조건이 좋아도 안 끌리는 것이 여기에 해당해요.</p><p>반대로 배울 것이 있으면 조금 덜 받아도 잘 버티십니다.</p><p>다만 배움을 핑계로 조건을 계속 양보하기 쉽습니다.</p><p>「여기서 배우면 되지」 하며 몇 해째 같은 연봉이신 적이 있으실 거예요.</p><p>한마디로 <em>사람과 배움을 보고 옮겨야 하는 사람</em>입니다.</p><p>옮기실 곳에 배우고 싶은 사람이 있는지를 꼭 보세요. 다만 배우는 값으로 연봉을 깎는 것은 두 해까지만 하세요.'},
  '퇴사운':{
    '비겁':'참다가 한 번에 정하는 자리입니다. 오래 견디다가 어느 날 갑자기 마음을 접으세요.</p><p>이를테면 몇 달을 아무 말 없이 다니다가 어느 아침에 사표를 쓰시거나, 주변에서 「갑자기 왜?」 하는데 본인 안에서는 이미 반년 전에 끝나 있거나, 한 번 마음이 떠나면 되돌리기가 안 되는 것이 여기에 해당해요.</p><p>반대로 마음이 붙어 있는 동안에는 어지간해서는 안 나가십니다.</p><p>다만 그날 바로 말해버리면 챙길 수 있는 것을 하나도 못 챙깁니다.</p><p>퇴직금과 연차와 인수인계 조건을 하나도 못 챙기고 나오신 적이 있거나, 앞으로 있을 수 있습니다.</p><p>한마디로 <em>마음은 이미 정해졌는데, 말하는 날은 며칠 미뤄야 이득인 사람</em>이에요.</p><p>접겠다고 마음먹은 날로부터 이레는 두고 말하세요. 그 이레에 챙길 것을 적으시면 됩니다.',
    '식상':'만들 것이 없어서 그만두는 자리입니다. 사람이 힘든 것보다 하는 일이 재미없는 것이 더 큰 이유예요.</p><p>이를테면 「사람은 다 좋은데 일이 지겹다」가 나오거나, 그만두고 쉬는 동안에도 뭔가 만들고 계시거나, 나가서 할 것이 떠오르는 순간 마음이 정해지는 것이 여기에 해당해요.</p><p>반대로 만들 것이 있는 동안에는 야근을 해도 안 나가십니다.</p><p>다만 쉬는 동안 손이 놀지 않아 제대로 못 쉽니다.</p><p>쉬려고 나왔는데 한 달 만에 새 일을 벌이고 계신 적이 있으실 거예요.</p><p>한마디로 <em>쉬어도 손이 놀지 않는 사람</em>입니다.</p><p>나오시기 전에 나가서 만들 것을 하나 정해두세요. 그게 있으면 쉬는 시간이 준비 기간이 됩니다.',
    '재성':'나가서 벌 수 있는지가 정해져야 움직이는 자리입니다. 마음만으로는 못 나오시고 숫자가 맞아야 나오세요.</p><p>이를테면 몇 달 치 생활비를 계산해보고 나서야 결심이 서거나, 다음 자리가 정해지기 전에는 절대 안 나가시거나, 「지금 나가면 얼마가 빈다」가 머릿속에 늘 있는 것이 여기에 해당해요.</p><p>반대로 숫자가 안 맞으면 아무리 힘들어도 버티십니다.</p><p>다만 그 버팀이 길어지면 몸이 먼저 상합니다.</p><p>「올해만 참자」가 삼 년째인 적이 있으실 거예요.</p><p>한마디로 <em>계산이 서야 나올 수 있는 사람</em>이에요.</p><p>나가서 몇 달을 버틸 수 있는지 먼저 적어보세요. 그 숫자가 나올 날짜를 정해줍니다.',
    '관성':'그만두는 것을 제일 어려워하는 자리입니다. 맡은 일을 두고 나오는 것이 잘 안 되세요.</p><p>이를테면 인수인계를 완벽하게 하려다 나오는 날이 두 달 밀리거나, 후임이 정해질 때까지 못 나가시거나, 나 없으면 이 일이 안 돌아간다는 생각에 발이 묶이는 것이 여기에 해당해요.</p><p>반대로 책임이 넘어간 뒤에는 미련 없이 돌아서십니다.</p><p>다만 그 책임감이 발목을 잡습니다.</p><p>나가겠다고 말한 뒤로 반년을 더 다니신 적이 있으실 거예요.</p><p>한마디로 <em>책임을 다하고 나오는 사람인데, 그 책임이 발목을 잡는 사람</em>이에요.</p><p>나올 날짜를 먼저 적고 거기에 맞춰 정리하세요. 순서만 바꾸시면 됩니다. 회사는 당신 없이도 돌아갑니다.',
    '인성':'다음에 배울 것이 정해져야 나올 수 있는 자리입니다. 그냥 쉬는 것은 오히려 불안하세요.</p><p>이를테면 학원이나 대학원을 알아보고 나서야 사표를 쓰시거나, 「쉬면서 자격증 하나 따야지」가 나오거나, 배울 것이 정해지면 그때 마음이 놓이는 것이 여기에 해당해요.</p><p>반대로 아무 계획 없이 쉬는 기간에는 오히려 더 지치십니다.</p><p>다만 배우는 것이 도피가 되기도 합니다.</p><p>자격증을 따고 나서도 「하나만 더」 하며 다음 자리를 미루신 적이 있으실 거예요.</p><p>한마디로 <em>쉬는 것보다 배우는 것이 쉬는 것인 사람</em>입니다.</p><p>배울 것을 정하시되 언제까지 배울지 끝나는 날을 함께 적어두세요. 그 날짜가 배움을 도피가 아니게 만들어 줍니다.'},
  '사업운':{
    '비겁':'내 이름을 걸고 굴릴 때 힘이 붙는 자리입니다. 남이 정해준 방식으로 하면 내 가게인데도 남의 가게 같아져요.</p><p>이를테면 남 밑에서 몇 해 일하다가 「이건 내가 하면 더 잘하겠는데」 싶어 나오시거나, 프랜차이즈를 알아보다가 본사가 정해주는 게 많다는 걸 알고 마음이 식거나, 같은 물건을 팔아도 내 간판을 걸어야 손이 가는 것이 여기에 해당해요.</p><p>반대로 남이 다 짜놓은 틀 안에서 시키는 대로만 굴려야 하는 자리에서는 금방 시들해집니다. 돈이 되더라도 재미가 없어져요.</p><p>다만 동업 이야기가 유난히 자주 들어옵니다. 같은 것을 원하는 사람이 곁에 붙기 때문인데, 그래서 안될 때보다 잘될 때 다툽니다.</p><p>「우리 사이에 뭘 그런 걸 적냐」 하고 넘어갔다가 몇 해 뒤에 몫을 두고 얼굴 붉히신 적이 있거나, 앞으로 있을 수 있습니다.</p><p>한마디로 <em>내 이름으로 굴릴 때 사는데, 같이 하기로 한 순간부터 조건을 글로 남겨야 하는 사람</em>이에요.</p><p>시작하기 전에 몫과 나가는 방법을 종이에 적어두세요. 사이가 좋을 때 적어야 합니다. 나중에 사이가 틀어져도 그 종이가 두 분을 지켜줍니다.',
    '식상':'만들어서 내놓는 것으로 먹고사는 자리입니다. 남의 물건을 떼다 파는 것보다 내가 궁리한 것을 파실 때 훨씬 오래 갑니다.</p><p>이를테면 손님이 「이건 여기서만 살 수 있네」 하는 물건 하나가 가게 전체를 먹여 살리거나, 남들 다 하는 메뉴 옆에 내가 만든 것 하나를 얹었더니 그게 대표가 되거나, 만드는 과정을 보여주는 것만으로 손님이 붙는 것이 여기에 해당해요.</p><p>반대로 정해진 것을 그대로 떼다 파는 자리에서는 금방 지루해집니다. 남는 게 좋아도 손이 안 갑니다.</p><p>다만 만드는 재미에 빠져 파는 일을 뒤로 미루기 쉽습니다.</p><p>새 물건을 계속 만들면서 정작 지난달에 만든 것은 아직 제대로 안 팔고 계시거나, 「이것만 더 다듬고 올려야지」 하다가 철이 지나버린 적이 있으실 거예요.</p><p>한마디로 <em>만드는 힘은 넉넉한데, 만든 것을 끝까지 파는 데 힘을 더 써야 하는 사람</em>입니다.</p><p>만드는 날과 파는 날을 달력에 나눠 적어두세요. 파는 날에는 새로 만들지 않기로 하시면 그것만으로 매출이 달라집니다.',
    '재성':'돈이 실제로 도는 자리에 있어야 사업이 붙습니다. 사서 팔든 만들어 팔든, 들어오고 나가는 숫자가 눈앞에 보여야 판단이 서세요.</p><p>이를테면 하루 매출을 손으로 적어보고 나서야 다음 달 계획이 잡히거나, 원가를 따져보다가 안 되겠다 싶어 접은 일이 결과적으로 잘한 선택이었거나, 남들이 감으로 벌일 때 혼자 계산기를 두드리다 뒤늦게 들어가서 오히려 안전했던 것이 여기에 해당해요.</p><p>반대로 돈이 언제 들어올지 모르는 일, 몇 해 뒤를 보고 심어두는 일에서는 마음이 안 놓입니다.</p><p>다만 감으로 굴리면 잘될 때는 크게 잘되는데 무너질 때도 한 번에 무너집니다.</p><p>매출은 늘었는데 통장은 그대로인 달을 겪어보셨거나, 「이번 달 잘 벌었네」 했는데 세금 내고 나니 남는 게 없던 적이 있으실 거예요.</p><p>한마디로 <em>버는 자리는 타고났는데, 남기는 셈은 일부러 배워야 하는 사람</em>입니다.</p><p>들어온 돈과 남은 돈을 따로 적어두세요. 통장을 둘로 나누는 것만으로도 반은 해결됩니다.',
    '관성':'혼자 시작해도 결국 틀을 세우게 되는 자리입니다. 사람을 쓰고 순서를 만들고 나서야 사업이 커져요.</p><p>이를테면 혼자 할 때는 그럭저럭이던 것이 사람 두엇 붙으면서 갑자기 정리되거나, 남들은 귀찮아하는 장부와 순서를 만들어두고 그걸로 버티거나, 거래처가 「저 집은 약속을 지킨다」고 해서 일이 계속 들어오는 것이 여기에 해당해요.</p><p>반대로 규모가 작고 그날그날 되는 대로 굴러가는 자리에서는 오히려 답답합니다. 사람이 붙기 시작하면 그때 힘이 납니다.</p><p>다만 시작이 늦습니다.</p><p>다 준비해놓고 「조금만 더 알아보고」 하며 몇 달을 보내신 적이 있거나, 자리까지 봐놓고 계약을 못 해 놓치신 적이 있으실 거예요.</p><p>한마디로 <em>키우는 데는 강한데, 시작하는 날을 스스로 못 정하는 사람</em>이에요.</p><p>여는 날을 먼저 달력에 적고 거기에 맞춰 준비하세요. 팔 할쯤 됐다 싶으면 그날 여시면 됩니다. 나머지 이 할은 열고 나서 채워집니다.',
    '인성':'배운 것을 파는 자리입니다. 가르치거나, 자격으로 하거나, 아는 것을 정리해 파는 쪽이 맞아요.</p><p>이를테면 남들이 「그건 왜 배워?」 하던 공부가 몇 해 뒤에 그대로 사업이 되거나, 자격증 하나가 남들은 못 들어가는 문을 열어주거나, 아는 것을 정리해 올린 글 하나로 손님이 찾아오는 것이 여기에 해당해요.</p><p>반대로 배울 것이 없고 몸으로 때우기만 하는 자리에서는 오래 못 버팁니다.</p><p>다만 준비만 길어집니다.</p><p>「하나만 더 배우고 시작하겠다」 하다가 때를 넘기시거나, 강의를 열 개 사놓고 다 못 들은 채 또 사시는 것도 같은 모습이에요.</p><p>한마디로 <em>아는 것이 밑천인데, 그 밑천을 언제 꺼낼지 날짜를 정해야 하는 사람</em>입니다.</p><p>배우는 기간을 끝나는 날까지 함께 적어두세요. 그날 이후로는 배운 것으로 버시면 됩니다. 그 날짜가 준비를 사업으로 바꿔줍니다.'},
  '재물운':{
    '비겁':'내 힘으로 벌어야 손에 남는 자리입니다. 남이 주는 돈보다 내가 만든 돈이 훨씬 오래 붙어 있어요.</p><p>이를테면 월급 말고 따로 벌어본 돈이 더 기억에 남거나, 남이 좋다는 것보다 내가 아는 쪽에 넣었을 때 결과가 낫거나, 돈 이야기를 남에게 맡기면 마음이 안 놓이는 것이 여기에 해당해요.</p><p>반대로 가만히 두면 알아서 불어나는 방식에는 손이 잘 안 갑니다.</p><p>다만 사람에게 나가는 돈이 유난히 많습니다.</p><p>빌려주고 못 받은 돈이 있거나, 밥값을 늘 내는 쪽이시거나, 「나중에 주면 되지」 하다가 흐지부지된 적이 있으실 거예요.</p><p>한마디로 <em>버는 힘은 내 안에 있는데, 새는 자리는 늘 사람 쪽인 사람</em>입니다.</p><p>빌려주는 돈은 못 받아도 되는 만큼만 하세요. 그리고 사람에게 나가는 돈을 한 달만 적어보시면 놀라실 겁니다.',
    '식상':'만들어서 버는 자리입니다. 월급 하나보다 내가 만든 것에서 돈이 나올 때 훨씬 커져요.</p><p>이를테면 취미로 하던 것이 돈이 되거나, 부업으로 시작한 것이 본업 수입을 넘어서거나, 「이걸 팔면 사겠는데」 싶은 것이 자꾸 떠오르는 것이 여기에 해당해요.</p><p>반대로 정해진 돈만 들어오는 구조에서는 답답해집니다.</p><p>다만 버는 만큼 쓰는 것도 시원시원합니다.</p><p>많이 번 달에 그만큼 써버려서 남은 게 없던 적이 있으실 거예요.</p><p>한마디로 <em>버는 갈래는 여럿 만드는데, 남기는 칸은 따로 만들어야 하는 사람</em>입니다.</p><p>들어오면 먼저 떼어놓으세요. 남는 걸 모으는 게 아니라 떼고 남은 걸 쓰는 순서로 바꾸시면 됩니다.',
    '재성':'돈 자체를 다루는 자리입니다. 버는 감각이 타고난 쪽이에요.</p><p>이를테면 어디에 돈이 도는지 남보다 빨리 아시거나, 값을 매기는 눈이 정확하거나, 같은 물건을 사도 더 싸게 사고 더 비싸게 파는 것이 여기에 해당해요.</p><p>반대로 돈이 안 도는 자리에 오래 있으면 힘이 빠집니다.</p><p>다만 버는 힘과 남기는 힘은 서로 다른 힘입니다.</p><p>매출은 늘었는데 통장은 그대로인 해를 겪어보셨거나, 「이만큼 벌었는데 왜 없지」 싶으신 적이 있으실 거예요.</p><p>한마디로 <em>버는 자리는 타고났는데, 남기는 셈은 일부러 배워야 하는 사람</em>입니다.</p><p>모으는 힘은 타고나기보다 손이 잘 안 닿는 곳에 얼마를 두느냐로 정해집니다. 그 한 칸을 정하는 것이 올해 할 일이에요.',
    '관성':'정해진 돈이 정해진 날에 들어와야 마음이 놓이는 자리입니다. 큰돈보다 끊기지 않는 돈이 맞아요.</p><p>이를테면 월급날이 정해져 있어야 계획이 서거나, 들쭉날쭉한 수입에는 불안해서 못 견디시거나, 적금처럼 정해진 것을 꼬박꼬박 넣는 게 편한 것이 여기에 해당해요.</p><p>반대로 크게 걸어서 크게 먹는 방식에는 손이 안 갑니다. 그게 흠이 아니라 맞는 방식이에요.</p><p>다만 크게 늘리는 데는 약합니다.</p><p>남들이 크게 벌었다는 이야기에 흔들려 안 하던 걸 했다가 손해 보신 적이 있으실 거예요.</p><p>한마디로 <em>지키는 힘은 타고났는데, 늘리려다 잃기 쉬운 사람</em>입니다.</p><p>늘리는 몫은 잃어도 되는 만큼만 떼어두세요. 나머지는 하던 대로 하시는 것이 당신에게는 가장 빠른 길입니다.',
    '인성':'아는 것과 문서로 버는 자리입니다. 배운 것이 그대로 값이 됩니다.</p><p>이를테면 자격이나 이름값으로 돈이 붙거나, 알아본 뒤에 정한 것은 결과가 좋고 남 말 듣고 정한 것은 안 좋거나, 계약서와 서류를 꼼꼼히 봐서 손해를 면하신 적이 있는 것이 여기에 해당해요.</p><p>반대로 알아보지 않고 급하게 정한 돈 문제에서는 꼭 탈이 납니다.</p><p>다만 알아보기만 하다가 때를 놓칩니다.</p><p>반년을 공부하고 나서 움직였는데 이미 값이 오른 뒤였던 적이 있으실 거예요.</p><p>한마디로 <em>알아보고 정하면 이기는데, 알아보다가 때를 놓치는 사람</em>입니다.</p><p>알아보는 기간을 정해두세요. 그날이 되면 그때까지 안 것으로 정하시면 됩니다. 완벽히 알고 정하는 날은 오지 않습니다.'}
  };

  window.__stellaCareerLens = function(){
    if(prev){ try{ prev(); }catch(e){} }
    function read(k){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
    var order=read('stella_demo');
    if(!order){ return; }

    if(!G){ return; }

    var k;
    for(k in t){
      if(Object.prototype.hasOwnProperty.call(t,k)){ g.lens[k]=t[k]; }
    }
  };
})();

  function fill(){
    var box=document.getElementById('ssb');
    if(!box){ return false; }
    if(box.getAttribute('data-moontxt')==='1'){ return true; }

    var ps=box.getElementsByTagName('p'), i, head=null;
    for(i=0;i<ps.length;i++){
      if(String(ps[i].textContent).indexOf('당신의 달은')>=0){ head=ps[i]; break; }
    }
    if(!head){ return false; }

    var em=head.getElementsByTagName('em')[0];
    if(!em){ return false; }
    var sign=String(em.textContent).replace(/\s+/g,'');
    var T=M[sign];
    if(!T){ box.setAttribute('data-moontxt','1'); return true; }

    var next=head.nextSibling;
    while(next){
      if(next.nodeType===1){ break; }
      next=next.nextSibling;
    }
    if(!next){ return false; }
    if(next.tagName!=='P'){ return false; }

    next.innerHTML = T.night;

    var html='<p>이를테면 이런 것들이에요.</p>';
    for(i=0;i<T.signs.length;i++){ html+='<p>· '+T.signs[i]+'</p>'; }
    html+='<p>'+T.story+'</p>';

    var hold=document.createElement('div');
    hold.innerHTML=html;
    var at=next.nextSibling;
    while(hold.firstChild){
      if(at){ next.parentNode.insertBefore(hold.firstChild, at); }
      else { next.parentNode.appendChild(hold.firstChild); }
    }

    var sheets=[].slice.call(box.getElementsByClassName('page'));
    sheets.forEach(function(el){ el.style.minHeight=''; });
    var tall=0;
    sheets.forEach(function(el){
      var h=el.getBoundingClientRect().height;
      if(h>tall){ tall=h; }
    });
    tall=Math.ceil(tall);
    sheets.forEach(function(el){ el.style.minHeight=tall+'px'; });

    box.setAttribute('data-moontxt','1');
    return true;
  }

  var tries=0;
  function tick(){
    tries+=1;
    var done=false;
    try{ done=fill(); }catch(e){ done=true; }
    if(done){ return; }
    if(tries>60){ return; }
    setTimeout(tick, 400);
  }
  function go(){ setTimeout(tick, 1500); }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', go);
  } else { go(); }
})();
</script>

    '비겁':'스스로 판을 여는 힘이 강한 자리라 삼재라도 크게 흔들리지 않습니다.</p><p>이를테면 주변이 어수선한데 나만 할 일을 하고 있거나, 남들이 몸을 사릴 때 오히려 기회를 잡거나, 「삼재라던데」 하면서도 별일 없이 지나가는 것이 여기에 해당해요.</p><p>반대로 남이 벌인 일에 얹혀 가는 해에는 그 사람의 흔들림이 그대로 넘어옵니다.</p><p>다만 사람 때문에 흔들립니다.</p><p>믿었던 사람과 틀어지거나 돈이 걸린 일에서 얼굴 붉히는 일이 이 시기에 잘 생깁니다.</p><p>한마디로 <em>일보다 사람에서 삼재가 오는 자리</em>입니다.</p><p>이 시기에는 새 동업과 보증을 피하세요. 그것만 안 하시면 크게 넘어갑니다.',
    '식상':'내놓는 힘이 강한 자리라 삼재에도 할 일이 있습니다.</p><p>이를테면 답답한 시기에 오히려 말이나 글이나 만든 것이 늘거나, 힘든 이야기를 꺼내놓고 나서 풀리거나, 그 시기에 시작한 것이 나중에 밥이 되는 것이 여기에 해당해요.</p><p>반대로 아무것도 안 하고 조용히 지나가려고만 하면 오히려 답답해집니다.</p><p>다만 말이 화가 되기 쉽습니다.</p><p>그 시기에 한 말 때문에 오해를 사거나 구설에 오른 적이 있으실 수 있어요.</p><p>한마디로 <em>내놓아야 풀리는데, 말은 한 번 걸러야 하는 자리</em>입니다.</p><p>하고 싶은 말은 하루 두었다 하세요. 만드는 것은 마음껏 하시고요.',
    '재성':'거두는 자리라 삼재에도 돈은 돕니다.</p><p>이를테면 주변은 어렵다는데 나는 그러저러 돌아가거나, 이 시기에 오히려 벌이가 생기거나, 남들이 못 보는 자리를 보시는 것이 여기에 해당해요.</p><p>반대로 벌이가 끊기는 자리에 있으면 삼재가 크게 느껴집니다.</p><p>다만 벌리는 만큼 나가는 곳도 늘어납니다.</p><p>그 시기에 큰돈이 나갈 일이 겹치거나, 빌려주고 못 받는 일이 생길 수 있어요.</p><p>한마디로 <em>버는 것은 되는데, 나가는 자리를 막아야 하는 자리</em>입니다.</p><p>이 시기에는 새로 크게 넣지 마시고 있는 것을 지키세요.',
    '관성':'맡는 자리라 삼재에 일이 몰립니다.</p><p>이를테면 하필 이 시기에 자리가 올라가거나, 남들이 피하는 일을 떠맡게 되거나, 책임이 갑자기 늘어나는 것이 여기에 해당해요.</p><p>반대로 맡을 것이 없는 시기라면 오히려 조용히 지나갑니다.</p><p>다만 그 무게에 몸이 먼저 상합니다.</p><p>삼재 때 크게 앓거나 몸에 탈이 나신 적이 있으실 수 있어요.</p><p>한마디로 <em>일은 잘 풀리는데 몸이 먼저 무너질 수 있는 자리</em>입니다.</p><p>이 시기에는 일보다 몸을 먼저 챙기세요. 검진 한 번 받아두시는 것으로 충분합니다.',
    '인성':'배우고 물러나는 자리라 삼재를 가장 무난하게 넘깁니다.</p><p>이를테면 이 시기에 오히려 공부를 시작하거나, 한 발 물러나 있어서 큰 파도를 피하거나, 남들 흔들릴 때 조용히 준비하시는 것이 여기에 해당해요.</p><p>반대로 이 시기에 억지로 나서면 탈이 납니다.</p><p>다만 너무 웅크려서 기회까지 놓치기 쉽습니다.</p><p>삼재라고 아무것도 안 하다가 좋은 자리를 흘려보내신 적이 있을 수 있어요.</p><p>한마디로 <em>물러나 있으면 무사한데, 아예 멈추면 아까운 자리</em>입니다.</p><p>크게 벌이지는 마시되 배우는 것 하나는 붙잡고 계세요.'},
  '초년':{
    '비겁':'스스로 판을 여는 힘이 일찍부터 있던 자리입니다.</p><p>이를테면 어릴 때부터 시키는 대로 안 하고 자기 방식이 있었거나, 형제나 친구 사이에서 앞에 서는 쪽이었거나, 부모 말을 그대로 따르기보다 부딪히는 일이 많았던 것이 여기에 해당해요.</p><p>반대로 눌러 놓는 환경에서는 초년이 유난히 답답했을 겁니다.</p><p>다만 그 시기에 도와줄 사람이 적었습니다.</p><p>혼자 알아서 해야 했거나, 물어볼 데가 없어 돌아간 길이 있으셨을 거예요.</p><p>한마디로 <em>일찍부터 자기 힘으로 섬는데, 그만큼 혼자였던 시기</em>입니다.</p><p>그때 혼자 버튔 것이 지금의 밑천입니다. 그건 손해가 아니었어요.',
    '식상':'내놓는 힘이 일찍 나온 자리입니다.</p><p>이를테면 어릴 때부터 말이나 그림이나 만드는 것으로 눈에 띄었거나, 하고 싶은 것이 늘 많았거나, 가만히 앉아 있는 것을 유난히 힘들어했던 것이 여기에 해당해요.</p><p>반대로 표현을 막는 환경이었다면 그 시기가 답답하게 기억됩니다.</p><p>다만 끝까지 마치는 힘은 나중에 붙습니다.</p><p>시작한 것은 많은데 끝낸 것이 적어서 야단을 들으신 적이 있으실 거예요.</p><p>한마디로 <em>재주가 일찍 보였는데, 마무리는 나중에 배운 시기</em>입니다.</p><p>그때 벌여둔 것 가운데 지금도 남아 있는 것이 있다면 그게 진짜입니다.',
    '재성':'일찍부터 현실을 본 자리입니다.</p><p>이를테면 어릴 때부터 집안 사정을 알고 있었거나, 또래보다 셈이 빨랐거나, 갖고 싶은 것을 조르기보다 방법을 찾는 쪽이었던 것이 여기에 해당해요.</p><p>반대로 아무 걱정 없이 지내는 초년이었다면 그 힘은 오히려 늦게 나옵니다.</p><p>다만 일찍 어른이 되느라 놓친 것이 있습니다.</p><p>또래가 놀 때 혼자 계산하고 있었거나, 하고 싶은 것을 참은 기억이 있으실 거예요.</p><p>한마디로 <em>일찍 현실을 안 대신, 어린 시절이 짧았던 시기</em>입니다.</p><p>그때 못 한 것 하나쯄은 지금 해보셔도 됩니다. 늦지 않았어요.',
    '관성':'일찍부터 틀 안에 있던 자리입니다.</p><p>이를테면 규칙이 뚜렷한 집이나 학교에서 자랐거나, 어른들 말을 잘 듣는 아이였거나, 맡은 것을 끝까지 하는 걸로 인정받았던 것이 여기에 해당해요.</p><p>반대로 아무 틀이 없는 환경이었다면 오히려 불안했을 겁니다.</p><p>다만 하고 싶은 것을 미뤄두는 버릇이 그때 생겼습니다.</p><p>「그건 나중에」 하며 넘긴 것이 지금도 그대로 남아 있을 수 있어요.</p><p>한마디로 <em>일찍 자리를 잡은 대신, 하고 싶은 것을 뒤로 미뢬 시기</em>입니다.</p><p>그때 미뤄둔 것이 무엇이었는지 한번 떠올려보세요. 지금이 그걸 꺼낼 때입니다.',
    '인성':'배우고 받는 힘이 강했던 자리입니다.</p><p>이를테면 어른의 도움이나 배움이 늘 곁에 있었거나, 공부나 책이 도피처가 되었거나, 누군가 나를 알아봐 준 기억이 있는 것이 여기에 해당해요.</p><p>반대로 배울 곳이 없는 환경이었다면 그 시기가 유난히 허전하게 남습니다.</p><p>다만 스스로 정하는 힘은 늦게 붙습니다.</p><p>누가 정해주는 대로 따라가다 나중에 「내가 뭔 원했지」 하신 적이 있으실 거예요.</p><p>한마디로 <em>많이 받은 시기인데, 스스로 고르는 연습은 늦게 시작한 시기</em>입니다.</p><p>그때 받은 것이 지금의 바탕입니다. 이제는 고르는 쪽을 연습하시면 됩니다.'},
  '중년':{
    '비겁':'스스로 판을 여는 시기입니다. 남이 만든 흐름에 올라타는 것보다 직접 시작할 때 운이 붙습니다.</p><p>이를테면 회사를 나와 내 것을 시작하게 되거나, 하던 일을 내 방식으로 다시 짜게 되거나, 「이제는 내 이름으로」가 마음에 올라오는 것이 여기에 해당해요.</p><p>반대로 계속 남의 틀 안에 있으면 이 시기가 답답하게 지나갑니다.</p><p>다만 같은 것을 원하는 사람이 곁에 붙습니다.</p><p>동업이나 협업 이야기가 이 시기에 몰리고, 잘될 때 다툼기 쉽습니다.</p><p>한마디로 <em>내 이름으로 서는 시기인데, 사람 조건을 글로 남겨야 하는 시기</em>입니다.</p><p>이 시기에 시작하실 것이 있다면 몫과 나가는 방법을 먼저 적어두세요.',
    '식상':'내놓는 시기입니다. 안에 쌓인 것이 밖으로 나옵니다.</p><p>이를테면 오래 미뤄둔 것을 이 시기에 시작하게 되거나, 가르치거나 만들거나 쓰는 일이 붙거나, 「이제 내 걸 해보자」가 실제로 움직이는 것이 여기에 해당해요.</p><p>반대로 계속 안으로만 담아두면 몸이나 마음에 탈이 납니다.</p><p>다만 벌인 것을 다 거두지는 못합니다.</p><p>이 시기에 시작한 것 가운데 절반은 남고 절반은 흐지부지될 수 있어요.</p><p>한마디로 <em>내놓아야 하는 시기인데, 남길 것을 골라야 하는 시기</em>입니다.</p><p>벌인 것 가운데 무엇을 끝까지 가져갈지 이 시기에 정하세요.',
    '재성':'거두는 시기입니다. 앞에서 뿌린 것이 손에 잡힙니다.</p><p>이를테면 오래 해온 일이 이 시기에 값으로 돌아오거나, 자리를 잡고 사는 모양이 갖춰지거나, 숫자가 실제로 늘어나는 것이 여기에 해당해요.</p><p>반대로 앞에서 뿌린 것이 없으면 이 시기가 유난히 팡팡합니다.</p><p>다만 거두는 데 마음을 다 쓰다 놓치는 것이 있습니다.</p><p>돈과 자리는 갖춰는데 사람이나 몸이 비어 있는 일이 이 시기에 잘 생깁니다.</p><p>한마디로 <em>거두는 시기인데, 거두느라 다른 것을 비우기 쉽은 시기</em>입니다.</p><p>이 시기에 돈 말고 무엇을 지킬지 하나만 정해두세요.',
    '관성':'맡는 시기입니다. 자리가 주어지고 책임이 늘어나는 해에 오히려 안정됩니다.</p><p>이를테면 직책이 올라가거나, 아래 사람이 붙거나, 집안에서도 결정을 맡게 되는 것이 여기에 해당해요.</p><p>반대로 아무도 나에게 아무것도 안 맡기면 이 시기가 헛헛합니다.</p><p>다만 그 무게가 몸으로 옵니다.</p><p>이 시기에 몸이 크게 상하거나, 쉬는 법을 몰라 계속 밀고 가시는 일이 있습니다.</p><p>한마디로 <em>맡을수록 단단해지는 시기인데, 몸을 먼저 챙겨야 하는 시기</em>입니다.</p><p>맡는 것 하나를 늘릴 때 쉬는 것 하나도 같이 정하세요.',
    '인성':'배우고 물러나는 시기입니다. 겉으로는 아무 일 없어 보이는 해가 사실은 가장 중요한 해입니다.</p><p>이를테면 이 시기에 공부를 다시 시작하거나, 한 발 물러나 정리하는 시간이 생기거나, 조용한데 안에서는 크게 바뀌는 것이 여기에 해당해요.</p><p>반대로 쉰 없이 밖으로만 뛰면 뒤에 크게 탈이 납니다.</p><p>다만 조용한 것을 뒤처짐으로 읽기 쉽습니다.</p><p>또래는 다 앞서가는 것 같은데 나만 멈춘 것 같아 조급하신 시기예요.</p><p>한마디로 <em>안에서 크게 바뀌는 시기인데, 밖에서는 안 보이는 시기</em>입니다.</p><p>이 시기에 배운 것은 말년에 값이 됩니다. 지금 조급해하지 않으셔도 됩니다.'},
  '말년':{
    '비겁':'끝까지 내 힘으로 서는 자리입니다.</p><p>이를테면 나이가 들어도 남에게 맡기기보다 직접 하시거나, 은퇴한 뒤에도 자기 일을 하나 갖고 계시거나, 「아직 내가 할 수 있다」가 힘이 되는 것이 여기에 해당해요.</p><p>반대로 할 일이 없어지는 순간 급격히 힘이 빠집니다.</p><p>다만 곁을 내주는 연습이 필요합니다.</p><p>혼자 다 하려다 자식이나 가까운 사람과 부딪히는 일이 생길 수 있어요.</p><p>한마디로 <em>끝까지 스스로 서는 자리인데, 기대는 법도 배워야 하는 자리</em>입니다.</p><p>말년에 할 일을 하나 남겨두세요. 크지 않아도 됩니다.',
    '식상':'끝까지 내놓는 자리입니다.</p><p>이를테면 나이 들어 오히려 하고 싶은 것이 생기거나, 손주나 후배에게 무언가를 가르치게 되거나, 늦게 시작한 것이 뜻밖에 잘 되는 것이 여기에 해당해요.</p><p>반대로 아무것도 안 하고 지내면 급격히 시드십니다.</p><p>다만 몸이 마음을 못 따라갑니다.</p><p>하고 싶은 것은 여전한데 예전만큼 안 되어 답답하실 수 있어요.</p><p>한마디로 <em>끝까지 만드는 자리인데, 속도를 줄여야 하는 자리</em>입니다.</p><p>말년에 만들 것을 하나 정하시되 기한은 넉넉히 두세요.',
    '재성':'거둔 것으로 사는 자리입니다.</p><p>이를테면 앞에서 모아둔 것이 이 시기를 받쳐주거나, 돈 걱정이 크지 않게 지내시거나, 셈이 끝까지 또렷한 것이 여기에 해당해요.</p><p>반대로 앞에서 남긴 것이 없으면 이 시기가 유난히 힘듭니다.</p><p>다만 남은 것을 어떻게 나눈지가 숫제로 남습니다.</p><p>자식이나 주변에 무엇을 얼마나 줄지로 마음이 복잡해지는 일이 있습니다.</p><p>한마디로 <em>거둔 것으로 사는 자리인데, 나누는 방법을 정해야 하는 자리</em>입니다.</p><p>말년의 셈은 미리 글로 남겨두세요. 그것이 남는 사람들을 지켜줍니다.',
    '관성':'끝까지 자리가 있는 자리입니다.</p><p>이를테면 나이가 들어도 찾는 사람이 있거나, 모임이나 집안에서 어른 노릇을 하게 되거나, 맡은 것이 있어야 몸이 덜 아프신 것이 여기에 해당해요.</p><p>반대로 아무 역할이 없어지면 급격히 무너집니다.</p><p>다만 놓아야 할 때를 놓치기 쉽습니다.</p><p>넘겨줄 때가 지났는데도 계속 쥐고 계셔서 아래에서 힘들어하는 일이 있습니다.</p><p>한마디로 <em>끝까지 자리가 있는 자리인데, 넘기는 날을 스스로 정해야 하는 자리</em>입니다.</p><p>언제 무엇을 넘길지 미리 정해두세요. 그게 마지막 책임입니다.',
    '인성':'배운 것으로 사는 자리입니다. 앞에서 쌓은 것이 말년을 받칩니다.</p><p>이를테면 평생 배운 것이 이 시기에 값이 되거나, 가르치거나 정리하는 일이 붙거나, 조용히 지내면서도 마음이 채워지는 것이 여기에 해당해요.</p><p>반대로 앞에서 쌓아둔 것이 없으면 이 시기가 허전합니다.</p><p>다만 지나간 것을 오래 곱씩기 쉽습니다.</p><p>「그때 그랬더라면」이 자꾸 올라오는 시기이기도 합니다.</p><p>한마디로 <em>쌓은 것으로 사는 자리인데, 지난 것을 놓아야 편해지는 자리</em>입니다.</p><p>말년의 판은 앞에서 남긴 것으로 삽니다. 그러니 지금 남기실 것을 하나 정하세요.'}
  };

  function ord(){
    try{ return JSON.parse(localStorage.getItem('stella_demo')); }catch(e){ return null; }
  }
  function tail(){
    var o=ord();
    var t=String((o?o.topic:'')||'').trim();
    var p=t.split('·');
    return p[p.length-1].trim();
  }

  function setLens(){
    var o=ord();
    if(!o){ return; }
    if(o.guardian_slug!=='door-fortune'){ return; }
    var T=FORT[tail()];
    if(!T){ return; }
    var G=window.StellaGuide;
    if(!G){ return; }
    var g=G['door-fortune'];
    if(!g){ return; }
    g.lens = g.lens || {};
    var k;
    for(k in T){
      if(Object.prototype.hasOwnProperty.call(T,k)){ g.lens[k]=T[k]; }
    }
  }
  setLens();

  function heads(){
    var box=document.getElementById('ssb');
    if(!box){ return false; }
    var h3=box.getElementsByTagName('h3');
    if(!h3.length){ return false; }
    var i, key, t, hit=false;
    for(i=0;i<h3.length;i++){
      t=String(h3[i].textContent);
      if(t.indexOf('자리')<0){ continue; }
      if(t.indexOf('—')>=0){ continue; }
      for(key in EASY){
        if(!Object.prototype.hasOwnProperty.call(EASY,key)){ continue; }
        if(t.indexOf(key)!==0){ continue; }
        h3[i].innerHTML = EASY[key]+' <span style="font-weight:400;opacity:.72">— '+t+'</span>';
        hit=true;
      }
    }
    return hit;
  }

  var tries=0;
  function tick(){
    tries+=1;
    var done=false;
    try{ done=heads(); }catch(e){ done=true; }
    if(done){ return; }
    if(tries>60){ return; }
    setTimeout(tick, 400);
  }
  function go(){ setLens(); setTimeout(tick, 900); }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', go);
  } else { go(); }
})();
</script>

<script>
/* 글자 깨짐 고치기  TYPO-1  2026-09-02
   세성의 신 1부(FORT-1)를 넣을 때 몇 글자가 깨져 들어갔습니다.
   낛겠는데 · 미뢬 · 쉰 없이 처럼요. 손님 눈에 보이는 자리라 먼저 고칩니다.
   조각을 통째로 다시 넣으면 또 깨질 수 있어서, 화면에 그려진 글자만 바꿉니다.
   앞으로 다른 곳에서 깨진 글자가 나오면 아래 표에 한 줄씩 더하면 됩니다.
   이 안에서 두 글자짜리 논리기호를 쓰지 않습니다. */
(function(){
  'use strict';

  var FIX = [
    ['낛겠는데','낫겠는데'],
    ['미뢬 시기','미룬 시기'],
    ['뭔 원했지','뭘 원했지'],
    ['쉰 없이','쉼 없이'],
    ['자기 힘으로 섬는데','자기 힘으로 섰는데'],
    ['하나쯄은','하나쯤은'],
    ['혼자 버튔 것이','혼자 버틴 것이'],
    ['다툼기 쉽습니다','다투기 쉽습니다'],
    ['갖춰는데','갖춰졌는데'],
    ['유난히 팡팡합니다','유난히 팍팍합니다'],
    ['비우기 쉽은','비우기 쉬운'],
    ['넣넷한','넉넉한'],
    ['내가 빁니다','내가 빕니다'],
    ['엿사를','엿새를'],
    ['안 혼난다고','안 혼낸다고'],
    ['형제가 곳 내','형제가 곧 내'],
    ['다퇠거나','다퉜거나'],
    ['다만 나눈 것이','다만 나눌 것이'],
    ['현실이 얇히는','현실이 얽히는'],
    ['꺼끄러운','껄끄러운'],
    ['형제끼리 무신','형제끼리 무슨'],
    ['받은 것을 늘게','받은 것을 늦게'],
    ['핫김에','홧김에'],
    ['답이 뜼한데도','답이 뜸한데도'],
    ['보낼 말을 썬다','보낼 말을 썼다'],
    ['왜 그러했는지','왜 그랬는지'],
    ['훨씬 가벼지십니다','훨씬 가벼워지십니다'],
    ['더 힘드셔던','더 힘드셨던'],
    ['연락이 뜼해','연락이 뜸해'],
    ['반대로 기대 사람이','반대로 기댈 사람이'],
    ['내놓아야 나는 사람','내놓아야 낫는 사람'],
    ['것이 곳 회복','것이 곧 회복'],
    ['이야기를 나눈 때','이야기를 나눌 때'],
    ['약속을 가벼이 여기면','약속을 가볍게 여기면'],
    ['것이 곷 당신의','것이 곧 당신의'],
    ['시간이 훌적 가거나','시간이 훌쩍 가거나'],
    ['반대로 내높을 자리가','반대로 내놓을 자리가'],
    ['기울어져 있습니다','기울어 있습니다'],
    ['잔뚟','잔뜩'],
    ['남에게 땡땡한지를','남에게 떳떳한지를'],
    ['나쁜지 않은 선택','나쁘지 않은 선택'],
    ['오래 멈췐 계신','오래 멈춰 계신']
  ];

  function sweep(root){
    if(!root){ return 0; }
    var w, node, t, i, hit=0;
    try{
      w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    }catch(e){ return 0; }
    while(true){
      node = w.nextNode();
      if(!node){ break; }
      t = node.nodeValue;
      if(!t){ continue; }
      for(i=0;i<FIX.length;i++){
        if(t.indexOf(FIX[i][0])<0){ continue; }
        t = t.split(FIX[i][0]).join(FIX[i][1]);
        hit += 1;
      }
      if(t!==node.nodeValue){ node.nodeValue = t; }
    }
    return hit;
  }

  var tries = 0;
  function tick(){
    tries += 1;
    try{ sweep(document.getElementById('ssb')); }catch(e){}
    if(tries>40){ return; }
    setTimeout(tick, 500);
  }
  function go(){ setTimeout(tick, 600); }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', go);
  } else { go(); }
})();
</script>

<script>

(function(){

  var HEAL = {

    '재성':'몸을 도구처럼 쓰는 자리입니다. 할 일이 있으면 몸은 늘 뒷순위예요.</p><p>이를테면 바쁠 때 끼니를 거르거나, 앉은 자리에서 몇 시간을 그대로 있거나, 「이것만 끝내고 쉬자」가 하루에 몇 번씩 나오는 것이 여기에 해당해요.</p><p>반대로 몸 쓰는 일을 규칙적으로 하시면 컨디션이 눈에 띄게 좋아집니다.</p><p>다만 많이 쓰는 자리부터 먼저 신호가 옵니다.</p><p>어깨나 허리나 손목처럼 늘 쓰는 곳이 어느 날 갑자기 안 움직인 적이 있으실 거예요.</p><p>한마디로 <em>일이 먼저고 몸이 나중인 사람</em>이에요.</p><p>일정표에 일만 적지 마시고 밥 먹는 시간과 걷는 시간도 같이 적어두세요. 적어두지 않으면 그 시간은 사라집니다.',
    '관성':'책임이 몸을 누르는 자리입니다. 마음이 무거워지면 잠부터 무너져요.</p><p>이를테면 큰일을 앞두고 며칠씩 잠을 설치거나, 어깨와 목이 늘 뭉쳐 있거나, 쉬는 날에도 머릿속으로 다음 주 일을 돌리고 있는 것이 여기에 해당해요.</p><p>반대로 맡은 일이 정리되면 몸도 바로 풀립니다.</p><p>다만 긴장을 푸는 방법을 따로 배우지 않으면 오래 갑니다.</p><p>일이 다 끝났는데도 몸은 계속 굳어 있어서 이상하다 싶으신 적이 있으실 거예요.</p><p>한마디로 <em>마음이 놓여야 몸이 놓이는 사람</em>입니다.</p><p>쉬는 법을 하나만 정해서 몸에 익히세요. 걷기든 목욕이든 상관없어요. 정해두지 않으면 쉬는 시간에도 일을 생각합니다.',
    '인성':'생각이 안으로 쌓이는 자리입니다. 마음이 얹히면 속이 같이 얹혀요.</p><p>이를테면 신경 쓰는 일이 생기면 입맛부터 없어지거나, 자려고 누웠는데 낮에 들은 말이 계속 돌거나, 남한테 말은 안 하고 혼자 오래 곱씹는 것이 여기에 해당해요.</p><p>반대로 마음이 편한 시기에는 몸도 별 탈 없이 지나갑니다.</p><p>다만 쌓인 것을 꺼내놓을 데가 없습니다.</p><p>몸이 안 좋아 병원에 갔는데 특별한 것이 없다는 말을 들으신 적이 있으실 거예요.</p><p>한마디로 <em>머리를 비우는 것이 곧 치료가 되는 몸</em>이에요.</p><p>말할 사람 한 명은 꼭 만드세요. 사람이 어려우면 종이에 적으셔도 됩니다. 안에 두는 것보다 밖에 내놓는 쪽이 몸에 낫습니다.'},
  '체질':{
    '비겁':'타고난 힘이 센 자리입니다. 웬만해선 잘 안 지치는 몸이에요.</p><p>이를테면 밤을 새워도 다음 날 그럭저럭 버티거나, 남들 다 감기 걸릴 때 혼자 멀쩡하거나, 힘 쓰는 일에서 「생각보다 세시네」 소리를 듣는 것이 여기에 해당해요.</p><p>반대로 한 번 크게 무너지면 회복이 오래 걸립니다.</p><p>다만 센 힘을 믿고 넘기다 탈이 납니다.</p><p>「나는 원래 튼튼해」 하시다가 크게 한 번 앓으신 적이 있으실 거예요.</p><p>한마디로 <em>힘은 좋은데 아끼는 법을 안 배운 몸</em>입니다.</p><p>센 몸이라고 다 쓰지 마시고 칠 할만 쓰세요. 남긴 삼 할이 다음 해의 힘이 됩니다.',
    '식상':'기운이 밖으로 잘 빠지는 자리입니다. 쓰는 속도가 채우는 속도보다 빨라요.</p><p>이를테면 잘 먹는데도 살이 잘 안 붙거나, 신나게 놀고 온 다음 날 유난히 축 처지거나, 말을 많이 한 날 목보다 온몸이 먼저 지치는 것이 여기에 해당해요.</p><p>반대로 좋아하는 일을 할 때는 아픈 것도 잊습니다.</p><p>다만 다 쓰고 나서야 빈 것을 압니다.</p><p>즐거웠던 일정 뒤에 며칠씩 앓아누우신 적이 있으실 거예요.</p><p>한마디로 <em>채우는 것보다 새는 곳을 막아야 하는 몸</em>이에요.</p><p>바쁜 일정 뒤에는 반드시 빈 하루를 붙여두세요. 그 하루가 없으면 다음 일정에서 두 배로 지칩니다.',
    '재성':'쓰는 만큼 닳는 자리입니다. 몸이 정직하게 반응하는 편이에요.</p><p>이를테면 운동을 하면 금방 표가 나거나, 며칠 무리하면 바로 얼굴이나 몸무게에 나타나거나, 늘 쓰는 손목이나 무릎이 먼저 아파오는 것이 여기에 해당해요.</p><p>반대로 관리하면 관리한 만큼 확실하게 돌아옵니다.</p><p>다만 관리할 시간을 늘 뒤로 미룹니다.</p><p>「이번 일만 끝나면 운동해야지」를 몇 해째 하고 계신 적이 있으실 거예요.</p><p>한마디로 <em>공들인 만큼 정직하게 돌려주는 몸</em>입니다.</p><p>큰 계획 말고 아주 작은 것 하나만 정해서 매일 하세요. 이 몸은 크게 한 번보다 조금씩 오래가 훨씬 잘 듣습니다.',
    '관성':'긴장이 몸에 남는 자리입니다. 마음이 굳으면 몸도 같이 굳어요.</p><p>이를테면 신경 쓰는 일이 있으면 이를 악물고 자거나, 어깨가 늘 올라가 있다는 말을 듣거나, 쉬는 날 첫날에 꼭 몸살이 나는 것이 여기에 해당해요.</p><p>반대로 규칙적인 생활을 하면 몸이 눈에 띄게 편해집니다.</p><p>다만 스스로 긴장한 줄을 모릅니다.</p><p>마사지를 받으러 갔다가 「많이 뭉치셨네요」 소리를 듣고 놀라신 적이 있으실 거예요.</p><p>한마디로 <em>푸는 법을 따로 배워야 하는 몸</em>이에요.</p><p>자기 전 십 분만 몸을 풀어주세요. 이 몸에는 운동보다 푸는 것이 먼저입니다.',
    '인성':'안으로 쌓이는 자리입니다. 밖으로 잘 안 내보내는 몸이에요.</p><p>이를테면 속이 자주 더부룩하거나, 잠은 자는데 개운하지 않거나, 몸보다 머리가 먼저 피곤한 것이 여기에 해당해요.</p><p>반대로 조용히 쉬는 시간을 주면 회복이 꽤 빠릅니다.</p><p>다만 쌓인 것이 한참 뒤에 나옵니다.</p><p>힘든 일이 다 끝나고 나서 오히려 몸이 아프신 적이 있으실 거예요.</p><p>한마디로 <em>내보내는 연습이 필요한 몸</em>입니다.</p><p>물을 자주 드시고, 몸을 데우시고, 가볍게 걸으세요. 이 몸에는 더 채우는 것보다 도는 것이 약입니다.'},
  '가족운':{
    '비겁':'집에서도 대등하려는 자리입니다. 나이 차이가 있어도 「어른이니까 무조건」이 잘 안 되세요.</p><p>이를테면 집안일에서 내 몫을 정확히 하고 남의 몫도 정확히 따지거나, 부모님 말씀에 그대로 「네」가 안 나오거나, 형제 사이에서 혼자 손해 보는 자리를 못 견디는 것이 여기에 해당해요.</p><p>반대로 서로를 어른 대 어른으로 대하는 집에서는 아주 편안하십니다.</p><p>다만 지지 않으려다 사이가 멀어집니다.</p><p>별것 아닌 일로 크게 부딪히고 한동안 연락을 안 하신 적이 있으실 거예요.</p><p>한마디로 <em>가족에게도 공평해야 마음이 놓이는 사람</em>이에요.</p><p>옳고 그름을 가리기 전에 먼저 안부를 물으세요. 이 집에서는 맞는 말보다 먼저 건 전화가 셉니다.',
    '식상':'집안 분위기를 만드는 자리입니다. 당신이 말을 꺼내야 이야기가 시작돼요.</p><p>이를테면 명절에 어색한 자리를 당신이 풀거나, 가족 단톡방에서 말이 제일 많거나, 여행이나 모임을 늘 당신이 계획하는 것이 여기에 해당해요.</p><p>반대로 아무도 말을 받아주지 않는 집에서는 유난히 외로우십니다.</p><p>다만 하고 나서 후회할 말도 먼저 나옵니다.</p><p>답답해서 한마디 했다가 며칠 마음이 무거우신 적이 있으실 거예요.</p><p>한마디로 <em>집을 데우는 사람인데, 그만큼 말로 데이기도 하는 사람</em>입니다.</p><p>화가 난 날은 하루만 두었다 말하세요. 당신 말은 힘이 세서 좋은 쪽으로도 나쁜 쪽으로도 크게 갑니다.',
    '재성':'집안의 현실을 떠안는 자리입니다. 돈이나 살림 이야기가 결국 당신에게 와요.</p><p>이를테면 병원비나 경조사비를 챙기는 사람이 당신이거나, 부모님 통장이나 보험을 아는 사람이 당신뿐이거나, 집안에 큰일이 생기면 계산부터 하게 되는 것이 여기에 해당해요.</p><p>반대로 역할이 나뉘어 있는 집에서는 훨씬 가볍게 지내십니다.</p><p>다만 티가 안 나는 짐입니다.</p><p>다들 고마워는 하는데 아무도 나누자고는 안 해서 서운하신 적이 있으실 거예요.</p><p>한마디로 <em>말없이 떠안다가 혼자 지치는 사람</em>이에요.</p><p>혼자 알고 계시지 마시고 한 사람에게라도 숫자를 보여주세요. 아는 사람이 둘이 되는 순간 짐은 반이 됩니다.',
    '관성':'집의 규칙을 지키는 자리입니다. 해야 할 것을 하는 사람이 당신이에요.</p><p>이를테면 명절이나 제사나 생신을 챙기는 사람이 당신이거나, 「그래도 이건 해야지」가 먼저 나오거나, 집안 어른들이 당신을 제일 믿는 것이 여기에 해당해요.</p><p>반대로 아무 틀이 없는 집에서는 오히려 불안해지십니다.</p><p>다만 그 자리가 당연해집니다.</p><p>내가 안 하면 아무도 안 한다는 걸 알아서, 힘들어도 못 놓으신 적이 있으실 거예요.</p><p>한마디로 <em>믿음직한 사람이라서 더 무거워진 사람</em>입니다.</p><p>올해는 하나만 내려놓아 보세요. 하나 안 해도 집은 안 무너집니다. 그걸 확인하시는 것이 올해 할 일이에요.',
    '인성':'집에서 받는 자리입니다. 챙김을 받는 쪽에 가까워요.</p><p>이를테면 다 커서도 어머니가 반찬을 보내주시거나, 힘든 일이 있으면 결국 집으로 돌아가게 되거나, 가족 가운데 누군가가 늘 당신 편을 들어주는 것이 여기에 해당해요.</p><p>반대로 기댈 데가 없는 집에서 자라셨다면 그 시기가 유난히 힘드셨을 겁니다.</p><p>다만 받은 것을 늦게 압니다.</p><p>그 사람이 없어지고 나서야 얼마나 큰 자리였는지 아신 적이 있거나, 앞으로 그러실 수 있어요.</p><p>한마디로 <em>많이 받은 사람인데, 갚을 시간이 생각보다 짧은 사람</em>이에요.</p><p>고맙다는 말은 미루지 마세요. 이 자리에서 제일 아쉬운 말은 늘 「그때 말할걸」입니다.'}
  };

  function ord(){
    try{ return JSON.parse(localStorage.getItem('stella_demo')); }catch(e){ return null; }
  }
  function tail(){
    var o=ord();
    var t=String((o?o.topic:'')||'').trim();
    var p=t.split('·');
    return p[p.length-1].trim();
  }
  function setLens(){
    var o=ord();
    if(!o){ return; }
    if(o.guardian_slug!=='door-health'){ return; }
    var T=HEAL[tail()];
    if(!T){ return; }
    var G=window.StellaGuide;
    if(!G){ return; }
    var g=G['door-health'];
    if(!g){ return; }
    g.lens = g.lens || {};
    var k;
    for(k in T){
      if(Object.prototype.hasOwnProperty.call(T,k)){ g.lens[k]=T[k]; }
    }
  }
  setLens();
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', setLens);
  } else { setLens(); }
})();
</script>

<script>

   HEAL-1과 짝입니다. 남은 세 주제를 같은 짜임으로 씁니다.

   「앞으로 그러실 수 있어요」와 마지막 한 줄로 자리를 열어둡니다.

(function(){

  var HEAL2 = {
  '부모운':{
    '비겁':'부모와 나란히 서려는 자리입니다. 어릴 때부터 「왜요」가 먼저 나오는 쪽이에요.</p><p>이를테면 하라는 대로 안 해서 자주 부딪혔거나, 일찍부터 내 일은 내가 정하겠다고 했거나, 커서도 부모님께 조언을 잘 안 구하는 것이 여기에 해당해요.</p><p>반대로 부모님이 한 사람으로 대해주시면 아주 가까워집니다.</p><p>다만 미안함이 뒤늦게 옵니다.</p><p>그때 왜 그렇게까지 했나 싶어 마음이 걸리신 적이 있으실 거예요.</p><p>한마디로 <em>일찍 홀로 선 대신, 부모와 가까워질 시간을 늦게 만난 사람</em>이에요.</p><p>이기고 지는 이야기 말고 그냥 안부만 물으세요. 이 자리에서는 옳은 말을 꺼내는 순간부터 대화가 닫힙니다.',
    '식상':'부모에게 말이 나가는 자리입니다. 속에 있는 것을 집에 꺼내는 편이에요.</p><p>이를테면 밖에서 있었던 일을 집에 와서 다 이야기하거나, 부모님께 하고 싶은 말을 참지 못하거나, 집안 분위기가 당신 기분에 따라 달라지는 것이 여기에 해당해요.</p><p>반대로 들어주는 부모님이 계시면 그 자체로 힘이 크게 붙습니다.</p><p>다만 말이 세게 나갑니다.</p><p>화가 나서 던진 한마디가 오래 남아 마음에 걸리신 적이 있으실 거예요.</p><p>한마디로 <em>부모에게 마음을 다 보여주는 사람인데, 그래서 상처도 서로 큰 사람</em>입니다.</p><p>할 말이 많은 날은 한 가지만 고르세요. 이 자리에서는 길게 말할수록 뜻이 흐려집니다.',
    '재성':'부모의 현실을 떠안는 자리입니다. 집안의 돈 이야기가 당신에게 옵니다.</p><p>이를테면 어릴 때부터 집 형편을 알고 있었거나, 부모님 병원비나 생활비를 챙기게 되거나, 부모님이 돈 이야기를 당신에게만 하시는 것이 여기에 해당해요.</p><p>반대로 형편이 넣넷한 집에서는 그 힘이 다른 데로 잘 쓰입니다.</p><p>다만 짐을 혼자 집니다.</p><p>형제가 있는데도 결국 내가 하고 있다 싶으신 적이 있으실 거예요.</p><p>한마디로 <em>부모를 현실로 돕는 사람인데, 그 무게는 말하지 못하는 사람</em>이에요.</p><p>드리는 돈에는 반드시 선을 하나 그으세요. 끝이 없는 도움은 오래 못 가고, 오래 못 가면 결국 사이가 상합니다.',
    '관성':'부모의 기대 안에 있던 자리입니다. 잘해야 한다는 마음이 일찍 자리 잡아요.</p><p>이를테면 성적이나 진로를 부모님이 정해주셨거나, 실망시키는 것이 제일 무서웠거나, 다 커서도 부모님께 보고하듯 말하게 되는 것이 여기에 해당해요.</p><p>반대로 기준이 또렷한 집에서 자란 힘이 사회에 나와 크게 쓰입니다.</p><p>다만 스스로 고르는 연습이 늦습니다.</p><p>내가 원한 것인지 부모님이 원한 것인지 헷갈리신 적이 있으실 거예요.</p><p>한마디로 <em>기대를 잘 지킨 사람인데, 이제는 내 기준을 만들어야 하는 사람</em>입니다.</p><p>올해는 하나만 부모님 뜻과 다르게 정해보세요. 큰 것 말고 작은 것으로요. 그 하나가 시작입니다.',
    '인성':'부모에게 많이 받은 자리입니다. 특히 어머니 쪽 손이 크게 닿습니다.</p><p>이를테면 힘든 일이 있으면 결국 부모님께 기대게 되거나, 다 커서도 챙김을 받고 있거나, 부모님이 당신 걱정을 유난히 많이 하시는 것이 여기에 해당해요.</p><p>반대로 받을 데가 없는 집에서 자라셨다면 그 시기가 유난히 허전했을 겁니다.</p><p>다만 받는 것이 당연해집니다.</p><p>고맙다는 말을 언제 마지막으로 했는지 잘 기억이 안 나실 수 있어요.</p><p>한마디로 <em>많이 받은 사람인데, 갚을 날은 생각보다 가까운 사람</em>이에요.</p><p>이번 달 안에 한 번은 먼저 전화하세요. 이 자리에서 제일 아까운 것은 늘 미룬 전화입니다.'},
  '자녀운':{

  };

  function ord(){
    try{ return JSON.parse(localStorage.getItem('stella_demo')); }catch(e){ return null; }
  }
  function tail(){
    var o=ord();
    var t=String((o?o.topic:'')||'').trim();
    var p=t.split('·');
    return p[p.length-1].trim();
  }
  function setLens(){
    var o=ord();
    if(!o){ return; }
    if(o.guardian_slug!=='door-health'){ return; }
    var T=HEAL2[tail()];
    if(!T){ return; }
    var G=window.StellaGuide;
    if(!G){ return; }
    var g=G['door-health'];
    if(!g){ return; }
    g.lens = g.lens || {};
    var k;
    for(k in T){
      if(Object.prototype.hasOwnProperty.call(T,k)){ g.lens[k]=T[k]; }
    }
  }
  setLens();
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', setLens);
  } else { setLens(); }
})();

    '재성':'현실을 같이 보는 자리입니다. 마음만으로는 마음이 안 놓여요.</p><p>이를테면 만나기 전에 그 사람의 일이나 생활을 먼저 살피거나, 데이트 계획을 실속 있게 짜거나, 「이 사람과 앞으로가 그려지나」를 일찍 따져보는 것이 여기에 해당해요.</p><p>반대로 생활이 안정된 사람과 만나면 아주 편안해집니다.</p><p>다만 재다가 마음이 식습니다.</p><p>따져보는 사이에 좋았던 마음이 사라져버린 적이 있으실 거예요.</p><p>한마디로 <em>보는 눈은 정확한데, 마음 쓸 시간을 스스로 줄이는 사람</em>이에요.</p><p>조건은 세 가지만 정해두고 나머지는 만나면서 보세요. 다 맞춰놓고 시작하려면 시작이 안 옵니다.',

    '인성':'받는 데 익숙한 자리입니다. 챙겨주는 사람에게 마음이 갑니다.</p><p>이를테면 잘 챙겨주는 사람 앞에서 유난히 편안하거나, 힘든 이야기를 들어주는 사람에게 끌리거나, 연애를 시작하면 상대가 더 많이 하게 되는 것이 여기에 해당해요.</p><p>반대로 따뜻한 사람을 만나면 그 사람 옆에서 오래 잘 지내십니다.</p><p>다만 상대가 지치는 것을 늦게 압니다.</p><p>처음엔 고맙던 것이 어느새 당연해져서 상대가 먼저 지친 적이 있으실 거예요.</p><p>한마디로 <em>사랑을 잘 받는 사람인데, 받은 만큼 돌려주는 연습이 필요한 사람</em>이에요.</p><p>한 달에 한 번은 당신이 먼저 계획하고 먼저 챙기세요. 이 자리에서는 그 한 번이 관계를 오래 살립니다.'},
  '결혼운':{
    '비겁':'살림도 결정도 나란히 나누려는 자리입니다. 한쪽이 다 정하는 결혼은 못 견디세요.</p><p>이를테면 큰 지출을 반드시 같이 정하거나, 집안일 몫이 한쪽으로 기울면 바로 말이 나오거나, 양가 일에서도 공평한지를 먼저 보는 것이 여기에 해당해요.</p><p>반대로 서로를 동료처럼 대하는 결혼에서는 아주 든든합니다.</p><p>다만 먼저 숙이는 것이 어렵습니다.</p><p>사소한 일로 다투고 며칠 데면데면하게 지내신 적이 있으실 거예요.</p><p>한마디로 <em>나란히 걸을 때 제일 좋은데, 먼저 손 내미는 것이 제일 어려운 사람</em>이에요.</p><p>싸운 날 저녁에 밥 한 끼만 같이 드세요. 이 자리에서는 말보다 같이 앉는 것이 빠릅니다.',
    '식상':'집을 데우는 자리입니다. 결혼 생활의 분위기를 당신이 만듭니다.</p><p>이를테면 기념일이나 여행을 당신이 챙기거나, 하고 싶은 말을 담아두지 못하거나, 집안 공기가 당신 기분에 따라 달라지는 것이 여기에 해당해요.</p><p>반대로 들어주는 배우자를 만나면 결혼 생활이 아주 편해집니다.</p><p>다만 말이 먼저 나가 상처가 됩니다.</p><p>핫김에 던진 한마디를 상대가 몇 해째 기억하고 있어 놀라신 적이 있으실 거예요.</p><p>한마디로 <em>집을 밝히는 사람인데, 그만큼 말로 데이기도 하는 사람</em>입니다.</p><p>화난 날의 말은 하루 재우고 하세요. 이 자리에서는 참은 하루가 몇 해를 지킵니다.',
    '재성':'생활을 굴리는 자리입니다. 결혼을 현실로 보는 눈이 정확해요.</p><p>이를테면 집이나 돈 계획을 먼저 세우거나, 살림의 숫자를 당신이 쥐고 있거나, 마음보다 조건이 먼저 정리되어야 마음이 놓이는 것이 여기에 해당해요.</p><p>반대로 셈이 맞는 배우자와는 다툴 일이 크게 줄어듭니다.</p><p>다만 숫자를 챙기느라 마음을 놓칩니다.</p><p>다 해놓고도 「같이 있는 시간이 없다」는 말을 들으신 적이 있으실 거예요.</p><p>한마디로 <em>살림은 잘 굴리는데, 마음 쓰는 시간을 따로 못 만드는 사람</em>이에요.</p><p>일주일에 한 번은 돈 이야기 없이 마주 앉으세요. 그 시간이 통장보다 결혼을 오래 지킵니다.',
    '관성':'결혼에 틀이 있어야 하는 자리입니다. 정해진 약속 안에서 마음이 놓여요.</p><p>이를테면 결혼 이야기가 흐지부지 길어지는 것을 제일 못 견디거나, 역할과 규칙이 분명해야 편하거나, 양가 예의나 절차를 꼼꼼히 챙기는 것이 여기에 해당해요.</p><p>반대로 약속을 지키는 배우자와는 아주 안정됩니다.</p><p>다만 틀이 사람을 누릅니다.</p><p>「이렇게 해야 하는 거 아니야」라는 말이 먼저 나가 상대가 굳은 적이 있으실 거예요.</p><p>한마디로 <em>지킬 것을 지키는 사람인데, 지키라는 말이 먼저 나가는 사람</em>입니다.</p><p>규칙을 말하기 전에 이유를 먼저 말하세요. 같은 말도 순서만 바꾸면 다르게 들립니다.',
    '인성':'기대고 기대게 하는 자리입니다. 챙겨주는 배우자에게 마음이 놓입니다.</p><p>이를테면 힘든 날 말없이 밥을 차려주는 사람에게 끌리거나, 결정을 상대에게 맡기는 편이거나, 배우자가 집안일을 도맡는 것이 자연스러워진 것이 여기에 해당해요.</p><p>반대로 따뜻한 배우자를 만나면 평생 편안하십니다.</p><p>다만 당연해집니다.</p><p>고맙던 일이 어느새 「원래 이 사람 몫」이 되어 있는 것을 뒤늦게 아신 적이 있으실 거예요.</p><p>한마디로 <em>사랑을 잘 받는 사람인데, 고맙다는 말을 자주 해야 하는 사람</em>이에요.</p><p>일주일에 한 번은 고마운 것 하나를 소리 내어 말하세요. 이 자리에서는 그 말이 살림보다 큽니다.'},
  '짝사랑':{
    '비겁':'마음을 먼저 들키고 싶지 않은 자리입니다. 좋아하면서도 티를 안 내려 하세요.</p><p>이를테면 상대 앞에서 오히려 무심한 척하거나, 먼저 연락한 횟수를 속으로 세고 있거나, 고백을 하면 지는 것 같아 미루는 것이 여기에 해당해요.</p><p>반대로 상대가 먼저 다가오면 마음이 아주 빨리 열립니다.</p><p>다만 재다가 시기를 놓칩니다.</p><p>망설이는 사이에 그 사람 곁에 다른 사람이 생긴 적이 있으실 거예요.</p><p>한마디로 <em>나란히 있을 때는 편한데, 마음을 먼저 꺼내는 것이 제일 어려운 사람</em>이에요.</p><p>고백까지 안 하셔도 됩니다. 다만 먼저 연락 한 번은 해보세요. 이 자리에서는 그 한 번이 판을 바꿉니다.',
    '식상':'마음이 먼저 새어 나가는 자리입니다. 숨기려 해도 주변이 먼저 압니다.</p><p>이를테면 그 사람 이야기를 친구들에게 자주 하거나, 연락이 오면 답장이 유난히 빠르거나, 무언가 챙겨주고 싶은 마음이 계속 드는 것이 여기에 해당해요.</p><p>반대로 표현을 받아주는 사람이면 생각보다 빨리 이어집니다.</p><p>다만 혼자 앞서갑니다.</p><p>답이 뜼한데도 계속 말을 걸다가 스스로 지치신 적이 있으실 거예요.</p><p>한마디로 <em>마음이 빨리 가는 사람인데, 상대 속도를 한 번은 봐야 하는 사람</em>입니다.</p><p>보내기 전에 하루만 두세요. 하루 뒤에도 보내고 싶으면 그때는 보내셔도 됩니다.',
    '재성':'가능성을 먼저 재는 자리입니다. 마음보다 「될 사이인가」를 먼저 봅니다.</p><p>이를테면 상대의 상황이나 조건을 먼저 알아보거나, 승산이 없어 보이면 마음을 접으려 하거나, 고백할 자리와 때를 계산하는 것이 여기에 해당해요.</p><p>반대로 될 것 같다는 판단이 서면 아주 빠르게 움직이십니다.</p><p>다만 재는 사이에 마음이 식습니다.</p><p>따져보다가 좋았던 마음까지 사라져버린 적이 있으실 거예요.</p><p>한마디로 <em>계산이 정확한 사람인데, 계산에 마음이 지는 사람</em>이에요.</p><p>이 마음이 얼마나 갈지는 재지 마세요. 재서 답이 나오는 일이었다면 애초에 짝사랑이 아니었을 겁니다.',
    '관성':'이름 없는 자리를 못 견디는 자리입니다. 뭐라도 확실해지길 바라세요.</p><p>이를테면 「나를 어떻게 생각하는지」가 계속 궁금하거나, 애매한 연락이 오래 가면 오히려 지치거나, 차라리 답을 듣고 끝내고 싶은 마음이 드는 것이 여기에 해당해요.</p><p>반대로 답이 정해지면 그다음은 아주 담담하게 지나가십니다.</p><p>다만 급하게 답을 받으려다 문을 닫습니다.</p><p>확인하려고 던진 말에 상대가 물러난 적이 있으실 거예요.</p><p>한마디로 <em>답이 있어야 편한 사람인데, 답을 서두르면 답을 잃는 사람</em>입니다.</p><p>물어보기 전에 세 번은 그냥 만나세요. 이 자리에서는 시간이 답을 대신 만들어 줍니다.',
    '인성':'기다리는 자리입니다. 상대가 먼저 다가와 주기를 바라세요.</p><p>이를테면 마음은 큰데 먼저 움직이는 것이 유난히 어렵거나, 그 사람 이야기를 혼자 오래 곱씹거나, 언젠가 알아봐 주겠지 하고 기다리는 것이 여기에 해당해요.</p><p>반대로 먼저 다가오는 사람과는 아주 깊어집니다.</p><p>다만 기다림이 길어집니다.</p><p>몇 해가 지나도록 아무 일도 일어나지 않은 마음이 있으실 거예요.</p><p>한마디로 <em>마음이 깊은 사람인데, 그 마음이 밖으로 나가지 않는 사람</em>이에요.</p><p>고백이 아니어도 됩니다. 안부 한 번, 질문 하나면 됩니다. 이 자리에서는 아주 작은 움직임이 여러 해를 줄여줍니다.'}
  };

  function ord(){
    try{ return JSON.parse(localStorage.getItem('stella_demo')); }catch(e){ return null; }
  }
  function tail(){
    var o=ord();
    var t=String((o?o.topic:'')||'').trim();
    var p=t.split('·');
    return p[p.length-1].trim();
  }
  function setLens(){
    var o=ord();
    if(!o){ return; }
    if(o.guardian_slug!=='door-love'){ return; }
    var T=LOVE[tail()];
    if(!T){ return; }
    var G=window.StellaGuide;
    if(!G){ return; }
    var g=G['door-love'];
    if(!g){ return; }
    g.lens = g.lens || {};
    var k;
    for(k in T){
      if(Object.prototype.hasOwnProperty.call(T,k)){ g.lens[k]=T[k]; }
    }
  }
  setLens();
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', setLens);
  } else { setLens(); }
})();
</script>

    '비겁':'먼저 숙이고 들어가지 못하는 자리입니다. 헤어진 뒤에도 나란한 자리에서 다시 만나고 싶어 하세요.</p><p>이를테면 연락처를 지웠다 살렸다 하거나, 상대가 먼저 연락하길 기다리며 몇 달을 보내거나, 우연히 마주칠 자리를 속으로 그려보는 것이 여기에 해당해요.</p><p>반대로 상대가 먼저 손을 내밀면 마음이 아주 빨리 풀립니다.</p><p>다만 자존심이 시간을 잡아먹습니다.</p><p>연락하고 싶은 마음이 몇 번이나 있었는데 끝내 못 하신 적이 있으실 거예요.</p><p>한마디로 <em>마음은 열려 있는데, 문을 여는 손이 무거운 사람</em>이에요.</p><p>다시 만나자는 말이 아니어도 됩니다. 잘 지내냐는 한마디면 충분합니다. 이 자리에서는 먼저 거는 쪽이 결과를 정합니다.',
    '식상':'하고 싶은 말이 많은 자리입니다. 헤어진 뒤에도 설명하고 싶은 마음이 계속 남아요.</p><p>이를테면 보낼 말을 썬다 지웠다 하거나, 그때 왜 그러했는지 언젠가는 말하고 싶거나, 친구들에게 그 사람 이야기를 자주 하는 것이 여기에 해당해요.</p><p>반대로 마음을 다 말할 자리가 한 번 생기면 그 뒤로는 훨씬 가벼지십니다.</p><p>다만 한꺼번에 쏟으면 문이 닫힙니다.</p><p>긴 메시지를 보내고 답이 없어 더 힘드셔던 적이 있으실 거예요.</p><p>한마디로 <em>말로 풀리는 사람인데, 한 번에 다 말하면 안 되는 사람</em>입니다.</p><p>길게 쓰신 글은 보내지 마시고 세 줄로 줄이세요. 이 자리에서는 짧을수록 답이 옵니다.',
    '재성':'다시 만날 값을 재는 자리입니다. 마음보다 「이 사람과 앞으로가 되나」를 먼저 봅니다.</p><p>이를테면 헤어진 이유가 정말 없어졌는지를 따져보거나, 다시 만나도 같은 자리로 돌아갈까 걱정하거나, 그 사람의 지금 상황부터 알아보는 것이 여기에 해당해요.</p><p>반대로 조건이 정리되면 아주 담담하게 다시 시작하십니다.</p><p>다만 재는 사이에 시기가 지나갑니다.</p><p>결론이 안 나서 미루다 그 사람에게 다른 사람이 생긴 적이 있으실 거예요.</p><p>한마디로 <em>판단은 정확한데, 판단하는 동안 시간이 가는 사람</em>이에요.</p><p>따질 것은 하나만 정하세요. 헤어진 그 이유가 사라졌는지 하나만 보시면 됩니다. 나머지는 만나면서 보시고요.',
    '관성':'확실한 자리로 돌아가고 싶은 자리입니다. 흐지부지 다시 만나는 것은 오히려 더 힘드세요.</p><p>이를테면 「다시 만나는 거야, 아닌 거야」가 정리되어야 마음이 놓이거나, 애매하게 연락만 오가는 사이를 못 견디거나, 다시 만난다면 예전과는 달라야 한다고 생각하는 것이 여기에 해당해요.</p><p>반대로 약속을 다시 세우고 시작하면 아주 단단해집니다.</p><p>다만 답을 서두르면 상대가 물러납니다.</p><p>확인하려고 던진 말에 오히려 사이가 멀어진 적이 있으실 거예요.</p><p>한마디로 <em>확실해야 편한 사람인데, 확실해지는 데 시간이 드는 사람</em>입니다.</p><p>다시 만나자는 말보다 한 번 보자는 말이 먼저입니다. 이 자리에서는 순서만 바꿔도 답이 달라집니다.',
    '인성':'헤어지고 나서야 알게 되는 자리입니다. 받은 것이 얼마나 컸는지 뒤늦게 보입니다.</p><p>이를테면 그 사람이 챙겨주던 일들이 이제야 하나씩 떠오르거나, 힘든 날 기댈 데가 없어 그 사람 생각이 나거나, 그때는 당연했던 것이 지금은 고맙게 느껴지는 것이 여기에 해당해요.</p><p>반대로 그 마음을 말로 전하면 상대도 크게 흔들립니다.</p><p>다만 그리움과 사랑을 헷갈리기 쉽습니다.</p><p>그 사람이 그리운 건지 기댈 데가 그리운 건지 헷갈리신 적이 있으실 거예요.</p><p>한마디로 <em>많이 받은 사람인데, 그 사실을 늦게 아는 사람</em>이에요.</p><p>연락하기 전에 하나만 스스로 물어보세요. 그 사람이 그리운가, 그 자리가 그리운가. 답이 앞쪽이면 연락하셔도 됩니다.'},
  '이별운':{
    '비겁':'먼저 등을 돌리는 것이 어려운 자리입니다. 끝내야 하는 걸 알면서도 먼저 말하기가 힘드세요.</p><p>이를테면 누가 먼저 말을 꺼내나 서로 버티다 시간만 흐르거나, 헤어지는 순간에도 아쉬운 티를 안 내려 하거나, 이별 뒤에 한참 지나서야 마음이 무너지는 것이 여기에 해당해요.</p><p>반대로 정리하고 나면 회복이 아주 빠릅니다.</p><p>다만 버티는 시간이 제일 아깝습니다.</p><p>이미 끝난 걸 알면서 몇 달을 그대로 보내신 적이 있으실 거예요.</p><p>한마디로 <em>먼저 정리하는 것이 지는 것 같아 늦어지는 사람</em>이에요.</p><p>먼저 끝내는 것은 지는 것이 아닙니다. 이 자리에서는 먼저 정리하는 쪽이 덜 다칩니다.',
    '식상':'말로 끝내는 자리입니다. 담아두지 못하고 다 쏟아내게 되세요.</p><p>이를테면 참아온 이야기가 마지막에 한꺼번에 나오거나, 헤어지고 나서 보낸 메시지를 다음 날 후회하거나, 주변에 다 이야기하고 나서야 마음이 정리되는 것이 여기에 해당해요.</p><p>반대로 할 말을 다 하고 나면 뒤가 아주 깨끗합니다.</p><p>다만 끝낼 말과 상처 줄 말이 섞입니다.</p><p>그때 그 말은 하지 말걸 싶은 한마디가 있으실 거예요.</p><p>한마디로 <em>말로 풀어야 끝나는 사람인데, 마지막 말은 골라야 하는 사람</em>입니다.</p><p>마지막에 할 말은 미리 세 줄로 적어두세요. 그 세 줄만 말하고 나오시면 됩니다.',
    '재성':'현실부터 정리하는 자리입니다. 마음보다 손이 먼저 움직여요.</p><p>이를테면 헤어지자마자 물건이나 사진부터 정리하거나, 같이 쓰던 돈이나 약속을 먼저 매듭짓거나, 슬픔보다 앞으로의 계획이 먼저 떠오르는 것이 여기에 해당해요.</p><p>반대로 현실이 정리되면 마음도 비교적 빨리 따라옵니다.</p><p>다만 마음을 미뤄두었다 나중에 옵니다.</p><p>다 정리하고 잘 지내다가 한참 뒤에 갑자기 무너지신 적이 있으실 거예요.</p><p>한마디로 <em>정리는 잘하는데, 슬퍼할 시간을 안 주는 사람</em>이에요.</p><p>정리한 뒤에 하루는 아무것도 하지 마세요. 이 자리에서는 미룬 슬픔이 반드시 나중에 옵니다.',
    '관성':'확실히 매듭지어야 하는 자리입니다. 끝난 건지 아닌 건지 애매한 것이 제일 힘드세요.</p><p>이를테면 「우리 이제 뭐야」를 계속 묻게 되거나, 연락이 뜼해지며 자연스럽게 멀어지는 방식을 못 견디거나, 차라리 확실히 끝내달라고 말하게 되는 것이 여기에 해당해요.</p><p>반대로 매듭이 지어지면 그다음은 아주 담담하게 지나가십니다.</p><p>다만 매듭을 짓느라 더 오래 붙잡습니다.</p><p>끝난 관계를 확인하려고 몇 번이나 다시 연락하신 적이 있으실 거예요.</p><p>한마디로 <em>흐지부지보다 매듭이 편한 사람인데, 매듭에 시간을 너무 쓰는 사람</em>입니다.</p><p>답을 못 받아도 끝은 끝입니다. 상대의 대답 없이 스스로 매듭짓는 연습이 이 자리에는 필요합니다.',
    '인성':'빈자리가 크게 남는 자리입니다. 기대던 데가 없어지는 것이 제일 힘드세요.</p><p>이를테면 힘든 일이 생겼을 때 연락할 사람이 없어 더 크게 느껴지거나, 그 사람이 해주던 작은 일들이 계속 생각나거나, 혼자 오래 곱씹으며 잠을 설치는 것이 여기에 해당해요.</p><p>반대로 기대 사람이 곁에 있으면 회복이 아주 빠릅니다.</p><p>다만 혼자 삭이다 오래 갑니다.</p><p>남한테는 괜찮다고 하고 혼자만 힘드셨던 적이 있으실 거예요.</p><p>한마디로 <em>안으로 앓는 사람인데, 밖으로 내놓아야 나는 사람</em>이에요.</p><p>말할 사람 한 명은 꼭 만드세요. 사람이 어려우면 종이에 적으셔도 됩니다. 이 자리에서는 꺼내놓는 것이 곳 회복입니다.'},
  '궁합':{
    '비겁':'둘이 나란히 서야 하는 자리입니다. 누가 위에 서는 관계는 오래 못 가세요.</p><p>이를테면 상대가 다 정해주면 고마우면서도 답답하거나, 서로 지지 않으려다 사소한 일로 커지거나, 먼저 사과하는 쪽이 늘 정해져 있으면 그것이 쌓이는 것이 여기에 해당해요.</p><p>반대로 서로를 어른으로 대하는 사이에서는 아주 오래갑니다.</p><p>다만 비슷한 사람끼리는 부딪힙니다.</p><p>닮아서 좋았던 점이 나중에 똑같이 부딪히는 점이 된 적이 있으실 거예요.</p><p>한마디로 <em>나란히 설 때 잘 맞는데, 먼저 숙이는 쪽이 없으면 오래 못 가는 사이</em>예요.</p><p>둘 중 누가 먼저 푸는지를 정해두지 마세요. 대신 싸운 다음 날 같이 밥 먹는 규칙 하나만 두시면 됩니다.',
    '식상':'표현으로 이어지는 자리입니다. 말과 반응이 오가야 사이가 살아요.</p><p>이를테면 연락이 뜼해지면 마음부터 식거나, 재미있는 이야기를 나눈 때 가장 가깝게 느끼거나, 상대가 표현이 없으면 사랑받는지 알 수가 없는 것이 여기에 해당해요.</p><p>반대로 표현이 많은 상대와는 아주 잘 맞습니다.</p><p>다만 말이 많으면 상처도 많습니다.</p><p>서로 할 말 다 하다가 크게 다투신 적이 있으실 거예요.</p><p>한마디로 <em>말로 가까워지고 말로 멀어지는 사이</em>입니다.</p><p>둘 사이에 하지 않을 말 세 가지만 정해두세요. 그 세 가지만 안 하면 이 사이는 웬만해선 안 깨집니다.',
    '재성':'현실이 맞아야 하는 자리입니다. 마음만으로는 오래 못 가는 쪽이에요.</p><p>이를테면 돈 쓰는 방식이 다르면 유난히 크게 걸리거나, 앞으로의 계획이 안 맞으면 마음이 식거나, 사는 모습이 비슷한 사람에게 편안함을 느끼는 것이 여기에 해당해요.</p><p>반대로 생활 감각이 비슷한 상대와는 다툴 일이 크게 줄어듭니다.</p><p>다만 조건이 마음을 덮습니다.</p><p>맞는 사람인데 마음이 안 가서 스스로 답답하셨던 적이 있으실 거예요.</p><p>한마디로 <em>현실이 맞아야 마음도 가는 사이</em>예요.</p><p>돈 쓰는 방식만 한 번 맞춰보세요. 이 사이에서는 그 하나가 나머지 아홉을 정합니다.',
    '관성':'약속으로 지켜지는 자리입니다. 정해진 것이 있어야 마음이 놓여요.</p><p>이를테면 연락 시간이나 만나는 요일이 지켜지면 안심하거나, 상대가 약속을 가벼이 여기면 크게 흔들리거나, 관계에 이름이 붙어야 편한 것이 여기에 해당해요.</p><p>반대로 성실한 상대와는 아주 안정된 사이가 됩니다.</p><p>다만 규칙이 정을 누릅니다.</p><p>맞는 말을 했는데 상대가 굳어버린 적이 있으실 거예요.</p><p>한마디로 <em>약속으로 단단해지는 사이인데, 약속이 벌이 되면 안 되는 사이</em>입니다.</p><p>지킬 것을 정할 때는 벌 말고 이유를 같이 정하세요. 이 사이에서는 이유가 있어야 규칙이 삽니다.',
    '인성':'한쪽이 품는 자리입니다. 챙기고 챙김받는 모양으로 자리가 잡힙니다.</p><p>이를테면 상대가 많이 맞춰주고 있거나, 반대로 당신이 늘 돌보는 쪽이거나, 둘 중 한 사람이 어른 노릇을 하고 있는 것이 여기에 해당해요.</p><p>반대로 그 자리가 서로 편하면 아주 오래갑니다.</p><p>다만 한쪽이 먼저 지칩니다.</p><p>고맙던 일이 어느새 당연해져서 한쪽이 조용히 물러난 적이 있으실 거예요.</p><p>한마디로 <em>기대는 힘으로 이어지는 사이인데, 기대는 쪽이 고마움을 말해야 하는 사이</em>예요.</p><p>한 달에 한 번은 역할을 바꿔보세요. 늘 챙기던 사람이 하루만 받는 자리에 앉으면 됩니다.'}
  };

  function ord(){
    try{ return JSON.parse(localStorage.getItem('stella_demo')); }catch(e){ return null; }
  }
  function tail(){
    var o=ord();
    var t=String((o?o.topic:'')||'').trim();
    var p=t.split('·');
    return p[p.length-1].trim();
  }
  function setLens(){
    var o=ord();
    if(!o){ return; }
    if(o.guardian_slug!=='door-love'){ return; }
    var T=LOVE2[tail()];
    if(!T){ return; }
    var G=window.StellaGuide;
    if(!G){ return; }
    var g=G['door-love'];
    if(!g){ return; }
    g.lens = g.lens || {};
    var k;
    for(k in T){
      if(Object.prototype.hasOwnProperty.call(T,k)){ g.lens[k]=T[k]; }
    }
  }
  setLens();
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', setLens);
  } else { setLens(); }
})();
</script>

<script>

    '식상':'움직이면서 답을 찾는 자리입니다. 앉아서 재는 시간이 길어질수록 답이 흐려져요.</p><p>이를테면 해보기 전에는 뭐가 맞는지 모르겠거나, 일단 시작하면 길이 보이거나, 말로 꺼내놓고 나서야 마음이 정리되는 것이 여기에 해당해요.</p><p>반대로 작게라도 한 번 해보면 답이 바로 나옵니다.</p><p>다만 벌여놓고 되돌리기 어려워집니다.</p><p>일단 저질렀다가 수습하느라 애쓰신 적이 있으실 거예요.</p><p>한마디로 <em>해봐야 아는 사람인데, 되돌릴 자리를 남겨야 하는 사람</em>입니다.</p><p>가장 작은 크기로 한 번만 해보세요. 이 자리에서는 그 한 번이 열 번 고민보다 낫습니다.',
    '재성':'실익을 따져야 마음이 놓이는 자리입니다. 숫자로 적어 놓으면 답이 빨리 나와요.</p><p>이를테면 고민을 종이에 적어 비교하거나, 「그래서 얼마나 남는데」가 먼저 떠오르거나, 마음만으로 정한 결정을 나중에 후회하는 것이 여기에 해당해요.</p><p>반대로 조건이 정리되면 아주 담담하게 결정하십니다.</p><p>다만 재는 사이에 때를 놓칩니다.</p><p>따져보다가 기회가 지나가버린 적이 있으실 거예요.</p><p>한마디로 <em>계산은 정확한데, 계산할 시간이 길어지는 사람</em>이에요.</p><p>비교표는 한 장까지만 만드세요. 두 장째부터는 답이 아니라 걱정이 늘어납니다.',
    '관성':'기준이 있어야 정해지는 자리입니다. 옳은 쪽이 어디인지부터 보는 편이에요.</p><p>이를테면 규칙이나 약속을 먼저 확인하거나, 남에게 땡땡한지를 따져보거나, 애매하게 넘어가는 결정을 못 견디는 것이 여기에 해당해요.</p><p>반대로 기준이 분명하면 결정이 아주 빠릅니다.</p><p>다만 기준이 없으면 아예 못 정합니다.</p><p>둘 다 나쁜지 않은 선택 앞에서 유난히 오래 멈췐 계신 적이 있으실 거예요.</p><p>한마디로 <em>옳은 쪽을 잘 아는 사람인데, 옳고 그름이 없는 일에서는 멈추는 사람</em>입니다.</p><p>기준이 없는 일이라면 마감 날짜를 기준으로 삼으세요. 그날까지 정하기로만 해도 답이 나옵니다.',
    '인성':'알아보고 나서 정하는 자리입니다. 충분히 이해가 되어야 마음이 움직여요.</p><p>이를테면 결정 전에 자료를 잔뚟 찾아보거나, 겪어본 사람 이야기를 먼저 들어보거나, 잘 모르는 채로 정하는 것이 제일 불안한 것이 여기에 해당해요.</p><p>반대로 이해가 되고 나면 흔들리지 않고 밀고 가십니다.</p><p>다만 다 알고 나서 정하려다 늦습니다.</p><p>알아보는 사이에 답이 저절로 정해져버린 적이 있으실 거예요.</p><p>한마디로 <em>깊이 아는 사람인데, 아는 데 시간을 다 쓰는 사람</em>이에요.</p><p>알아볼 시간을 미리 정해두세요. 사흘이면 사흘, 그때까지만 알아보고 정하시면 됩니다.'
  };

  function ord(){
    try{ return JSON.parse(localStorage.getItem('stella_demo')); }catch(e){ return null; }
  }
  function setLens(){
    var o=ord();
    if(!o){ return; }
    var slug=o.guardian_slug;
    var T=null;
    if(slug==='door-astro'){ T=STAR; }
    if(slug==='door-tarot'){ T=CARD; }
    if(!T){ return; }
    var G=window.StellaGuide;
    if(!G){ return; }
    var g=G[slug];
    if(!g){ return; }
    g.lens = g.lens || {};
    var k;
    for(k in T){
      if(Object.prototype.hasOwnProperty.call(T,k)){ g.lens[k]=T[k]; }

  setLens();
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', setLens);

<script>
/* 접힘 상자 첫 줄을 쉬운 말로  FOLD-1  2026-09-02
   두 번째 책부터 나오는 접힘 상자의 첫 줄이
   「시각을 먼저 바로잡습니다 · 여덟 글자 · … 외 2장 — 모두 6장」처럼
   장 제목을 늘어놓아서 손님이 무슨 말인지 알기 어려웠습니다.
   한 줄로 바꿉니다. 9번 조각은 건드리지 않고 그려진 글자만 고칩니다.
   이 안에서 두 글자짜리 논리기호를 쓰지 않습니다. */
(function(){
  'use strict';

  function fix(){
    var bars=document.getElementsByClassName('foldbar');
    var i, bar, lead, m, n, txt;
    for(i=0;i<bars.length;i++){
      bar=bars[i];
      if(bar.className.indexOf('skipbar')>=0){ continue; }
      if(bar.getAttribute('data-lead')==='1'){ continue; }
      lead=bar.getElementsByClassName('foldlead')[0];
      if(!lead){ continue; }
      txt=String(lead.textContent||'');
      m=txt.match(/모두\s*(\d+)\s*장/);
      n=m?m[1]:'';
      lead.innerHTML = n
        ? ('지난 책에서 보신 계산 '+n+'장입니다. 태어난 날은 바뀌지 않으니 내용도 그대로예요.')
        : '지난 책에서 보신 계산입니다. 태어난 날은 바뀌지 않으니 내용도 그대로예요.';
      bar.setAttribute('data-lead','1');
    }
  }

  var tries = 0;
  function tick(){
    tries += 1;
    try{ fix(); }catch(e){}
    if(tries>40){ return; }
    setTimeout(tick, 500);
  }
  function go(){ setTimeout(tick, 600); }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', go);
  } else { go(); }
})();
</script>

<script>
/* 1부 긴 글을 화면에 실제로 올립니다  LENSDOM-1  2026-09-02
   찾아낸 것 — 전자책 본체(12번 조각)는 자기 자리에서 곧바로 1부를 그립니다.
   그래서 그 뒤에 놓인 조각들(19 · 21 · 23~27)이 아무리 긴 글을 넣어도
   화면에는 이미 짧은 글이 그려진 뒤였습니다. 손님은 계속 짧은 글을 봤습니다.
   조각 차례를 바꾸는 대신, 다 그려진 뒤에 그 세 문단만 긴 글로 갈아끼웁니다.
   글은 window.StellaGuide[문].lens 에서 그대로 가져오므로
   여기에는 글이 한 줄도 들어 있지 않습니다.
   직성의 신은 갈아끼우는 함수를 한 번 불러 줘야 lens 가 채워집니다.
   이 안에서 두 글자짜리 논리기호를 쓰지 않습니다. */
(function(){
  'use strict';

  var KEYS = ['비겁','식상','재성','관성','인성'];

  function ord(){
    try{ return JSON.parse(localStorage.getItem('stella_demo')); }catch(e){ return null; }
  }
  function lensOf(){
    var o = ord();
    if(!o){ return null; }
    var G = window.StellaGuide;
    if(!G){ return null; }
    var g = G[o.guardian_slug];
    if(!g){ return null; }
    return g.lens || null;
  }
  /* 직성의 신은 갈아끼우는 함수가 아직 안 불렸을 수 있습니다 */
  function warm(){
    if(!window.__stellaCareerLens){ return; }
    try{ window.__stellaCareerLens(); }catch(e){}
  }

  function pageOf(node){
    var n = node;
    while(n){
      if(n.className){ if(String(n.className).indexOf('page') >= 0){ return n; } }
      n = n.parentNode;
    }
    return null;
  }

  function fix(){
    var box = document.getElementById('ssb');
    if(!box){ return false; }
    var lens = lensOf();
    if(!lens){ return false; }

    /* 1부는 「… 의 언어로 다시 읽습니다」 라는 줄이 있는 낱장입니다 */
    var ps = box.getElementsByTagName('p'), i, hit = null;
    for(i=0;i<ps.length;i++){
      if(String(ps[i].textContent||'').indexOf('언어로 다시 읽습니다') >= 0){ hit = ps[i]; break; }
    }
    if(!hit){ return false; }
    var pg = pageOf(hit);
    if(!pg){ return false; }

    var h3 = pg.getElementsByTagName('h3');
    if(!h3.length){ return false; }

    var done = 0, j, k, t, key, p, box2, kid;
    for(j=0;j<h3.length;j++){
      if(h3[j].getAttribute('data-lens') === '1'){ done += 1; continue; }
      t = String(h3[j].textContent || '');
      key = '';
      for(k=0;k<KEYS.length;k++){
        if(t.indexOf(KEYS[k] + '이') >= 0){ key = KEYS[k]; }
      }
      if(!key){ continue; }
      if(t.indexOf('자리') < 0){ continue; }
      if(!lens[key]){ continue; }
      p = h3[j].nextElementSibling;
      if(!p){ continue; }
      if(p.tagName !== 'P'){ continue; }
      /* 이미 긴 글이면 놔둡니다 */
      if(String(p.textContent||'').length > 300){
        h3[j].setAttribute('data-lens','1'); done += 1; continue;
      }
      box2 = document.createElement('div');
      box2.innerHTML = '<p>' + lens[key] + '</p>';
      while(box2.firstChild){
        kid = box2.firstChild;
        box2.removeChild(kid);
        p.parentNode.insertBefore(kid, p);
      }
      p.parentNode.removeChild(p);
      h3[j].setAttribute('data-lens','1');
      done += 1;
    }
    return done > 0;
  }

  var tries = 0;
  function tick(){
    tries += 1;
    var ok = false;
    try{ ok = fix(); }catch(e){ ok = true; }
    if(ok){ return; }
    if(tries > 40){ return; }
    setTimeout(tick, 500);
  }
  function go(){ warm(); setTimeout(tick, 500); }
  warm();
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', go);
  } else { go(); }
})();
</script>

<script>
/* 어긋나는 자리 · 되풀이되는 두 문장을 저울마다 다르게  GAP-1  2026-09-02
   2부 「어긋나는 자리」는 저울 다섯 개를 같은 틀로 찍어냅니다.
   그래서 한 권 안에서 이 두 문장이 다섯 번 똑같이 나왔습니다 —

(function(){

    ['solo','B','그렇다고 혼자'],
    ['form','A','물론 무형'],

    ['make','A','그렇다고 새로'],
    ['make','B','그렇다고 정해진']
  ];

  var COST = {
    solo:{ A:'하루가 끝날 때 유난히 진이 빠집니다. 일을 못해서가 아니라, 혼자 있을 때 차오르는 기운을 계속 밖으로 쓰고 있어서예요.',
           B:'기운이 좀처럼 차오르지 않습니다. 게을러서가 아니라, 사람 사이에서 차오르는 기운을 혼자 만들어내려 하고 있어서예요.' },
    form:{ A:'해도 해도 남는 것이 없는 느낌이 듭니다. 실력이 모자라서가 아니라, 손에 잡히는 결과가 있어야 힘이 나는 사람이라서 그렇습니다.',
           B:'일은 되는데 마음이 헛헛해집니다. 성의가 없어서가 아니라, 뜻을 다룰 때 힘이 나는 사람이 눈앞의 것만 처리하고 있어서예요.' },
    many:{ A:'어느 것도 제대로 끝난 것 같지가 않습니다. 능력이 모자라서가 아니라, 하나에 붙어 있어야 깊어지는 사람이 계속 갈라져 있어서예요.',
           B:'지루함이 먼저 옵니다. 끈기가 없어서가 아니라, 여러 갈래를 같이 굴릴 때 살아나는 사람이 한 줄에 묶여 있어서예요.' },
    risk:{ A:'마음이 늘 서 있습니다. 겁이 많아서가 아니라, 틀이 잡혀야 힘이 나는 사람이 계속 흔들리는 판 위에 있어서예요.',
           B:'하루가 유난히 길게 느껴집니다. 성실하지 않아서가 아니라, 판이 움직여야 살아나는 사람이 멈춘 자리에 있어서예요.' },
    make:{ A:'결정 하나에 진이 빠집니다. 판단이 느려서가 아니라, 기준이 있어야 힘이 나는 사람이 매번 맨바닥에서 정하고 있어서예요.',
           B:'하는 일이 남의 일처럼 느껴집니다. 불성실해서가 아니라, 없던 것을 만들 때 살아나는 사람이 정해진 것만 지키고 있어서예요.' }
  };

  var SMALL = {
    solo:{ A:'기울기가 크지는 않아서 사람 속에서도 잘 지내십니다. 다만 하루에 혼자 있는 시간을 한 칸만 비워두시면 나머지가 훨씬 수월해집니다.',
           B:'기울기가 크지는 않아서 혼자서도 잘 해내십니다. 다만 일주일에 한 번은 누군가와 나누는 자리를 만들어두시면 나머지가 훨씬 수월해집니다.' },
    form:{ A:'기울기가 크지는 않아서 머리 쓰는 일도 잘 해내십니다. 다만 눈에 보이는 결과 하나를 가운데 두고 나머지를 붙이시면 훨씬 편합니다.',
           B:'기울기가 크지는 않아서 손으로 하는 일도 잘 해내십니다. 다만 뜻이나 이치를 다루는 일 하나를 가운데 두고 나머지를 붙이시면 훨씬 편합니다.' },
    many:{ A:'기울기가 크지는 않아서 여러 개도 곧잘 굴리십니다. 다만 그 가운데 하나를 주인공으로 정해두시면 나머지가 저절로 정리됩니다.',
           B:'기울기가 크지는 않아서 하나에 오래 붙어 계실 수도 있습니다. 다만 곁가지 하나쯤은 늘 열어두시는 편이 오히려 본줄기에 도움이 됩니다.' },
    risk:{ A:'기울기가 크지는 않아서 새 판에도 곧잘 올라타십니다. 다만 바뀌지 않는 것 하나를 정해두시면 나머지 변화가 훨씬 가볍습니다.',
           B:'기울기가 크지는 않아서 같은 자리도 잘 지키십니다. 다만 해마다 하나씩은 새로 벌여두시는 편이 오래 가는 힘이 됩니다.' },
    make:{ A:'기울기가 크지는 않아서 없던 것도 곧잘 만드십니다. 다만 기준 하나만 먼저 세워두고 시작하시면 훨씬 빠릅니다.',
           B:'기울기가 크지는 않아서 정해진 것도 잘 지키십니다. 다만 내 방식으로 바꿔도 되는 칸을 하나 남겨두시면 훨씬 오래 갑니다.' }
  };

  var BIG = {
    solo:{ A:'기울기가 큰 편이라 이 결은 나이가 들어도 잘 바뀌지 않습니다. 사람 속에 오래 머무는 자리라면, 혼자 회복하는 시간을 일정처럼 못 박아 두세요.',
           B:'기울기가 큰 편이라 이 결은 나이가 들어도 잘 바뀌지 않습니다. 혼자 버티는 자리가 길어지면, 함께할 사람을 구하는 것이 실력을 올리는 것보다 빠릅니다.' },
    form:{ A:'기울기가 큰 편이라 이 결은 잘 바뀌지 않습니다. 눈에 보이는 결과가 없는 자리에 오래 계시면, 잘하고 계셔도 잘하는 줄 모르게 됩니다.',
           B:'기울기가 큰 편이라 이 결은 잘 바뀌지 않습니다. 눈앞의 것만 처리하는 자리에 오래 계시면, 실력과 상관없이 마음이 먼저 지칩니다.' },
    many:{ A:'기울기가 큰 편이라 이 결은 잘 바뀌지 않습니다. 여러 갈래를 계속 굴려야 하는 자리라면, 하나를 주인공으로 정해두지 않는 한 계속 힘이 샙니다.',
           B:'기울기가 큰 편이라 이 결은 잘 바뀌지 않습니다. 한 가지만 오래 붙들어야 하는 자리라면, 곁가지를 하나 열어두지 않는 한 계속 답답하십니다.' },
    risk:{ A:'기울기가 큰 편이라 이 결은 잘 바뀌지 않습니다. 판이 자주 바뀌는 자리에 오래 계시면, 능력과 상관없이 늘 쫓기는 기분이 남습니다.',
           B:'기울기가 큰 편이라 이 결은 잘 바뀌지 않습니다. 아무것도 바뀌지 않는 자리에 오래 계시면, 성실함과 상관없이 힘이 먼저 빠집니다.' },
    make:{ A:'기울기가 큰 편이라 이 결은 잘 바뀌지 않습니다. 매번 맨바닥에서 정해야 하는 자리라면, 기준을 만들어 두는 일이 곧 일의 절반입니다.',
           B:'기울기가 큰 편이라 이 결은 잘 바뀌지 않습니다. 정해진 대로만 해야 하는 자리에 오래 계시면, 성의와 상관없이 마음이 먼저 식습니다.' }
  };

  var CUT = '오래 이어지면 ';
  var MARK = '결을 거슬러 밀고 있어서입니다';
  var S1 = '다만 차이가 아주 큰 편은 아닙니다';
  var S2 = '기울기가 큰 편이라 이 차이는';

  function look(p){
    var out = { key:'', side:'', close:null, big:false };
    var n = p.nextElementSibling, hops = 0, t, i;
    while(n){
      if(hops > 5){ break; }
      if(n.tagName === 'H3'){ break; }
      if(n.tagName === 'P'){
        t = String(n.textContent || '');
        for(i=0;i<NB.length;i++){
          if(t.indexOf(NB[i][2]) === 0){ out.key = NB[i][0]; out.side = NB[i][1]; }
        }
        if(t.indexOf(S1) === 0){ out.close = n; out.big = false; }
        if(t.indexOf(S2) === 0){ out.close = n; out.big = true; }
      }
      n = n.nextElementSibling;
      hops += 1;
    }
    return out;
  }

  function fix(){
    var box = document.getElementById('ssb');
    if(!box){ return; }
    var ps = box.getElementsByTagName('p');
    var list = [], i, t;
    for(i=0;i<ps.length;i++){
      t = String(ps[i].textContent || '');
      if(t.indexOf(MARK) < 0){ continue; }
      if(ps[i].getAttribute('data-gap') === '1'){ continue; }
      list.push(ps[i]);
    }
    for(i=0;i<list.length;i++){
      var p = list[i];
      var got = look(p);
      if(!got.key){ continue; }
      var h = p.innerHTML;
      var k = h.indexOf(CUT);
      if(k >= 0){
        p.innerHTML = h.slice(0, k + CUT.length) + COST[got.key][got.side];
      }
      p.setAttribute('data-gap','1');
      if(got.close){
        got.close.innerHTML = got.big ? BIG[got.key][got.side] : SMALL[got.key][got.side];
      }
    }
  }

  var tries = 0;
  function tick(){
    tries += 1;
    try{ fix(); }catch(e){}
    if(tries > 40){ return; }
    setTimeout(tick, 500);
  }
  function go(){ setTimeout(tick, 700); }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', go);
  } else { go(); }
})();
</script>
