   모든 CSS 는 #ssp 안으로 묶여 있어 다른 페이지에 영향을 주지 않습니다.

<style id="ssp-lotto-css">
#ssp{
  --void:#0D0A1A; --void-deep:#070512;
  --nebula:#1C1533; --nebula-soft:#251C42;
  --purple-glow:rgba(140,101,214,.35);
  --gold:#D4AF6A; --gold-soft:#C9A66B; --gold-lite:#E8CD96;
  --star:#F2ECE0; --ink-soft:rgba(242,236,224,.72); --ink-dim:rgba(242,236,224,.46);
  --line:rgba(212,175,106,.18);

  /* 테마 폭 제한을 벗어나 화면 전체를 씁니다 */
  max-width:none !important; width:auto !important;
  margin-left:calc(50% - 50vw) !important; margin-right:calc(50% - 50vw) !important;
  padding:0 !important;
  position:relative; z-index:0; overflow-x:clip;
  color:var(--star); text-align:center;
  font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-weight:300; line-height:1.75; font-size:16px;
  word-break:keep-all; overflow-wrap:break-word;
}
#ssp *{margin:0; padding:0; box-sizing:border-box;}
#ssp h1,#ssp h2{font-family:'Noto Serif KR',serif; color:var(--star); font-weight:700; letter-spacing:normal;}
#ssp a{color:inherit; text-decoration:none;}
#ssp button{font:inherit;}

#ssp .ssp-stars{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,.9), transparent),
    radial-gradient(1px 1px at 82% 12%, rgba(255,255,255,.7), transparent),
    radial-gradient(1.5px 1.5px at 62% 62%, rgba(255,255,255,.8), transparent),
    radial-gradient(1px 1px at 28% 78%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.5px 1.5px at 90% 52%, rgba(255,255,255,.7), transparent),
    radial-gradient(1px 1px at 45% 32%, rgba(255,255,255,.5), transparent),
    var(--void);
}
#ssp .ssp-inner{position:relative; z-index:1; max-width:940px; margin:0 auto; padding:76px 24px 110px;}
@media(max-width:700px){ #ssp .ssp-inner{padding:48px 18px 80px;} }

/* ── 머리말 ─────────────────────────────────────────────── */
#ssp .ssp-kicker{font-family:'IBM Plex Mono',monospace; font-size:.7rem; letter-spacing:.22em;
  text-transform:uppercase; color:var(--gold); margin-bottom:16px;}
#ssp h1{font-size:clamp(1.8rem,4.6vw,2.8rem); line-height:1.35;}
#ssp .ssp-lead{margin:18px auto 0; color:var(--ink-soft); font-size:1rem; max-width:520px;}

/* ── 추첨 무대 ──────────────────────────────────────────── */
#ssp .stage{
  margin:56px auto 0; max-width:760px; padding:56px 32px 44px; border-radius:14px;
  background:radial-gradient(ellipse at 50% 0%, rgba(140,101,214,.14), transparent 62%), var(--nebula);
  border:1px solid var(--line); box-shadow:0 40px 90px -50px rgba(0,0,0,.9);
}
@media(max-width:700px){ #ssp .stage{padding:36px 18px 32px; margin-top:38px; border-radius:12px;} }

#ssp .wheel-wrap{position:relative; width:340px; height:340px; margin:0 auto;}
@media(max-width:560px){ #ssp .wheel-wrap{width:250px; height:250px;} }

#ssp .wheel-pointer{
  position:absolute; top:-14px; left:50%; transform:translateX(-50%); z-index:5;
  width:0; height:0; border-left:13px solid transparent; border-right:13px solid transparent;
  border-top:20px solid var(--gold);
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.7));
}
#ssp .wheel{
  position:absolute; inset:0; border-radius:50%;
  background:radial-gradient(circle at 34% 28%, rgba(212,175,106,.13), var(--void-deep) 68%);
  border:2px solid var(--gold-soft);
  box-shadow:inset 0 0 46px rgba(0,0,0,.72), 0 0 60px -14px var(--purple-glow);
}
#ssp .wheel-face{position:absolute; inset:0; will-change:transform;}
#ssp .wheel-num{
  position:absolute; top:50%; left:50%; width:26px; height:26px; margin:-13px 0 0 -13px;
  display:flex; align-items:center; justify-content:center;
  font-family:'IBM Plex Mono',monospace; font-size:.66rem; font-weight:500;
  color:var(--ink-soft); transition:color .2s ease;
}
@media(max-width:560px){ #ssp .wheel-num{font-size:.56rem; width:22px; height:22px; margin:-11px 0 0 -11px;} }
#ssp .wheel-num.hit{color:var(--void-deep); font-weight:700;}
#ssp .wheel-num.hit::before{
  content:''; position:absolute; inset:-2px; border-radius:50%; z-index:-1;
  background:linear-gradient(135deg, var(--gold-lite), var(--gold-soft));
}
#ssp .wheel-hub{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:76px; height:76px; border-radius:50%; z-index:4;
  background:linear-gradient(160deg, var(--nebula-soft), var(--void-deep));
  border:1px solid var(--gold-soft);
  display:flex; align-items:center; justify-content:center;
  color:var(--gold); font-size:1.5rem;
  box-shadow:0 6px 20px rgba(0,0,0,.6);
}
@media(max-width:560px){ #ssp .wheel-hub{width:58px; height:58px; font-size:1.2rem;} }

/* ── 뽑힌 번호 ──────────────────────────────────────────── */
#ssp .balls{display:flex !important; justify-content:center; align-items:center; gap:12px;
  flex-wrap:wrap; min-height:66px; margin-top:38px;}
#ssp .ball{
  width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:1.15rem; color:var(--void-deep);
  background:linear-gradient(135deg, var(--gold), var(--gold-lite));
  box-shadow:0 12px 26px -10px var(--purple-glow), inset 0 -3px 8px rgba(0,0,0,.18);
  animation:ssp-pop .45s cubic-bezier(.2,1.5,.4,1) backwards;
}
@media(max-width:560px){ #ssp .ball{width:46px; height:46px; font-size:1rem; gap:8px;} }
@keyframes ssp-pop{ from{opacity:0; transform:translateY(-26px) scale(.4);} to{opacity:1; transform:none;} }
#ssp .balls .hint{color:var(--ink-dim); font-size:.88rem;}

#ssp .btn{
  margin-top:34px; padding:16px 36px; border-radius:3px; border:none; cursor:pointer;
  font-size:.95rem; font-weight:700; color:var(--void-deep);
  background:linear-gradient(135deg, var(--gold), #B98A47);
  box-shadow:0 16px 34px -14px rgba(212,175,106,.55);
  transition:transform .2s ease, opacity .2s ease;
}
#ssp .btn:hover{transform:translateY(-2px);}
#ssp .btn:disabled{opacity:.45; cursor:default; transform:none;}
#ssp .note{margin-top:22px; font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--ink-dim);}

/* ── 다음 단계 유도 ─────────────────────────────────────── */
#ssp .upsell{margin:46px auto 0; max-width:560px; padding:28px 24px;
  border:1px solid var(--line); border-radius:10px;}
#ssp .upsell p{font-size:.92rem; color:var(--ink-soft);}
#ssp .upsell a{display:inline-block; margin-top:14px; font-family:'IBM Plex Mono',monospace;
  font-size:.82rem; color:var(--gold); border-bottom:1px solid var(--gold-soft); padding-bottom:3px;}
#ssp .upsell a:hover{color:var(--gold-lite);}

@media(prefers-reduced-motion:reduce){
  #ssp *,#ssp *::before,#ssp *::after{animation:none !important; transition:none !important;}
}
</style>

<div id="ssp">
  <div class="ssp-stars" aria-hidden="true"></div>
  <div class="ssp-inner">

    <div class="ssp-kicker">Free &middot; 심심풀이</div>
    <h1>이번주 로또 추첨</h1>
    <p class="ssp-lead">명성의 신이 돌리는 운명의 원판이에요.<br>버튼을 누를 때마다 새로 뽑혀요 — 재미로만 봐주세요.</p>

    <div class="stage">
      <div class="wheel-wrap">
        <div class="wheel-pointer" aria-hidden="true"></div>
        <div class="wheel">
          <div class="wheel-face" id="wheelFace"></div>
          <div class="wheel-hub" aria-hidden="true">&#10022;</div>
        </div>
      </div>

      <div class="balls" id="balls" aria-live="polite">
        <span class="hint">버튼을 눌러 번호를 뽑아보세요</span>
      </div>

      <button type="button" class="btn" id="drawBtn">번호 뽑기 &rarr;</button>
      <div class="note">본 번호는 참고용이며 당첨을 보장하지 않습니다</div>
    </div>

    <div class="upsell">
      <p>번호 말고, 올해 나의 재물 흐름이 궁금하다면?</p>
      <a href="/#doors">여섯 개의 문 열어보기 &rarr;</a>
    </div>

  </div>
</div>

<script>
(function(){
  var face = document.getElementById('wheelFace');
  var btn  = document.getElementById('drawBtn');
  var tray = document.getElementById('balls');
  if(!face || !btn || !tray) return;

  var TOTAL = 45, STEP = 360/TOTAL;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 원판 테두리에 1~45 배치
  var radius = (face.clientWidth || 340)/2 - 24;
  var nums = [];
  for(var i=0;i<TOTAL;i++){
    var el = document.createElement('div');
    el.className = 'wheel-num';
    el.textContent = i+1;
    var a = (i*STEP - 90) * Math.PI/180;      // 12시 방향부터 시계방향
    el.style.transform = 'translate(' + (radius*Math.cos(a)).toFixed(1) + 'px,'
                                      + (radius*Math.sin(a)).toFixed(1) + 'px)';
    face.appendChild(el);
    nums.push(el);
  }
  // 화면 폭이 바뀌면 반지름 다시 계산
  window.addEventListener('resize', function(){
    var r = (face.clientWidth || 340)/2 - 24;
    if(Math.abs(r - radius) < 2) return;
    radius = r;
    nums.forEach(function(el,i){
      var a = (i*STEP - 90) * Math.PI/180;
      el.style.transform = 'translate(' + (radius*Math.cos(a)).toFixed(1) + 'px,'
                                        + (radius*Math.sin(a)).toFixed(1) + 'px)';
    });
  });

  function pickSix(){
    var s = new Set();
    while(s.size < 6) s.add(Math.floor(Math.random()*TOTAL)+1);
    return Array.from(s).sort(function(a,b){ return a-b; });
  }
  function addBall(n, delay){
    var b = document.createElement('div');
    b.className = 'ball';
    b.textContent = n;
    b.style.animationDelay = delay + 'ms';
    tray.appendChild(b);
  }
  function markHit(n){
    nums.forEach(function(el){ el.classList.remove('hit'); });
    if(n) nums[n-1].classList.add('hit');
  }

  var angle = 0, spinning = false;

  btn.addEventListener('click', function(){
    if(spinning) return;
    var picked = pickSix();

    if(reduce){                                  // 모션 최소화 설정이면 바로 결과만
      tray.innerHTML = '';
      picked.forEach(function(n){ addBall(n, 0); });
      markHit(picked[picked.length-1]);
      return;
    }

    spinning = true;
    btn.disabled = true;
    tray.innerHTML = '';
    markHit(null);

    // 마지막 번호가 12시 바늘 아래에 멈추도록 목표 각도를 계산합니다
    var last = picked[picked.length-1];
    var landing = -((last-1)*STEP);
    var target = angle + 360*5 + (((landing - angle) % 360) + 360) % 360;
    var start = angle, dist = target - start;
    var DUR = 3200, t0 = null;

    // 돌아가는 동안 0.32초 간격으로 공이 하나씩 떨어집니다
    picked.forEach(function(n,i){
      setTimeout(function(){ addBall(n, 0); }, 700 + i*320);
    });

    function ease(x){ return 1 - Math.pow(1-x, 3); }   // 빠르게 돌다 서서히 멈춤
    function frame(ts){
      if(t0 === null) t0 = ts;
      var p = Math.min((ts - t0)/DUR, 1);
      angle = start + dist*ease(p);
      face.style.transform = 'rotate(' + angle + 'deg)';
      if(p < 1){ requestAnimationFrame(frame); }
      else {
        angle = ((target % 360) + 360) % 360;
        face.style.transform = 'rotate(' + angle + 'deg)';
        markHit(last);
        spinning = false;
        btn.disabled = false;
        btn.textContent = '다시 뽑기 →';
      }
    }
    requestAnimationFrame(frame);
  });
})();
</script>
