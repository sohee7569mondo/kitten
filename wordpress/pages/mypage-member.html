<!-- wp:html -->
<!--
  STELLA SAJU — 마이페이지 · 회원 부분 (페이지 185 의 두 번째 블록)
  BUILD: M3

  첫 번째 블록은 브라우저 저장소만 읽습니다. 이 블록이 서버에 물어봐서
  회원이면 진짜 값으로 덮어씁니다.

    GET  /wp-json/stella/v1/me         잔액 · 만료일 · 사용내역 · 주문 · 내 책
    POST /wp-json/stella/v1/profile    정보 고치기를 서버에도 저장
    POST /wp-json/stella/v1/email      이메일 없이 가입한 분에게 나중에 받기
    POST /wp-json/stella/v1/reopen     지난 풀이를 다시 펼치기 (구슬 안 받음)
    GET  /wp-json/stella/v1/packs      충전 묶음 목록 (값은 서버가 정합니다)
    POST /wp-json/stella/v1/pay        결제창 열기
    POST /wp-json/stella/v1/pay-check  결제를 마치고 돌아왔을 때 확인

  로그인하지 않은 채로 오시면 맨 위에 '들어오기' 안내를 띄웁니다.

  회원이 아니거나 서버가 응답하지 않으면 아무것도 건드리지 않습니다.
  (첫 번째 블록이 그리던 화면이 그대로 남습니다)
-->
<style>
#ssm .srv{margin-top:14px;}
#ssm .srv .line{display:flex !important; justify-content:space-between; gap:14px;
  padding:11px 0; border-bottom:1px solid rgba(212,175,106,.1); font-size:.92rem;}
#ssm .srv .line:last-child{border-bottom:0;}
#ssm .srv .line .a{color:rgba(242,236,224,.72);}
#ssm .srv .line .b{color:#F2ECE0; font-family:'IBM Plex Mono',monospace; font-size:.86rem; flex:0 0 auto;}
#ssm .srv .line .b.minus{color:#E0907F;}
#ssm .srv .line .b.plus{color:#9AD1A5;}
#ssm .srv .none{font-size:.9rem; color:rgba(242,236,224,.46); padding:8px 0;}
#ssm .exp{margin-top:10px; font-size:.84rem; color:rgba(242,236,224,.46);}
#ssm .askmail{margin-top:16px; padding:18px 20px; border-radius:10px;
  background:rgba(140,101,214,.1); border:1px solid rgba(140,101,214,.3);}
#ssm .askmail p{font-size:.92rem; color:rgba(242,236,224,.72); line-height:1.85;}
#ssm .askmail .box{display:flex !important; gap:8px; margin-top:12px; flex-wrap:wrap;}
#ssm .askmail input{flex:1 1 200px; background:#070512; border:1px solid rgba(212,175,106,.18);
  color:#F2ECE0; padding:13px 14px; border-radius:6px; font-family:inherit; font-size:17px;}
#ssm .askmail input:focus{outline:none; border-color:#D4AF6A;}
#ssm .askmail .say{margin-top:10px; font-size:.86rem; display:none;}
#ssm .askmail .say.on{display:block;}
#ssm .askmail .say.err{color:#E5A0A0;}
#ssm .askmail .say.ok{color:#9AD1A5;}
#ssm .books a{display:block; padding:14px 16px; border-radius:9px; margin-top:9px;
  background:#070512; border:1px solid rgba(212,175,106,.18); color:#F2ECE0;
  text-decoration:none; font-size:.94rem; transition:border-color .2s ease;}
#ssm .books a:hover{border-color:#D4AF6A;}
#ssm .books a small{display:block; margin-top:4px; font-size:.78rem;
  color:rgba(242,236,224,.46); font-family:'IBM Plex Mono',monospace;}

/* 지난 풀이 다시 열기 */
#ssm .again .row{display:flex !important; align-items:center; gap:12px; flex-wrap:wrap;
  padding:14px 16px; border-radius:9px; margin-top:9px;
  background:#070512; border:1px solid rgba(212,175,106,.18);}
#ssm .again .who{flex:1 1 180px; font-size:.94rem; color:#F2ECE0;}
#ssm .again .who small{display:block; margin-top:4px; font-size:.78rem;
  color:rgba(242,236,224,.46); font-family:'IBM Plex Mono',monospace;}
#ssm .again .go{flex:0 0 auto; background:none; border:1px solid rgba(212,175,106,.4);
  color:#D4AF6A; padding:9px 14px; border-radius:6px; cursor:pointer;
  font-family:inherit; font-size:.86rem; transition:border-color .2s ease, color .2s ease;}
#ssm .again .go:hover{border-color:#D4AF6A; color:#E8CD96;}
#ssm .again .go:disabled{opacity:.45; cursor:default;}

/* 친구 추천 */
#ssm .ref .box{display:flex !important; gap:8px; flex-wrap:wrap; margin-top:4px;}
#ssm .ref input{flex:1 1 220px; background:#070512; border:1px solid rgba(212,175,106,.18);
  color:#F2ECE0; padding:13px 14px; border-radius:6px;
  font-family:'IBM Plex Mono',monospace; font-size:16px;}
#ssm .ref input:focus{outline:none; border-color:#D4AF6A;}
#ssm .ref .copy{flex:0 0 auto; background:linear-gradient(135deg,#D4AF6A,#B98A47);
  border:0; color:#070512; font-weight:700; padding:0 20px; border-radius:6px;
  cursor:pointer; font-family:inherit; font-size:.9rem;}
#ssm .ref .tally{margin-top:14px; font-size:.9rem; color:rgba(242,236,224,.72);}
#ssm .ref .tally b{color:#D4AF6A;}
#ssm .ref .cap{margin-top:6px; font-size:.8rem; color:rgba(242,236,224,.46);}
#ssm .ref .say{margin-top:10px; font-size:.86rem; color:#9AD1A5; display:none;}
#ssm .ref .say.on{display:block;}

/* 구슬 충전 */
#ssm .buy{display:grid !important; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:4px;}
@media(max-width:520px){ #ssm .buy{grid-template-columns:1fr;} }
#ssm .buy .pack{text-align:left; background:#070512; border:1px solid rgba(212,175,106,.18);
  border-radius:9px; padding:16px 18px; cursor:pointer; color:#F2ECE0;
  font-family:inherit; transition:border-color .2s ease, transform .2s ease;}
#ssm .buy .pack:hover{border-color:#D4AF6A; transform:translateY(-2px);}
#ssm .buy .pack:disabled{opacity:.5; cursor:default; transform:none;}
#ssm .buy .pack .n{font-size:1.05rem; font-weight:700;}
#ssm .buy .pack .w{margin-top:3px; font-size:.78rem; color:rgba(242,236,224,.46);}
#ssm .buy .pack .p{margin-top:10px; font-family:'IBM Plex Mono',monospace;
  font-size:.94rem; color:#D4AF6A;}
#ssm .buy .pack .best{display:inline-block; margin-left:7px; padding:2px 8px; border-radius:20px;
  background:#D4AF6A; color:#070512; font-size:.62rem; font-weight:700;
  font-family:'IBM Plex Mono',monospace; vertical-align:middle;}
#ssm .paysay{margin-top:12px; font-size:.86rem; display:none;}
#ssm .paysay.on{display:block;}
#ssm .paysay.err{color:#E5A0A0;}
#ssm .paysay.ok{color:#9AD1A5;}
#ssm .paycap{margin-top:12px; font-size:.8rem; color:rgba(242,236,224,.46); line-height:1.8;}
#ssm .bills{margin-top:16px;}
#ssm .bills .b1{display:flex !important; justify-content:space-between; gap:14px;
  padding:10px 0; border-bottom:1px solid rgba(212,175,106,.1); font-size:.88rem;}
#ssm .bills .b1:last-child{border-bottom:0;}
#ssm .bills .b1 .l{color:rgba(242,236,224,.72);}
#ssm .bills .b1 .r{color:#D4AF6A; font-family:'IBM Plex Mono',monospace; flex:0 0 auto;}

/* 로그인 안 하신 분께 */
#ssm .guest{margin-bottom:30px; padding:20px 22px; border-radius:10px;
  background:rgba(140,101,214,.1); border:1px solid rgba(140,101,214,.3);}
#ssm .guest p{font-size:.94rem; color:rgba(242,236,224,.72); line-height:1.85;}
#ssm .guest b{color:#F2ECE0;}
#ssm .guest a{display:inline-block; margin-top:12px; padding:12px 20px; border-radius:6px;
  background:linear-gradient(135deg,#D4AF6A,#B98A47); color:#070512;
  font-weight:700; font-size:.92rem; text-decoration:none;}
#ssm .guest a.alt{margin-left:10px; background:none; color:#D4AF6A;
  border:1px solid rgba(212,175,106,.45); font-weight:600;}
</style>

<script>
(function(){
  var root=document.getElementById('ssm'); if(!root) return;

  /* 서버가 알려준 내 정보를 담아둡니다 (나라 같은 것을 잃지 않으려고) */
  var MEMBER=null;

  /* 워드프레스가 본문 속 앰퍼샌드를 고쳐 쓰기 때문에, 글자로 직접 쓰지 않습니다 */
  var AMP=String.fromCharCode(38);
  function esc(s){ return String(s==null?'':s)
    .split(AMP).join(AMP+'amp;').split('<').join(AMP+'lt;').split('>').join(AMP+'gt;'); }

  function section(title, sub, inner){
    var s=document.createElement('section');
    s.innerHTML='<h2>'+esc(title)+'</h2>'
      + (sub ? '<p class="sub">'+esc(sub)+'</p>' : '')
      + inner;
    return s;
  }

  /* 구슬 칸을 찾아 그 뒤에 새 칸을 붙입니다 */
  function orbSection(){
    var n=document.getElementById('oNum');
    if(!n){ return null; }
    var s=n;
    while(s){ if(s.tagName==='SECTION'){ return s; } s=s.parentNode; }
    return null;
  }

  function paintMe(me){
    /* 1 — 구슬 잔액 */
    var num=document.getElementById('oNum'), txt=document.getElementById('oTxt');
    if(num){ num.textContent=String(me.balance); }
    if(txt){
      txt.textContent = me.trial
        ? '지금은 체험판이라 모든 문이 무료입니다. 받으신 구슬은 그대로 남아 있어요.'
        : '풀이 한 편에 '+me.prices.base+'구슬, 인생길잡이 종합본은 '+me.prices.full+'구슬입니다.';
    }
    var host=orbSection();
    if(!host){ return; }

    if(me.expires){
      var e=document.createElement('div');
      e.className='exp';
      e.textContent='가장 먼저 사라지는 구슬 : '+me.expires+' 까지';
      host.appendChild(e);
    }

    /* 2 — 이메일이 없는 분께 */
    if(me.needs_email){
      var w=document.createElement('div');
      w.className='askmail';
      w.innerHTML='<p><b>이메일을 넣어두시겠어요?</b><br>'
        + '지금은 이 브라우저에만 계정이 묶여 있어요. 이메일을 넣어두시면 '
        + '폰이나 다른 컴퓨터에서도 구슬과 보시던 책을 그대로 이어보실 수 있습니다.</p>'
        + '<div class="box"><input type="email" id="mMail" placeholder="you@example.com">'
        + '<button type="button" class="btn" id="mMailGo">저장</button></div>'
        + '<div class="say" id="mMailSay"></div>';
      host.appendChild(w);

      document.getElementById('mMailGo').addEventListener('click', function(){
        var v=document.getElementById('mMail').value.trim();
        var say=document.getElementById('mMailSay');
        function tell(t,k){ say.textContent=t; say.className='say on '+k; }
        if(v.indexOf('@')<1){ tell('이메일을 정확히 적어주세요.','err'); return; }
        tell('저장하고 있어요…','');
        fetch('/wp-json/stella/v1/email', {
          method:'POST', headers:{'Content-Type':'application/json'},
          credentials:'same-origin', body:JSON.stringify({email:v})
        }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
          .then(function(res){
            if(!res.ok){ tell(res.j.message || '저장하지 못했어요.','err'); return; }
            tell('저장했어요. 환영 메일을 보내드렸습니다.','ok');
          })
          .catch(function(){ tell('저장하지 못했어요. 잠시 후 다시 시도해주세요.','err'); });
      });
    }

    /* 3 — 구슬 내역 */
    var rows='';
    if(me.log){ if(me.log.length){
      for(var i=me.log.length-1;i>=0;i--){
        var it=me.log[i], n2=Number(it.n)||0;
        rows+='<div class="line"><span class="a">'+esc(it.date)+' · '+esc(it.why||'사용')+'</span>'
           +  '<span class="b '+(n2<0?'minus':'plus')+'">'+(n2>0?'+':'')+n2+'</span></div>';
      }
    } }
    if(!rows){ rows='<div class="none">아직 쓰신 내역이 없어요.</div>'; }
    host.parentNode.insertBefore(
      section('구슬 내역','넣어드린 구슬은 그날로부터 1년간 쓰실 수 있어요.',
              '<div class="card srv">'+rows+'</div>'),
      host.nextSibling);

    /* 4 — 내가 받은 풀이 (따로 저장해둔 글이 있으면) */
    var books='';
    if(me.readings){ if(me.readings.length){
      for(var k=0;k<me.readings.length;k++){
        var b=me.readings[k];
        var href=b.link || b.url || '';
        books+='<a href="'+esc(href)+'">'+esc(b.title||'풀이')
            +  '<small>'+esc(b.date||'')+'</small></a>';
      }
    } }
    if(books){
      host.parentNode.insertBefore(
        section('보관된 글','따로 저장해둔 풀이입니다.','<div class="books">'+books+'</div>'),
        host.nextSibling);
    }

    /* 5 — 지난 풀이 다시 열기 */
    paintAgain(me, host);

    /* 6 — 친구 추천 */
    paintRef(me, host);

    /* 7 — 구슬 충전.
       칸은 host 바로 뒤에 끼워 넣기 때문에, 나중에 넣은 것이 위로 옵니다.
       충전은 구슬 잔액 바로 아래에 있어야 하므로 맨 마지막에 부릅니다. */
    paintPay(me, host);
  }

  /* ── 구슬 충전 ────────────────────────────────────────────
     값은 서버에서 받아옵니다. 여기에 값을 적어두지 않습니다 —
     화면의 숫자를 고쳐도 결제되는 값은 서버가 정한 값 그대로입니다. */
  function paintPay(me, host){
    if(!me.pay){ return; }

    var sec=section('구슬 충전',
      me.pay.ready
        ? '카드로 바로 채우실 수 있어요. 해외 카드도 받습니다.'
        : '결제는 준비하고 있어요. 조금만 기다려주세요.',
      '<div class="buy" id="mBuy"></div>'
      + '<div class="paysay" id="mPaySay"></div>'
      + '<div class="paycap">채우신 구슬은 1년 동안 쓰실 수 있어요. '
      + '결제창은 스트라이프(Stripe)가 띄웁니다 — 카드 번호는 저희 쪽에 남지 않습니다.</div>'
      + '<div class="bills" id="mBills"></div>');
    host.parentNode.insertBefore(sec, host.nextSibling);

    paintBills(me);

    if(!me.pay.ready){
      var off=document.getElementById('mBuy');
      if(off){ off.innerHTML='<button type="button" class="pack" disabled>'
        + '<div class="n">준비중</div><div class="w">준비되는 대로 열어드려요</div></button>'; }
      return;
    }

    fetch('/wp-json/stella/v1/packs', { credentials:'same-origin' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d){ return; }
        if(!d.packs){ return; }
        drawPacks(d.packs);
      })
      .catch(function(){});
  }

  function drawPacks(packs){
    var wrap=document.getElementById('mBuy');
    if(!wrap){ return; }

    var html='', i, k, best=0, mostOrbs=0;
    for(i=0;i<packs.length;i++){ if(packs[i].orbs>mostOrbs){ mostOrbs=packs[i].orbs; best=i; } }

    for(i=0;i<packs.length;i++){
      k=packs[i];
      html += '<button type="button" class="pack" data-id="'+esc(k.id)+'">'
           +  '<div class="n">'+esc(k.name)
           +  (i===best ? '<span class="best">가장 큼</span>' : '')
           +  '</div>'
           +  '<div class="w">'+esc(k.note)+'</div>'
           +  '<div class="p">'+esc(k.price)+'</div></button>';
    }
    wrap.innerHTML=html;

    wrap.addEventListener('click', function(e){
      var btn=e.target;
      while(btn){
        if(btn.className){ if(String(btn.className).indexOf('pack')>=0){ break; } }
        btn=btn.parentNode;
      }
      if(!btn){ return; }
      if(btn.disabled){ return; }
      buy(btn.getAttribute('data-id')||'', wrap);
    });
  }

  function buy(id, wrap){
    if(!id){ return; }
    var all=wrap.querySelectorAll('.pack'), i;
    for(i=0;i<all.length;i++){ all[i].disabled=true; }
    say('결제창을 여는 중…','');

    fetch('/wp-json/stella/v1/pay', {
      method:'POST', headers:{'Content-Type':'application/json'},
      credentials:'same-origin', body:JSON.stringify({pack:id})
    }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .then(function(res){
        if(!res.ok){ throw new Error(res.j.message||''); }
        if(!res.j.url){ throw new Error(''); }
        location.href=res.j.url;
      })
      .catch(function(err){
        for(var n=0;n<all.length;n++){ all[n].disabled=false; }
        var why='';
        if(err){ if(err.message){ why=err.message; } }
        say(why ? why : '결제창을 열지 못했어요. 잠시 후 다시 해주세요.','err');
      });
  }

  function say(text, kind){
    var el=document.getElementById('mPaySay');
    if(!el){ return; }
    el.textContent=text;
    el.className='paysay on'+(kind ? ' '+kind : '');
  }

  function paintBills(me){
    var el=document.getElementById('mBills');
    if(!el){ return; }
    if(!me.bills){ return; }
    if(!me.bills.length){ return; }
    var html='', i, b;
    for(i=0;i<me.bills.length;i++){
      b=me.bills[i];
      html += '<div class="b1"><span class="l">'+esc(b.date)+' · 구슬 '+b.orbs+'개</span>'
           +  '<span class="r">'+esc(b.paid)+'</span></div>';
    }
    el.innerHTML='<div style="font-size:.84rem;color:rgba(242,236,224,.46);margin-bottom:6px">충전 내역</div>'+html;
  }

  /* 결제를 마치고 돌아오셨을 때 —
     서버에 결제번호를 주고 다시 확인합니다.
     브라우저가 '됐어요' 하는 말은 믿지 않습니다. */
  function afterPay(){
    var q=new URLSearchParams(location.search);
    var paid=q.get('paid');
    if(!paid){ return false; }

    var sid=q.get('s')||'';
    if(history.replaceState){ history.replaceState(null,'',location.pathname); }

    if(paid!=='1'){ return false; }
    if(!sid){ return false; }

    fetch('/wp-json/stella/v1/pay-check', {
      method:'POST', headers:{'Content-Type':'application/json'},
      credentials:'same-origin', body:JSON.stringify({session:sid})
    }).then(function(r){ return r.json(); })
      .then(function(d){
        if(!d){ return; }
        if(!d.ok){ return; }
        var num=document.getElementById('oNum');
        if(num){ num.textContent=String(d.balance); }
        say(d.added>0
          ? '구슬 '+d.added+'개를 채웠어요. 지금 '+d.balance+'개입니다.'
          : '결제를 확인했어요. 지금 구슬은 '+d.balance+'개입니다.','ok');
      })
      .catch(function(){});
    return true;
  }

  /* ── 지난 풀이 ────────────────────────────────────────────
     전자책은 저장해둔 파일이 아니라 열 때마다 그 자리에서 다시 계산합니다.
     그래서 계산기가 좋아지면 다시 여는 것만으로 새 계산이 반영됩니다. */
  function paintAgain(me, host){
    if(!me.orders){ return; }
    if(!me.orders.length){ return; }

    var rows='', i, o, who;
    for(i=me.orders.length-1; i>=0; i--){
      o=me.orders[i];
      who=esc(o.guardian||'풀이');
      if(o.topic){ who += ' · ' + esc(o.topic); }
      rows += '<div class="row"><div class="who">' + who
           +  '<small>' + esc(o.date||'') + '</small></div>'
           +  '<button type="button" class="go" data-id="' + esc(o.id||'') + '">다시 열기 →</button></div>';
    }

    var sec=section('받으신 풀이',
      '다시 여실 때 구슬은 받지 않습니다. 계산기가 좋아지면 그 자리에서 다시 세워 보여드려요.',
      '<div class="again">'+rows+'</div>');
    host.parentNode.insertBefore(sec, host.nextSibling);

    sec.addEventListener('click', function(e){
      var btn=e.target;
      if(!btn){ return; }
      if(btn.className.indexOf('go')<0){ return; }
      var id=btn.getAttribute('data-id')||'';
      btn.disabled=true;
      var was=btn.textContent;
      btn.textContent='펼치는 중…';
      fetch('/wp-json/stella/v1/reopen', {
        method:'POST', headers:{'Content-Type':'application/json'},
        credentials:'same-origin', body:JSON.stringify({id:id})
      }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
        .then(function(res){
          if(!res.ok){ throw new Error(res.j.message||''); }
          location.href = res.j.next || '/reading-book/';
        })
        .catch(function(){
          btn.disabled=false;
          btn.textContent=was;
        });
    });
  }

  /* ── 친구 추천 ──────────────────────────────────────────── */
  function paintRef(me, host){
    var r=me.ref;
    if(!r){ return; }
    if(!r.code){ return; }

    var tally;
    if(r.count>0){
      tally='지금까지 <b>'+r.count+'명</b>이 이 링크로 들어왔고, '
          + '<b>'+r.orbs+'구슬</b>을 받으셨어요.';
    } else {
      tally='아직 아무도 안 들어왔어요. 링크를 한 번 보내보시겠어요?';
    }

    var sec=section('친구 추천',
      '친구가 이 링크로 들어와 가입을 마치면 구슬 '+r.each+'개를 드려요. 풀이 한 편을 더 보실 수 있는 양입니다.',
      '<div class="ref">'
      + '<div class="box"><input type="text" id="mRefUrl" readonly value="'+esc(r.url)+'">'
      + '<button type="button" class="copy" id="mRefCopy">복사</button></div>'
      + '<div class="tally">'+tally+'</div>'
      + '<div class="cap">추천으로 받으실 수 있는 구슬은 모두 '+r.max+'개까지예요. '
      + '친구가 이메일까지 남겨야 구슬이 올라갑니다.</div>'
      + '<div class="say" id="mRefSay">복사했어요. 붙여넣기만 하시면 돼요.</div>'
      + '</div>');
    host.parentNode.insertBefore(sec, host.nextSibling);

    document.getElementById('mRefCopy').addEventListener('click', function(){
      var box=document.getElementById('mRefUrl');
      var say=document.getElementById('mRefSay');

      function told(){ say.className='say on'; }
      function oldWay(){
        box.focus();
        box.select();
        try{ box.setSelectionRange(0, 200); }catch(err){}
        try{ if(document.execCommand('copy')){ told(); } }catch(err){}
      }

      /* 요즘 브라우저 먼저, 안 되면 옛 방식으로 */
      if(navigator.clipboard){
        navigator.clipboard.writeText(box.value).then(told, oldWay);
        return;
      }
      oldWay();
    });
  }

  /* 어떤 요소가 들어 있는 section 을 찾습니다 */
  function sectionOf(el){
    var s=el;
    while(s){ if(s.tagName==='SECTION'){ return s; } s=s.parentNode; }
    return null;
  }

  /* 이 브라우저에 저장된 사주 정보가 있는지 */
  function hasLocal(){
    try{
      var raw=localStorage.getItem('stella_demo');
      if(!raw){ return false; }
      var o=JSON.parse(raw);
      if(!o){ return false; }
      return !!o.profile;
    }catch(e){ return false; }
  }

  function two(x){ return (x<10?'0':'')+x; }

  /* 다음에 오실 때는 첫 번째 블록이 알아서 그리도록 씨앗을 심습니다 */
  function seedLocal(p){
    try{ localStorage.setItem('stella_demo', JSON.stringify({ profile:p })); }catch(e){}
  }

  /* 서버가 알려준 정보로 사주 정보 칸을 채웁니다 */
  function paintProfile(p){
    function put(id, text){ var e=document.getElementById(id); if(e){ e.textContent=text; } }
    put('vName', p.name || '—');
    put('vSex', p.sex==='M' ? '남성' : '여성');
    var d=p.year+'년 '+p.month+'월 '+p.day+'일';
    if(p.calendar==='lunar'){ d='음력 '+d; }
    put('vDate', d);
    var knows=true;
    if(p.hour===null){ knows=false; }
    if(p.hour===undefined){ knows=false; }
    if(p.hour===''){ knows=false; }
    put('vTime', knows ? (two(p.hour)+':'+two(p.minute||0)) : '모름 (시주 없이 여섯 글자로 봅니다)');
    put('vPlace', p.city || '—');
  }

  /* ── 다른 기기에서 들어오신 회원 ─────────────────────────
     첫 번째 블록은 이 브라우저에 남은 것만 읽습니다. 폰을 바꾸셨거나
     시크릿 창이면 아무것도 없어서 「아직 넣으신 정보가 없어요」가 뜨고,
     구슬 · 친구 추천 · 받으신 풀이 칸이 전부 감춰집니다.

     그런데 서버는 이분을 알고 있습니다. 그래서 회원이면 감춰둔 칸을
     열어 서버 값으로 채웁니다. 회원가입을 한 보람이 여기서 납니다. */
  function revealForMember(me){
    if(hasLocal()){ return; }
    var has=document.getElementById('mHas');
    if(!has){ return; }

    if(me.profile){
      paintProfile(me.profile);
      seedLocal(me.profile);
      var empty=document.getElementById('mEmpty');
      if(empty){ empty.classList.add('hidden'); }
      /* 첫 번째 블록이 일찍 멈춰서 고치기 화면이 없습니다.
         한 번 새로 불러오면 그때부터 제대로 열립니다. */
      var edit=document.getElementById('mEdit');
      if(edit){ edit.addEventListener('click', function(){ location.reload(); }); }
    } else {
      var view=document.getElementById('mView');
      if(view){
        var sec=sectionOf(view);
        if(sec){ sec.style.display='none'; }
      }
    }

    /* 이 브라우저에는 마지막 풀이 기록이 없습니다.
       화면에 박혀 있는 예시가 남으면 거짓말이 되니 감춥니다. */
    var last=document.getElementById('mLastSec');
    if(last){ last.style.display='none'; }

    has.classList.remove('hidden');
  }

  /* ── 아직 가입 안 하신 분께 ──────────────────────────────
     여기 보이는 것은 이 브라우저에 남은 것뿐입니다.
     폰을 바꾸거나 시크릿 창으로 오시면 사라지는 것들이라,
     가입하시는 길을 먼저 알려드립니다. */
  function askLogin(){
    var wrap=root.querySelector('.wrap');
    if(!wrap){ return; }
    var box=document.createElement('div');
    box.className='guest';
    box.innerHTML='<p><b>지금 보시는 것은 이 브라우저에 남은 것뿐이에요.</b><br>'
      + '가입해 두시면 폰을 바꾸셔도 받으신 풀이와 구슬이 그대로 남습니다. '
      + '이메일과 비밀번호만 정하시면 됩니다 — 삼십 초면 끝나요.</p>'
      + '<a href="/signin/?join=1">가입하기 →</a>'
      + '<a class="alt" href="/signin/">이미 가입했어요</a>';

    /* 제목 아래에 놓습니다 */
    var dek=wrap.querySelector('.dek');
    if(dek){
      wrap.insertBefore(box, dek.nextSibling);
      return;
    }
    wrap.insertBefore(box, wrap.firstChild);
  }

  /* 정보 고치기를 서버에도 남깁니다 */
  function hookSave(){
    var btn=document.getElementById('mSave');
    if(!btn){ return; }
    btn.addEventListener('click', function(){
      function val(id){ var e=document.getElementById(id); return e ? e.value.trim() : ''; }
      function n(id){ var v=val(id); return v==='' ? null : parseInt(v,10); }

      /* 이 화면에는 나라를 고르는 칸이 없습니다.
         서버가 알려준 나라를 그대로 돌려보냅니다. 그러지 않으면
         밴쿠버에서 태어난 분을 한국으로 덮어써서, 시차와 경도 보정이
         전부 틀어집니다. 모르면 그때만 한국으로 둡니다. */
      var land='대한민국';
      if(MEMBER){ if(MEMBER.profile){ if(MEMBER.profile.country){ land=MEMBER.profile.country; } } }

      var p={ name:val('fName'), sex:val('fSex'), city:val('fCity'),
              calendar:val('fCal'), country:land,
              year:n('fYear'), month:n('fMonth'), day:n('fDay'),
              hour:n('fHour'), minute:(n('fMin')===null?0:n('fMin')) };
      if(!p.year){ return; }
      if(!p.month){ return; }
      if(!p.day){ return; }
      fetch('/wp-json/stella/v1/profile', {
        method:'POST', headers:{'Content-Type':'application/json'},
        credentials:'same-origin', body:JSON.stringify({profile:p})
      }).catch(function(){});
    });
  }

  function start(){
    hookSave();
    fetch('/wp-json/stella/v1/me', { credentials:'same-origin' })
      .then(function(r){ return r.json(); })
      .then(function(me){
        if(!me){ return; }
        if(!me.member){ askLogin(); return; }
        MEMBER=me;
        revealForMember(me);
        paintMe(me);
        afterPay();
      })
      .catch(function(){});   /* 서버가 없으면 조용히 넘어갑니다 */
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
