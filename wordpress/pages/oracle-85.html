  [고친 것] 아바타 이미지가 다른 사이트(cancan8.wordpress.com)를 가리키고 있어
           stellasaju.com 의 미디어(ID 55)로 바로잡았습니다.
  [문구 추가/수정] 아래 LINES 배열에 한 줄씩 넣고 빼면 됩니다.
-->
<style>
#ssp{
  --void:#0D0A1A; --void-deep:#070512;
  --nebula:#1C1533; --nebula-soft:#251C42;
  --purple-glow:rgba(140,101,214,.35);
  --gold:#D4AF6A; --gold-soft:#C9A66B; --gold-lite:#E8CD96;
  --star:#F2ECE0; --ink-soft:rgba(242,236,224,.72); --ink-dim:rgba(242,236,224,.46);
  --line:rgba(212,175,106,.18);

  max-width:none !important; width:auto !important;
  margin-left:calc(50% - 50vw) !important; margin-right:calc(50% - 50vw) !important;
  padding:0 !important;
  position:relative; z-index:0; overflow-x:clip;
  color:var(--star); text-align:center;
  font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-weight:300; line-height:1.75; font-size:16px;
  word-break:keep-all; overflow-wrap:break-word;
}
#ssp *{margin:0; padding:0; box-sizing:border-box;}
#ssp h1,#ssp h2,#ssp h3{font-family:'Noto Serif KR',serif; color:var(--star); font-weight:700; letter-spacing:normal;}
#ssp a{color:inherit; text-decoration:none;}
#ssp button{font:inherit;}

#ssp .ssp-stars{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,.9), transparent),
    radial-gradient(1px 1px at 82% 12%, rgba(255,255,255,.7), transparent),
    radial-gradient(1.5px 1.5px at 62% 62%, rgba(255,255,255,.8), transparent),
    radial-gradient(1px 1px at 28% 78%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.5px 1.5px at 90% 52%, rgba(255,255,255,.7), transparent),
    radial-gradient(1px 1px at 45% 32%, rgba(255,255,255,.5), transparent),
    var(--void);
}
#ssp .ssp-inner{position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:76px 24px 110px;}
@media(max-width:700px){ #ssp .ssp-inner{padding:48px 18px 80px;} }

#ssp .ssp-kicker{font-family:'IBM Plex Mono',monospace; font-size:.7rem; letter-spacing:.22em;
  text-transform:uppercase; color:var(--gold); margin-bottom:16px;}
#ssp h1{font-size:clamp(1.8rem,4.6vw,2.8rem); line-height:1.35;}
#ssp .ssp-lead{margin:18px auto 0; color:var(--ink-soft); font-size:1rem; max-width:560px;}

#ssp .upsell{margin:52px auto 0; max-width:560px; padding:28px 24px;
  border:1px solid var(--line); border-radius:10px;}
#ssp .upsell p{font-size:.92rem; color:var(--ink-soft);}
#ssp .upsell a{display:inline-block; margin-top:14px; font-family:'IBM Plex Mono',monospace;
  font-size:.82rem; color:var(--gold); border-bottom:1px solid var(--gold-soft); padding-bottom:3px;}
#ssp .upsell a:hover{color:var(--gold-lite);}
@media(prefers-reduced-motion:reduce){
  #ssp *,#ssp *::before,#ssp *::after{animation:none !important; transition:none !important;}
}

#ssp .stage{
  margin:52px auto 0; max-width:640px; padding:52px 36px 42px; border-radius:14px;
  background:radial-gradient(ellipse at 50% 0%, rgba(140,101,214,.14), transparent 62%), var(--nebula);
  border:1px solid var(--line); box-shadow:0 40px 90px -50px rgba(0,0,0,.9);
}
@media(max-width:700px){ #ssp .stage{padding:34px 20px 32px; margin-top:36px; border-radius:12px;} }

/* 책 */
#ssp .book-stage{perspective:1400px; display:flex !important; justify-content:center;}
#ssp .book{position:relative; width:260px; height:188px;}
@media(max-width:520px){ #ssp .book{width:210px; height:152px;} }
#ssp .book-cover{position:absolute; inset:0; border-radius:4px 10px 10px 4px;
  background:linear-gradient(135deg, #2A1F4A, #150F2C);
  border:1px solid var(--gold-soft);
  box-shadow:0 26px 54px -18px var(--purple-glow), inset 0 0 0 7px rgba(212,175,106,.08);
  display:flex; align-items:center; justify-content:center;}
#ssp .book-cover .glyph{font-family:'Noto Serif KR',serif; font-size:2rem; color:var(--gold-soft); opacity:.75;}
#ssp .book-spine{position:absolute; left:-5px; top:5px; bottom:5px; width:9px;
  background:var(--gold-soft); opacity:.45; border-radius:3px;}
#ssp .book-page{position:absolute; inset:8px 8px 8px 13px; border-radius:2px 8px 8px 2px;
  background:linear-gradient(135deg,#F4EFE4,#E2D8C1); transform-origin:left center;
  display:flex; align-items:center; justify-content:center; padding:18px;
  box-shadow:inset 0 0 22px rgba(120,100,60,.2);}
#ssp .book-page.flip{animation:ssp-flip 1.1s ease forwards;}
@keyframes ssp-flip{0%{transform:rotateY(0);}50%{transform:rotateY(-105deg);}100%{transform:rotateY(0);}}
#ssp .book-page-text{font-family:'Noto Serif KR',serif; font-size:.82rem; color:#241B12;
  text-align:center; line-height:1.7;}

#ssp .seer{width:64px; height:64px; margin:26px auto 0; border-radius:50%; overflow:hidden;
  border:1px solid var(--gold-soft); box-shadow:0 0 26px var(--purple-glow);}
#ssp .seer img{width:100%; height:100%; object-fit:cover; object-position:center 15%; display:block;}

#ssp .qinput{width:100%; margin-top:26px; background:var(--void-deep); border:1px solid var(--line);
  color:var(--star); padding:15px 18px; border-radius:5px; font-family:inherit; font-size:.95rem;
  text-align:center; transition:border-color .2s ease;}
#ssp .qinput:focus{outline:none; border-color:var(--gold-soft);}
#ssp .qinput::placeholder{color:var(--ink-dim);}

#ssp .btn{margin-top:20px; padding:16px 36px; border-radius:3px; border:none; cursor:pointer;
  font-size:.95rem; font-weight:700; color:var(--void-deep);
  background:linear-gradient(135deg, var(--gold), #B98A47);
  box-shadow:0 16px 34px -14px rgba(212,175,106,.55); transition:transform .2s ease, opacity .2s ease;}
#ssp .btn:hover{transform:translateY(-2px);}
#ssp .btn:disabled{opacity:.45; cursor:default; transform:none;}

#ssp .answer{margin-top:30px; min-height:30px; font-family:'Noto Serif KR',serif;
  font-size:1.12rem; color:var(--gold); line-height:1.8;
  opacity:0; transform:translateY(8px); transition:opacity .5s ease, transform .5s ease;}
#ssp .answer.show{opacity:1; transform:none;}
#ssp .answer .q{display:block; font-size:.82rem; color:var(--ink-dim);
  font-family:'Noto Sans KR',sans-serif; margin-bottom:10px;}
#ssp .note{margin-top:24px; font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--ink-dim);}

</style>

<div id="ssp">
  <div class="ssp-stars" aria-hidden="true"></div>
  <div class="ssp-inner">

    <div class="ssp-kicker">Free &middot; 무제한</div>
    <h1>운명의 책</h1>
    <p class="ssp-lead">질문 하나를 떠올리고 책장을 넘기면, 명성의 신이 짧은 한 줄을 전해드려요.<br>몇 번이든 열어보세요.</p>

    <div class="stage">
      <div class="book-stage">
        <div class="book">
          <div class="book-spine" aria-hidden="true"></div>
          <div class="book-cover" aria-hidden="true"><div class="glyph">&#20874;</div></div>
          <div class="book-page" id="bookPage"><div class="book-page-text" id="bookPageText"></div></div>
        </div>
      </div>

      <div class="seer">
        <img src="https://stellasaju.com/wp-content/uploads/2026/08/grok_1787062580711.jpg"
             alt="명성의 신" width="784" height="1168" loading="lazy">
      </div>

      <input type="text" id="oracleQ" class="qinput" maxlength="60"
             placeholder="예: 오늘 중요한 결정을 내려도 될까요?">
      <button type="button" class="btn" id="oracleBtn">책장 넘기기 &rarr;</button>

      <div class="answer" id="oracleAnswer" aria-live="polite"></div>
      <div class="note">하루 몇 번이든 열어볼 수 있어요</div>
    </div>

    <div class="upsell">
      <p>한 줄 말고, 제대로 된 풀이가 궁금하다면?</p>
      <a href="/#doors">여섯 개의 문 열어보기 &rarr;</a>
    </div>

  </div>
</div>

<script>
(function(){
  var LINES = [
    '오늘은 무리한 지출을 삼가세요.',
    '지금은 기다림이 답일 수 있어요.',
    '작은 결정이 큰 흐름을 바꿉니다.',
    '가까운 사람의 말에 귀 기울여보세요.',
    '서두르지 않아도 늦지 않아요.',
    '오늘 하루는 스스로를 먼저 돌보세요.',
    '지금의 선택, 나쁘지 않은 방향이에요.',
    '잠시 멈추는 것도 나아가는 방법이에요.',
    '마음이 가는 쪽이 답일 때가 많아요.',
    '오늘은 평소보다 조금 더 신중하게.'
  ];
  var btn=document.getElementById('oracleBtn'), ans=document.getElementById('oracleAnswer');
  var page=document.getElementById('bookPage'), pageText=document.getElementById('bookPageText');
  var qbox=document.getElementById('oracleQ');
  if(!btn) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var last = -1, busy = false;

  function pick(){                      // 같은 줄이 연달아 나오지 않게
    var i; do { i = Math.floor(Math.random()*LINES.length); } while(LINES.length>1 && i===last);
    last = i; return LINES[i];
  }
  function esc(s){ return s.replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function reveal(q, line){
    ans.innerHTML = (q ? '<span class="q">\u201C' + esc(q) + '\u201D</span>' : '') + esc(line);
    ans.classList.add('show');
  }

  btn.addEventListener('click', function(){
    if(busy) return;
    var q = qbox.value.trim();
    var line = pick();

    if(reduce){ pageText.textContent = line; reveal(q, line); return; }

    busy = true; btn.disabled = true;
    ans.classList.remove('show');
    page.classList.remove('flip');
    void page.offsetWidth;              // 애니메이션 재시작
    page.classList.add('flip');
    pageText.textContent = '';
    setTimeout(function(){ pageText.textContent = line; }, 560);
    setTimeout(function(){
      reveal(q, line);
      busy = false; btn.disabled = false;
      btn.textContent = '다시 넘기기 \u2192';
    }, 680);
  });
  qbox.addEventListener('keydown', function(e){ if(e.key==='Enter') btn.click(); });
})();
</script>
