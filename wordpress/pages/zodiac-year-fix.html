<!--
  STELLA SAJU — 띠별운세 뒷손질 (페이지 92 의 두 번째 블록)

  두 가지를 합니다.

  [1] 전송 중에 깨진 한글 몇 자를 화면에서 되돌립니다.
      큰 블록을 다시 올리면 다른 자리가 또 깨질 수 있어 따로 답니다.

  [2] 월·일을 채워 넣고 다시 찾습니다.
      첫 블록은 지난번에 넣으신 '해'를 기억해 뒀다가 그대로 씁니다.
      그런데 월·일 칸이 생기기 전에 저장된 값에는 해밖에 없어서,
      1월생이 계속 뒷 띠로 나왔습니다.
      가입할 때 넣으신 생년월일에서 월·일을 가져와 채우고,
      '내 띠 찾기'를 한 번 눌러 줍니다.

  첫 블록을 다시 올릴 때 이 두 가지를 안에 넣으면, 이 블록은 지워도 됩니다.
-->
<script>
(function(){
  /* ── [1] 깨진 글자 되돌리기 ─────────────────────────── */
  var FIX=[
    ['뱗는','뻗는'],
    ['꿱이면','꺾이면'],
    ['앞서다니다','앞섭니다'],
    ['끕는 기운이라','끊는 기운이라'],
    ['릺고 끕는 것이','맺고 끊는 것이'],
    ['스메드는','스며드는'],
    ['크게 벗기보다','크게 뻗기보다'],
    ['어그나는 주','어긋나는 주'],
    ['어그납니다','어긋납니다'],
    ['얘히지','얽히지']
  ];

  function mend(){
    var root=document.getElementById('ssp');
    if(!root){ return; }
    var walk=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    var node, i, before;
    while((node=walk.nextNode())){
      before=node.nodeValue;
      if(!before){ continue; }
      for(i=0;i<FIX.length;i++){
        if(before.indexOf(FIX[i][0])>=0){
          before=before.split(FIX[i][0]).join(FIX[i][1]);
        }
      }
      if(before!==node.nodeValue){ node.nodeValue=before; }
    }
  }

  /* ── [2] 월·일 채워 넣고 다시 찾기 ───────────────────── */
  function fillDate(){
    var mon=document.getElementById('zMon');
    var day=document.getElementById('zDay');
    var yr =document.getElementById('zYear');
    var btn=document.getElementById('zFind');
    if(!mon){ return; }
    if(!day){ return; }
    if(!yr){ return; }
    if(!btn){ return; }

    /* 이미 월·일이 들어 있으면 건드리지 않습니다 */
    if(mon.value){ if(day.value){ return; } }

    var raw=null;
    try{ raw=localStorage.getItem('stella_demo'); }catch(err){ return; }
    if(!raw){ return; }

    var p=null;
    try{ p=JSON.parse(raw).profile; }catch(err){ return; }
    if(!p){ return; }
    if(!p.year){ return; }
    if(!p.month){ return; }
    if(!p.day){ return; }

    /* 음력으로 넣으신 분은 그대로 쓰면 안 됩니다.
       입춘은 양력 날짜로 견주는 것이라, 음력 날짜를 넣으면 엉뚱해집니다.
       그런 분은 손으로 넣으시게 두고 여기서는 손대지 않습니다. */
    if(p.calendar==='lunar'){ return; }

    yr.value  = String(p.year);
    mon.value = String(p.month);
    day.value = String(p.day);
    btn.click();
  }

  function go(){ mend(); fillDate(); mend(); }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', go);
  } else {
    go();
  }
  window.addEventListener('load', go);
})();
</script>
<!-- /wp:html -->
