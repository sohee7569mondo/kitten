  /* 도시를 못 찾았을 때 쓰는 나라 대표 도시 */
  var COUNTRY_CITY={
    '대한민국':'서울', '미국':'로스앤젤레스', '캐나다':'토론토', '일본':'도쿄',
    '중국':'베이징', '호주':'시드니', '영국':'런던', '뉴질랜드':'오클랜드',
    '독일':'베를린', '프랑스':'파리', '싱가포르':'싱가포르', '필리핀':'마닐라',
    '베트남':'호치민', '태국':'방콕', '기타':'서울'
  };

  /* ── 서머타임과 옛 표준시 ─────────────────────────────── */
  function ymd(y,m,d){ return y*10000+m*100+d; }

  /* 그 달 n번째 일요일 */
  function nthSun(y,m,n){
    var first=new Date(Date.UTC(y,m-1,1)).getUTCDay();      // 0=일
    var day=1+((7-first)%7)+(n-1)*7;
    return day;
  }
  /* 그 달 마지막 일요일 */
  function lastSun(y,m){
    var last=new Date(Date.UTC(y,m,0)).getUTCDate();
    var dow=new Date(Date.UTC(y,m-1,last)).getUTCDay();
    return last-dow;
  }

  /* 한국이 서머타임을 쓴 해와 기간 (표준시 자료 기준) */
  var KR_DST=[
    [19480601,19480913],[19490403,19490911],[19500401,19500910],[19510506,19510909],
    [19550505,19550909],[19560520,19560930],[19570505,19570922],[19580504,19580921],
    [19590504,19590920],[19600501,19600918],
    [19870510,19871011],[19880508,19881009]
  ];

  /* 한국 표준시는 두 번 바뀌었습니다 (동경 135도 ↔ 127.5도) */
  function koreaTz(y,mo,d){
    var t=ymd(y,mo,d);
    if(t < 19120101){ return 8.5; }
    if(t < 19540321){ return 9; }
    if(t < 19610810){ return 8.5; }
    return 9;
  }

  /* 서머타임이면 60(분), 아니면 0 */
  function dstMinutes(zone, y, mo, d){
    var t=ymd(y,mo,d);
    var i;

    if(zone==='kr'){
      for(i=0;i<KR_DST.length;i++){
        if(t>=KR_DST[i][0]){ if(t<KR_DST[i][1]){ return 60; } }
      }
      return 0;
    }

    if(zone==='na'){                                  /* 미국 · 캐나다 */
      if(y>=2007){
        if(t>=ymd(y,3,nthSun(y,3,2))){ if(t<ymd(y,11,nthSun(y,11,1))){ return 60; } }
        return 0;
      }
      if(y>=1987){
        if(t>=ymd(y,4,nthSun(y,4,1))){ if(t<ymd(y,10,lastSun(y,10))){ return 60; } }
        return 0;
      }
      if(y>=1976){
        if(t>=ymd(y,4,lastSun(y,4))){ if(t<ymd(y,10,lastSun(y,10))){ return 60; } }
        return 0;
      }
      return 0;
    }

    if(zone==='eu'){                                  /* 유럽 */
      if(y>=1996){
        if(t>=ymd(y,3,lastSun(y,3))){ if(t<ymd(y,10,lastSun(y,10))){ return 60; } }
        return 0;
      }
      if(y>=1981){
        if(t>=ymd(y,3,lastSun(y,3))){ if(t<ymd(y,9,lastSun(y,9))){ return 60; } }
        return 0;
      }
      return 0;
    }

    if(zone==='au'){                                  /* 호주 남동부 · 뉴질랜드 (남반구) */
      if(y>=2008){
        if(t>=ymd(y,10,nthSun(y,10,1))){ return 60; }
        if(t<ymd(y,4,nthSun(y,4,1))){ return 60; }
        return 0;
      }
      if(y>=1972){
        if(t>=ymd(y,10,lastSun(y,10))){ return 60; }
        if(t<ymd(y,3,lastSun(y,3))){ return 60; }
        return 0;
      }
      return 0;
    }

    return 0;
  }

  /* 옛 방식으로 부르는 화면을 위해 — 경도만 보고 어느 곳이었는지 되찾습니다.
     locate() 가 이 표에서 꺼낸 값이라 소수점까지 그대로 맞습니다. */
  function zoneOfLon(lon, tz){
    var keys=Object.keys(WORLD), i, w;
    for(i=0;i<keys.length;i++){
      w=WORLD[keys[i]];
      if(w[0]===lon){ if(w[2]===tz){ return w[3]; } }
    }
    keys=Object.keys(CITIES);
    for(i=0;i<keys.length;i++){
      if(CITIES[keys[i]][0]===lon){ return 'kr'; }
    }
    return '';
  }

  /* 도시 이름을 받아 좌표를 찾습니다. 못 찾으면 나라 대표 도시로.
     태어난 날짜를 같이 주시면 그날의 서머타임까지 셈해 돌려줍니다. */
  function locate(city, country, y, mo, d){
    var name=(city||'').replace(/\s/g,'').toUpperCase();
    var raw =(city||'').replace(/\s/g,'');
    var keys, i;

    /* 1) 해외 도시를 먼저 봅니다 (이름이 길어 더 정확합니다) */
    keys=Object.keys(WORLD);
    for(i=0;i<keys.length;i++){
      if(raw.indexOf(keys[i])>=0 || name.indexOf(keys[i].toUpperCase())>=0){
        var w=WORLD[keys[i]];
        return { lon:w[0], lat:w[1], tz:w[2], zone:w[3],
                 dst:dstMinutes(w[3],y,mo,d), matched:keys[i], exact:true, korea:false };
      }
    }

    /* 2) 국내 도시 */
    keys=Object.keys(CITIES);
    for(i=0;i<keys.length;i++){
      if(raw.indexOf(keys[i])>=0){
        return { lon:CITIES[keys[i]][0], lat:CITIES[keys[i]][1],
                 tz:koreaTz(y,mo,d), zone:'kr', dst:dstMinutes('kr',y,mo,d),
                 matched:keys[i], exact:true, korea:true };
      }
    }

    /* 3) 못 찾으면 나라 대표 도시 */
    var cc = COUNTRY_CITY[country] || '서울';
    if(CITIES[cc]){
      return { lon:CITIES[cc][0], lat:CITIES[cc][1],
               tz:koreaTz(y,mo,d), zone:'kr', dst:dstMinutes('kr',y,mo,d),
               matched:cc, exact:false, korea:true };
    }
    var g=WORLD[cc];
    return { lon:g[0], lat:g[1], tz:g[2], zone:g[3],
             dst:dstMinutes(g[3],y,mo,d), matched:cc, exact:false, korea:false };
  }

  /* ── 기본 도구 ───────────────────────────────────────────── */
  function jd(y,m,d,h,mi){
    h=h||0; mi=mi||0;
    if(m<=2){ y-=1; m+=12; }
    var A=Math.floor(y/100), B=2-A+Math.floor(A/4);
    return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))
           +d+B-1524.5+(h+mi/60)/24;
  }

  function sunLon(j){          // 겉보기 황경(도)
    var T=(j-2451545.0)/36525.0;
    var L0=(280.46646+36000.76983*T+0.0003032*T*T)%360;
    var M =(357.52911+35999.05029*T-0.0001537*T*T)%360;
    var Mr=M*Math.PI/180;
    var C =(1.914602-0.004817*T-0.000014*T*T)*Math.sin(Mr)
          +(0.019993-0.000101*T)*Math.sin(2*Mr)+0.000289*Math.sin(3*Mr);
    var om=125.04-1934.136*T;
    return (L0+C-0.00569-0.00478*Math.sin(om*Math.PI/180)+720)%360;
  }

  /* 태양 황경이 deg 가 되는 순간(UT 기준 JD).
     절기는 늘 그 달 4~9일 사이에 떨어지므로 창을 좁게 잡습니다. */
  function findTerm(deg, year, month){
    var lo=jd(year,month,1)-5, hi=jd(year,month,1)+15;
    function f(t){ var d=(sunLon(t)-deg+360)%360; return d>180 ? d-360 : d; }
    for(var i=0;i<60;i++){
      var mid=(lo+hi)/2;
      if(f(lo)*f(mid)<=0){ hi=mid; } else { lo=mid; }
    }
    return (lo+hi)/2;
  }

  /* 한 해의 열두 절기를 시각 순으로 */
  var termCache={};
  function termsOfYear(y){
    if(termCache[y]) return termCache[y];
    var list=TERMS.map(function(t){
      return { jd:findTerm(t.deg, y, t.month), name:t.name, ji:t.ji, deg:t.deg };
    }).sort(function(a,b){ return a.jd-b.jd; });
    termCache[y]=list;
    return list;
  }
  /* 앞뒤 해까지 이어 붙인 절기 목록 */
  function termsAround(y){
    return termsOfYear(y-1).concat(termsOfYear(y), termsOfYear(y+1));
  }

  /* 균시차(분) */
  function eqOfTime(j){
    var T=(j-2451545.0)/36525.0;
    var L0=(280.46646+36000.76983*T)%360;
    var M =(357.52911+35999.05029*T)%360;
    var e =0.016708634-0.000042037*T;
    var eps=23.439291-0.0130042*T;
    var y=Math.pow(Math.tan(eps/2*Math.PI/180),2);
    var Mr=M*Math.PI/180, L0r=L0*Math.PI/180;
    var E=y*Math.sin(2*L0r)-2*e*Math.sin(Mr)+4*e*y*Math.sin(Mr)*Math.cos(2*L0r)
         -0.5*y*y*Math.sin(4*L0r)-1.25*e*e*Math.sin(2*Mr);
    return E*180/Math.PI*4;
  }

  function pad(n){ return (n<10?'0':'')+n; }

  /* ── 본체 ────────────────────────────────────────────────── */
  /* opts = {year, month, day, hour, minute, sex:'M'|'F',
             lon, lat, tz}  (tz 는 표준시 오프셋, 한국은 9) */
  function compute(opts){
    var y=opts.year, mo=opts.month, d=opts.day;
    /* 워드프레스가 script 안의 논리연산자 두 개짜리 기호를 망가뜨려서, if 를 겹쳐 씁니다 */
    var hourKnown = true;
    if(opts.hour===null){ hourKnown=false; }
    if(opts.hour===undefined){ hourKnown=false; }
    var h = hourKnown ? opts.hour : 12;
    var mi= opts.minute || 0;
    var lon=126.978; if(opts.lon!==undefined){ if(opts.lon!==null){ lon=opts.lon; } }
    var lat=37.5665; if(opts.lat!==undefined){ if(opts.lat!==null){ lat=opts.lat; } }
    var tz=9; if(opts.tz!==undefined){ if(opts.tz!==null){ tz=opts.tz; } }

    /* 어느 시간대 규칙을 쓰는 곳인지 — 안 알려주면 경도로 되찾습니다 */
    var zone=''; if(opts.zone){ zone=opts.zone; }
    if(zone===''){ zone=zoneOfLon(lon, tz); }

    /* 우리나라 표준시는 1954~1961 사이에 동경 127.5도였습니다 */
    if(zone==='kr'){ tz=koreaTz(y,mo,d); }

    /* 서머타임을 쓰던 날이면 시계가 한 시간 앞서 있었습니다 */
    var dstMin=0;
    if(opts.dst!==undefined){ if(opts.dst!==null){ dstMin=opts.dst; } }
    else { dstMin=dstMinutes(zone, y, mo, d); }

    var clockMin=h*60+mi;
    var stdMin=clockMin-dstMin;        // 시계에서 서머타임을 벗긴 표준시

    var jdUT = jd(y,mo,d) + stdMin/1440 - tz/24;

    /* 1) 진태양시 */
    var lonCorr=(lon-tz*15)*4;          // 표준자오선과의 경도차 (분)
    var eot=eqOfTime(jdUT);
    var trueMin=stdMin+lonCorr+eot;
    var dayShift=0;
    while(trueMin<0){ trueMin+=1440; dayShift-=1; }
    while(trueMin>=1440){ trueMin-=1440; dayShift+=1; }
    /* 보여줄 때 쓸 분 단위. 먼저 반올림해야 02:60 같은 표기가 안 나옵니다. */
    var showMin=Math.round(trueMin);
    if(showMin>=1440){ showMin-=1440; }

    /* 2) 절기 — 태어난 순간이 어느 절 안에 있는지 */
    var jdLocal=jdUT;
    var around=termsAround(y);
    var found=null;
    for(var i=0;i<around.length;i++){
      if(around[i].jd<=jdLocal){ found=around[i]; } else { break; }
    }
    var monthJi = found ? found.ji : 2;
    var termName= found ? found.name : '입춘';

    /* 3) 연주 — 입춘을 새해로 봅니다 */
    var ipchun=findTerm(315, y, 2);
    var sajuYear = (jdLocal < ipchun) ? y-1 : y;
    var yg=((sajuYear-4)%10+10)%10;
    var yz=((sajuYear-4)%12+12)%12;

    /* 4) 월주 — 오호둔(五虎遁): 연간에 따라 인월의 천간이 정해집니다 */
    var startGan=[2,4,6,8,0][yg%5];      // 갑기→丙, 을경→戊, 병신→庚, 정임→壬, 무계→甲
    var fromTiger=((monthJi-2)%12+12)%12;      // 인월(寅)에서 몇 달째인지
    var mg=((startGan+fromTiger)%10+10)%10;
    var mz=monthJi;

    /* 5) 일주 — 1900-01-01(KST) 을 갑술일로 잡습니다.
          자시(23시)부터 다음 날로 넘기는 만세력 방식을 씁니다. */
    var dayNo=Math.round(jd(y,mo,d)-jd(1900,1,1))+dayShift;
    if(trueMin>=23*60){ dayNo+=1; }
    var dg=((dayNo)%10+10)%10;
    var dz=((dayNo+10)%12+12)%12;

    /* 6) 시주 — 오자둔(五子遁) */
    var hz=null, hg=null;
    if(hourKnown){
      hz=Math.floor(((trueMin+60)%1440)/120);   // 23~01 이 자시
      hg=((dg%5)*2+hz)%10;
    }

    /* 7) 오행 — 최대잔여법으로 반올림해 합이 100 이 되게 맞춥니다 */
    var gans=[yg,mg,dg], jis=[yz,mz,dz];
    if(hourKnown){ gans.push(hg); jis.push(hz); }
    var cnt={}; ELEMENTS.forEach(function(e){ cnt[e]=0; });
    gans.forEach(function(g){ cnt[GAN_EL[g]]++; });
    jis.forEach(function(z){ cnt[JI_EL[z]]++; });
    var totalChars=gans.length+jis.length;
    var raw=ELEMENTS.map(function(e){ return {el:e, n:cnt[e], exact:cnt[e]/totalChars*100}; });
    var floors=raw.map(function(r){ return Math.floor(r.exact); });
    var rest=100-floors.reduce(function(a,b){return a+b;},0);
    var order=raw.map(function(r,i){ return {i:i, frac:r.exact-Math.floor(r.exact)}; })
                 .sort(function(a,b){ return b.frac-a.frac; });
    for(var k=0;k<rest;k++){ floors[order[k%5].i]+=1; }
    var five=raw.map(function(r,i){ return {element:r.el, count:r.n, percent:floors[i]}; });

    /* 8) 대운 — 양남음녀는 순행, 음남양녀는 역행 */
    var yangYear=(yg%2===0);
    var male=(opts.sex==='M');
    var forward = (yangYear===male);
    var luckJd, luckDays;
    if(forward){
      luckJd=nextTermJd(jdLocal, y);  luckDays=luckJd-jdLocal;
    } else {
      luckJd=prevTermJd(jdLocal, y);  luckDays=jdLocal-luckJd;
    }
    var startAge=luckDays/3;
    var luck=[];
    for(var n=1;n<=8;n++){
      var lg=((mg+(forward?n:-n))%10+10)%10;
      var lz=((mz+(forward?n:-n))%12+12)%12;
      var a0=startAge+(n-1)*10;
      luck.push({ from:Math.round(a0*10)/10, to:Math.round((a0+10)*10)/10,
                  fromYear:y+Math.floor(a0), toYear:y+Math.floor(a0)+10,
                  gan:lg, ji:lz, han:GAN_H[lg]+JI_H[lz], kor:GAN_L[lg]+JI_L[lz] });
    }

    /* 9) 별 — 태양 · 상승궁 · 천정 */
    var sun=sunLon(jdUT);
    var T=(jdUT-2451545.0)/36525.0;
    var eps=(23.439291-0.0130042*T)*Math.PI/180;
    var d0=jdUT-2451545.0;
    var gmst=((280.46061837+360.98564736629*d0)%360+360)%360;
    var lst=((gmst+lon)%360+360)%360;
    var ramc=lst*Math.PI/180, phir=lat*Math.PI/180;
    var mc=(Math.atan2(Math.sin(ramc), Math.cos(ramc)*Math.cos(eps))*180/Math.PI+360)%360;
    var asc=(Math.atan2(Math.cos(ramc),
             -(Math.sin(eps)*Math.tan(phir)+Math.cos(eps)*Math.sin(ramc)))*180/Math.PI+360)%360;

    /* 경계에 걸린 분께는 알려드려야 합니다 */
    var warnings=[];
    if(found){
      var minsFromTerm=(jdLocal-found.jd)*1440;
      if(minsFromTerm<180){
        warnings.push('태어나신 시각이 ' + found.name + ' 로 넘어온 지 ' +
          Math.round(minsFromTerm) + '분밖에 안 됩니다. 절기 계산에 몇 분의 오차가 있을 수 있어 ' +
          '월주가 앞 달로 바뀔 가능성이 있습니다.');
      }
      var nextJd=nextTermJd(jdLocal, y);
      if(nextJd!==null){
        var minsToTerm=(nextJd-jdLocal)*1440;
        if(minsToTerm<180){
          warnings.push('태어나신 시각이 다음 절기까지 ' + Math.round(minsToTerm) +
            '분 남은 자리입니다. 월주가 다음 달로 바뀔 가능성이 있습니다.');
        }
      }
    }
    if(hourKnown){
      var intoHour=((trueMin+60)%1440)%120;
      if(intoHour<10 || intoHour>110){
        warnings.push('진태양시가 시주 경계에 붙어 있습니다. 태어난 시각이 10분만 달라도 시주가 바뀝니다.');
      }
    }
    if(dstMin>0){

    '게자리':'첫인상이 조심스럽고 다정합니다','사자자리':'첫인상이 크고 환합니다','처녀자리':'첫인상이 단정하고 깐깐합니다',
    '천칭자리':'첫인상이 부드럽고 예의 바릅니다','전갈자리':'첫인상이 조용하고 속을 알기 어렵습니다','사수자리':'첫인상이 활달하고 솔직합니다',
    '염소자리':'첫인상이 어른스럽고 무겁습니다','물병자리':'첫인상이 독특하고 거리감이 있습니다','물고기자리':'첫인상이 흐릿하고 부드럽습니다'
  };
  var MC={
    '양자리':'앞장서는 자리','황소자리':'값을 만드는 자리','쌍둥이자리':'전하고 잇는 자리',
    '게자리':'돌보는 자리','사자자리':'보이는 자리','처녀자리':'고치고 다듬는 자리',
    '천칭자리':'중재하는 자리','전갈자리':'파헤치는 자리','사수자리':'넓히는 자리',
    '염소자리':'책임지는 자리','물병자리':'바꾸는 자리','물고기자리':'품는 자리'
  };

  /* ── 다섯 축 ───────────────────────────────────────────
     질문의 답과 사주를 맞대보기 위한 저울입니다.
     각 축은 십성 묶음으로만 계산합니다. */
  var AXES={
    risk:  { A:'안정', B:'변화',
             a:['정관','정재','정인'], b:['상관','편재','편관','겁재'],
             sayA:'정해진 틀 안에서 안전하게 가는 구조',
             sayB:'판을 흔들며 나아가는 구조' },
    make:  { A:'정답', B:'창조',
             a:['정관','정인','편인'], b:['식신','상관'],
             sayA:'있는 답을 정확히 지키는 구조',
             sayB:'없던 답을 만들어내는 구조' },
    solo:  { A:'혼자', B:'함께',
             a:['정인','편인','식신'], b:['비견','겁재','정재','편재'],
             sayA:'혼자 파고들 때 힘이 나는 구조',
             sayB:'사람 사이에서 굴러갈 때 힘이 나는 구조' },
    form:  { A:'실물', B:'무형',
             a:['정재','편재','식신'], b:['정인','편인','상관'],
             sayA:'손에 잡히는 것을 다룰 때 맞는 구조',
             sayB:'보이지 않는 것을 다룰 때 맞는 구조' },
    many:  { A:'하나', B:'여럿',
             a:['정관','정재','정인','식신','비견'], b:['편관','편재','편인','상관','겁재'],
             sayA:'하나를 깊게 파는 구조',
             sayB:'여러 개를 동시에 굴리는 구조' }
  };

  /* ── 본체 ─────────────────────────────────────────────── */
  function interpret(chart){
    var p=chart.pillars;
    var dayHan=p.day.han.charAt(0);
    var dayEl=chart.dayMaster.element;
    var dayYin=chart.dayMaster.yin ? 1 : 0;

    /* 일간을 뺀 일곱 글자의 십성 */
    var slots=[
      {k:'연간', el:GAN_EL[p.year.gan],  yin:GAN_YIN[p.year.gan],  han:p.year.han.charAt(0)},
      {k:'연지', el:JI_EL[p.year.ji],    yin:JI_YIN[p.year.ji],    han:p.year.han.charAt(1)},
      {k:'월간', el:GAN_EL[p.month.gan], yin:GAN_YIN[p.month.gan], han:p.month.han.charAt(0)},
      {k:'월지', el:JI_EL[p.month.ji],   yin:JI_YIN[p.month.ji],   han:p.month.han.charAt(1)},
      {k:'일지', el:JI_EL[p.day.ji],     yin:JI_YIN[p.day.ji],     han:p.day.han.charAt(1)}
    ];
    if(p.hour){
      slots.push({k:'시간', el:GAN_EL[p.hour.gan], yin:GAN_YIN[p.hour.gan], han:p.hour.han.charAt(0)});
      slots.push({k:'시지', el:JI_EL[p.hour.ji],   yin:JI_YIN[p.hour.ji],   han:p.hour.han.charAt(1)});
    }
    slots.forEach(function(s){ s.sip=sipsung(dayEl, dayYin, s.el, s.yin); });

    var count={}, gcount={};
    slots.forEach(function(s){
      count[s.sip]=(count[s.sip]||0)+1;
      var g=GROUP[s.sip];
      gcount[g]=(gcount[g]||0)+1;
    });

    /* 가장 두꺼운 십성 두 개 */
    var ranked=Object.keys(count).map(function(k){ return {sip:k, n:count[k]}; })
      .sort(function(a,b){ return b.n-a.n; });

    /* 축 계산 */
    var axis={};
    Object.keys(AXES).forEach(function(key){
      var A=AXES[key], sa=0, sb=0;
      A.a.forEach(function(s){ sa+=(count[s]||0); });
      A.b.forEach(function(s){ sb+=(count[s]||0); });
      var lean='';
      if(sa>sb) lean='A';
      if(sb>sa) lean='B';
      axis[key]={ a:sa, b:sb, lean:lean,
                  say: lean==='A' ? A.sayA : (lean==='B' ? A.sayB : '어느 쪽으로도 크게 기울지 않은 구조'),
                  name: lean==='A' ? A.A : (lean==='B' ? A.B : '가운데') };
    });

    var most=chart.five.slice().sort(function(a,b){ return b.count-a.count; })[0];
    var empty=chart.five.filter(function(f){ return f.count===0; });

    return {
      day: DAY[dayHan] || DAY['甲'],
      dayHan: dayHan,
      slots: slots,
      count: count,
      groups: gcount,
      top: ranked.slice(0,2),
      sipText: SIP,
      axis: axis,
      mostEl: most,
      mostElText: EL_MUCH[most.element],
      emptyEls: empty.map(function(e){ return e.element; }),
      emptyElText: empty.map(function(e){ return EL_NONE[e.element]; }),
      sun: SUN[chart.stars.sun.name] || '',
      asc: ASC[chart.stars.ascendant.name] || '',
      mc:  MC[chart.stars.midheaven.name] || ''
    };
  }

  root.StellaRead={ interpret:interpret, SIP:SIP, DAY:DAY, AXES:AXES,
                    josa:josa, joinWa:joinWa, hasBatchim:hasBatchim };
})(typeof window!=='undefined' ? window : globalThis);
</script>

<script>
/* ═══ 인물 데이터 · 글쓰기 ═══ */
(function(){
  var root=document.getElementById('ssc'); if(!root) return;
  var $=function(id){ return document.getElementById(id); };
  var S=window.StellaSaju, R=window.StellaRead;

  /* ── 인물 ────────────────────────────────────────────────
     birth 가 null 이면 출생정보가 아직 확인되지 않은 사람입니다.
     그 경우 사주를 세우지 않고 "확인 중"으로만 둡니다. 추정하지 않습니다.
       birth  '1990-05-14' (양력, 공개적으로 확인된 것만)
       hour   태어난 시각을 아는 경우에만. 모르면 null — 여섯 글자로 봅니다.
       status pending 검토 대기 · approved 공개 · rejected 비공개 */
  var PEOPLE=[
    { name:'김혜수', role:'배우',   birth:null, hour:null, status:'pending', source:'' },
    { name:'박보검', role:'배우',   birth:null, hour:null, status:'pending', source:'' },
    { name:'박서준', role:'배우',   birth:null, hour:null, status:'pending', source:'' },
    { name:'손예진', role:'배우',   birth:null, hour:null, status:'pending', source:'' },
    { name:'송강호', role:'배우',   birth:null, hour:null, status:'pending', source:'' },
    { name:'아이유', role:'가수',   birth:null, hour:null, status:'pending', source:'' },
    { name:'유재석', role:'방송인', birth:null, hour:null, status:'pending', source:'' },
    { name:'이병헌', role:'배우',   birth:null, hour:null, status:'pending', source:'' },
    { name:'이영애', role:'배우',   birth:null, hour:null, status:'pending', source:'' },
    { name:'전지현', role:'배우',   birth:null, hour:null, status:'pending', source:'' },
    { name:'차은우', role:'배우',   birth:null, hour:null, status:'pending', source:'' },
    { name:'황정민', role:'배우',   birth:null, hour:null, status:'pending', source:'' }
  ];

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function two(x){ return (x<10?'0':'')+x; }

  /* ── 목록 ── */
  function drawRoster(){
    var open=PEOPLE.filter(function(p){ return p.status==='approved'; });
    var box=$('cRoster');
    var head='<h2>지금까지 올라온 인물</h2>';
    if(!open.length){
      box.innerHTML=head+'<p class="sub">아직 공개된 인물이 없습니다. '
        + '출생정보가 확인되고 검토를 마친 사람부터 이 자리에 올라갑니다.</p>';
      return;
    }
    var sorted=open.slice().sort(function(a,b){ return a.name.localeCompare(b.name,'ko'); });
    box.innerHTML=head+'<p class="sub">가나다순 · '+sorted.length+'명</p><div class="names">'
      + sorted.map(function(p){
          return '<button type="button" class="nm" data-n="'+esc(p.name)+'">'
               + '<b>'+esc(p.name)+'</b><span>'+esc(p.role)+'</span></button>';
        }).join('')
      + '</div>';
    [].slice.call(box.querySelectorAll('.nm')).forEach(function(b){
      b.addEventListener('click', function(){ show(b.getAttribute('data-n')); });
    });
  }

  function findPerson(q){
    var s=String(q||'').replace(/\s+/g,'');
    if(!s){ return null; }
    for(var i=0;i<PEOPLE.length;i++){
      if(PEOPLE[i].name.replace(/\s+/g,'')===s){ return PEOPLE[i]; }
    }
    return null;
  }

  /* ── 없는 사람 · 확인 중인 사람 ── */
  function waitBox(title, body){
    return '<div class="wait-box"><div class="t">'+title+'</div><p>'+body+'</p></div>';
  }

  /* ── 글 ── */
  function show(name){
    var art=$('cArt');
    var p=findPerson(name);
    art.classList.add('on');

    if(!p){
      art.innerHTML=waitBox('아직 다루지 않은 인물입니다',
        esc(name)+' 님은 아직 목록에 없습니다. 공개적으로 확인 가능한 생년월일이 있는 분부터 '
        + '차례로 올리고 있습니다. 요청해 주시면 확인 후 검토 목록에 넣겠습니다.');
      art.scrollIntoView({behavior:'smooth', block:'start'});
      return;
    }
    if(p.status==='rejected'){
      art.innerHTML=waitBox('지금은 볼 수 없습니다',
        '검토 결과 공개하지 않기로 한 인물입니다.');
      art.scrollIntoView({behavior:'smooth', block:'start'});
      return;
    }
    if(!p.birth){
      art.innerHTML='<h2>'+esc(p.name)+'</h2><div class="who">'+esc(p.role)+' · 출생정보 확인 중</div>'
        + waitBox('출생정보를 확인하고 있습니다',
            '공개적으로 확인 가능한 생년월일이 아직 정리되지 않았습니다. '
          + '사주는 하루만 어긋나도 여덟 글자가 전부 달라지기 때문에, '
          + '확인되지 않은 날짜를 짐작해서 세우지 않습니다. 확인되는 대로 이 자리에 올라갑니다.');
      art.scrollIntoView({behavior:'smooth', block:'start'});
      return;
    }

    var m=String(p.birth).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(!m){
      art.innerHTML=waitBox('출생정보 형식을 확인해 주세요', 'birth 는 1990-05-14 형태여야 합니다.');
      return;
    }
    var y=parseInt(m[1],10), mo=parseInt(m[2],10), d=parseInt(m[3],10);
    var knowsHour=(typeof p.hour==='number');

    /* 태어난 곳이 알려지지 않은 경우가 대부분이라 서울을 기준으로 세웁니다.
       그 사실을 글 안에 그대로 적어둡니다. */
    var loc=S.locate('서울','대한민국');
    var chart=S.compute({ year:y, month:mo, day:d,
      hour: knowsHour ? p.hour : null, minute:0, sex:'F',
      lon:loc.lon, lat:loc.lat, tz:loc.tz });
    var it=R.interpret(chart);
    art.innerHTML=article(p, chart, it, knowsHour);
    art.scrollIntoView({behavior:'smooth', block:'start'});
  }

  /* ── 아홉 자리로 나눠 씁니다 ── */
  function article(p, chart, it, knowsHour){
    var P=chart.pillars;
    var g=it.groups;
    function G(k){ return g[k] || 0; }
    var out='';

    out+='<h2>'+esc(p.name)+' 사주로 살펴보는 성향과 기운의 흐름</h2>';
    out+='<div class="who">'+esc(p.role)+(p.status==='pending' ? ' · 검토 대기' : '')+'</div>';

    /* ① 공개 출생정보 */
    out+='<section><div class="no">01</div><h3>공개 출생정보</h3>'
      + '<dl class="facts">'
      + '<dt>출생일</dt><dd>'+p.birth.split('-')[0]+'년 '+parseInt(p.birth.split('-')[1],10)+'월 '
        + parseInt(p.birth.split('-')[2],10)+'일 (양력)</dd>'
      + '<dt>출생시간</dt><dd>'+(knowsHour ? two(p.hour)+'시' : '알려지지 않음')+'</dd>'
      + '<dt>출생지</dt><dd>알려지지 않음 · 서울 기준으로 세웠습니다</dd>'
      + (p.source ? '<dt>확인한 곳</dt><dd>'+esc(p.source)+'</dd>' : '')
      + '</dl>'
      + '<p>공개적으로 알려진 날짜만 씁니다. '
      + (knowsHour
          ? '태어난 시각이 알려져 있어 여덟 글자를 모두 세울 수 있습니다.'
          : '태어난 시각은 알려져 있지 않아 <em>시주를 뺀 여섯 글자</em>로만 봅니다. '
            + '시각을 짐작해서 채우지 않습니다.')
      + '</p></section>';

    /* ② 사주 구성 */
    var heads=['연주','월주','일주','시주'];
    var cols=[P.year,P.month,P.day,P.hour];
    out+='<section><div class="no">02</div><h3>사주 구성</h3>'
      + '<div class="chart">'
      + heads.map(function(h){ return '<div class="h">'+h+'</div>'; }).join('')
      + cols.map(function(c){
          if(!c){ return '<div><div class="han" style="opacity:.25">—</div><div class="kor">시간 모름</div></div>'; }
          return '<div><div class="han">'+c.han+'</div><div class="kor">'+c.kor+'</div></div>';
        }).join('')
      + '</div>'
      + '<p>일간은 <em>'+it.dayHan+'</em>입니다. 명리학에서는 이 한 글자를 그 사람 자신으로 두고, '
      + '나머지 글자들을 이 글자와의 관계로 읽습니다. '
      + '전통적인 해석에서는 '+it.dayHan+'을 <em>'+it.day.image+'</em>에 빗대어 설명합니다.</p></section>';

    /* ③ 오행 분석 */
    out+='<section><div class="no">03</div><h3>오행 분석</h3>'
      + '<div class="scale">'
      + chart.five.map(function(f){
          return '<div class="el'+(f.count===0?' zero':'')+'">'
            + '<div class="el-n">'+f.element+'</div>'
            + '<div class="el-b"><span style="width:'+f.percent+'%"></span></div>'
            + '<div class="el-v">'+f.percent+'%</div></div>';
        }).join('')
      + '</div>'
      + '<p>명리학적으로는 <em>'+it.mostEl.element+'</em>의 기운이 가장 두텁게 나타나는 구성으로 볼 수 있습니다. '
      + (it.emptyEls.length
          ? '반대로 <em>'+it.emptyEls.join(' · ')+'</em>은 여덟 글자 안에 드러나지 않습니다. '
            + '전통적인 해석에서는 비어 있는 기운을 약점이 아니라 평생에 걸쳐 채우려 하게 되는 자리로 봅니다.'
          : '다섯 기운이 고르게 들어 있는 편으로 해석할 수 있습니다.')
      + '</p></section>';

    /* ④ 성향 */
    out+='<section><div class="no">04</div><h3>성향</h3>'
      + '<p>'+it.day.what+'</p>'
      + '<p>이는 일간 '+it.dayHan+'을 전통적으로 어떻게 풀이해 왔는지에 대한 설명이며, '
      + '실제 성격이나 행동을 의미하는 것은 아닙니다.</p></section>';

    /* ⑤ 재능 · 활동 */
    out+='<section><div class="no">05</div><h3>재능과 활동의 결</h3>'
      + '<p>'+it.day.good+'</p>'
      + '<p>십성으로 나눠 세어보면 '
      + '식상 '+G('식상')+'자 · 관성 '+G('관성')+'자 · 인성 '+G('인성')+'자로 나타납니다. '
      + (G('식상')>=2
          ? '명리학적으로는 <em>만들어 내놓는 쪽</em>의 기운이 두드러지는 구성으로 해석할 수 있습니다.'
          : (G('관성')>=2
              ? '명리학적으로는 <em>맡고 책임지는 쪽</em>의 기운이 뚜렷한 구성으로 해석할 수 있습니다.'
              : '어느 한쪽으로 크게 몰리지 않은 구성으로 볼 수 있습니다.'))
      + '</p></section>';

    /* ⑥ 재물 흐름 */
    out+='<section><div class="no">06</div><h3>재물의 흐름</h3>'
      + '<p>재성은 '+G('재성')+'자입니다. 명리학에서 재성은 손에 쥐는 것과 그것을 다루는 방식을 가리키는 자리로 봅니다. '
      + (G('재성')>=2
          ? '재물과 관련된 움직임이 비교적 뚜렷하게 드러나는 구성으로 해석할 수 있습니다.'
          : (G('재성')===0
              ? '여덟 글자 안에 재성이 드러나지 않는 구성입니다. 전통적인 해석에서는 이런 경우 '
                + '재물을 쫓기보다 다른 것을 먼저 세우는 흐름으로 보기도 합니다.'
              : '재물과 관련된 기운이 은근하게 흐르는 구성으로 볼 수 있습니다.'))
      + '</p>'
      + '<p>이는 사주 구조에 대한 명리학적 해석이며, 실제 수입이나 자산을 뜻하지 않습니다. '
      + '투자 판단의 근거로 삼을 수 있는 내용이 아닙니다.</p></section>';

    /* ⑦ 대인관계 */
    out+='<section><div class="no">07</div><h3>대인관계에서 나타나는 결</h3>'
      + '<p>비겁은 '+G('비겁')+'자, 인성은 '+G('인성')+'자입니다. '
      + (G('비겁')>=2
          ? '명리학적으로는 <em>대등하게 서려는 힘</em>이 강한 구성으로 해석할 수 있습니다. '
            + '기대기보다 나란히 서는 자리를 편하게 여기는 결로 봅니다.'
          : (G('인성')>=2
              ? '명리학적으로는 <em>받아들이고 배우는 힘</em>이 두터운 구성으로 해석할 수 있습니다. '
                + '주변에서 도움이 들어오는 자리로 보기도 합니다.'
              : '어느 한쪽으로 크게 기울지 않은 구성으로 볼 수 있습니다.'))
      + '</p>'
      + '<p>여기서 말하는 것은 사주 구조 자체의 특징입니다. '
      + '실제 인간관계나 특정 인물과의 관계를 뜻하지 않습니다.</p></section>';

    /* ⑧ 시기별 흐름 */
    var lk=chart.luck;
    var age=2026-parseInt(p.birth.slice(0,4),10)+1;
    var nowIdx=-1;
    lk.list.forEach(function(l,i){ if(age>=l.from){ if(age<l.to){ nowIdx=i; } } });
    out+='<section><div class="no">08</div><h3>시기별 흐름</h3>'
      + '<div class="tw"><table><thead><tr><th>나이</th><th>간지</th><th>해</th></tr></thead><tbody>'
      + lk.list.slice(0,8).map(function(l,i){
          return '<tr'+(i===nowIdx?' class="now"':'')+'><td class="k">'+l.from+'~'+l.to+'</td>'
            + '<td>'+l.han+'</td><td>'+l.fromYear+'~'+l.toYear+'</td></tr>';
        }).join('')
      + '</tbody></table></div>'
      + '<p>대운은 십 년 단위로 바뀌는 큰 흐름을 나타내는 표입니다. '
      + '명리학에서는 좋고 나쁨의 표가 아니라 <em>판이 바뀌는 시점</em>의 표로 봅니다. '
      + (nowIdx>=0
          ? '지금은 '+lk.list[nowIdx].han+' 대운에 해당하는 구간으로, '
            + '이 시기에 변화가 두드러질 가능성을 살펴볼 수 있습니다.'
          : '표에 실린 구간 밖의 나이입니다.')
      + '</p>'
      + '<p>특정한 사건이 일어난다는 뜻이 아닙니다. 어느 시기에 기운의 결이 바뀌는지를 '
      + '명리학의 방식으로 표시한 것입니다.</p></section>';

    /* ⑨ 면책 */
    out+='<section><div class="no">09</div><h3>읽으실 때</h3>'
      + '<p>여기 적은 것은 공개된 생년월일 하나에서 계산으로 나온 구조와, '
      + '그 구조를 전통 명리학에서 어떻게 풀이해 왔는지에 대한 설명입니다. '
      + '실제 성격, 행동, 사생활, 앞으로 일어날 일을 사실로 단정하지 않습니다. '
      + '사주 해석은 여러 관점 가운데 하나입니다.</p></section>';

    return out;
  }

  /* ── 찾기 ── */
  function go(){
    var q=$('cQ').value.trim();
    if(!q){ return; }
    show(q);
  }
  $('cGo').addEventListener('click', go);
  $('cQ').addEventListener('keydown', function(e){ if(e.key==='Enter'){ go(); } });

  drawRoster();

  /* 주소에 ?name=유재석 이 붙어 있으면 바로 펼칩니다 */
  (function(){
    var s=String(location.search||'');
    var i=s.indexOf('name=');
    if(i<0){ return; }
    var v=s.slice(i+5);
    var amp=v.indexOf('&');
    if(amp>=0){ v=v.slice(0,amp); }
    try{ v=decodeURIComponent(v); }catch(e){ return; }
    if(!v){ return; }
    $('cQ').value=v;
    show(v);
  })();
})();
</script>
