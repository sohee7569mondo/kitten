<!--
  STELLA SAJU — 이번주 별자리 운세 (페이지 ID 82)   BUILD: Z4

  달라진 점
    · 고정 문구 세 줄 → 그 주의 기운으로 계산해서 매주 바뀝니다.
    · 자리마다 흐름 세 문단 + 잘 맞는 자리 + 조심할 자리 + 행운의 색·숫자·물건.
    · 생년월일을 넣어두셨으면 내 자리를 찾아 맨 위로 올려 표시합니다.

  계산 방식 — 왜 별자리에 오행을 섞는가
    이 사이트는 사주를 바탕에 둡니다. 그래서 '이번주가 어떤 주인가'는
    그 주 월요일의 일주(日柱)에서 가져옵니다. 띠별운세와 같은 값이라,
    두 페이지가 서로 다른 주를 이야기하지 않습니다.

    별자리의 네 원소는 아래처럼 오행에 맞춰 읽습니다.
      불(양·사자·사수)   → 화(火)
      흙(황소·처녀·염소) → 토(土)
      공기(쌍둥이·천칭·물병) → 목(木)
      물(게·전갈·물고기) → 수(水)
    금(金)에 해당하는 원소는 없습니다. 그래서 금의 주에는 열두 자리 모두가
    '다듬고 덜어내는 주'가 됩니다 — 이건 빠진 게 아니라 그렇게 설계한 것입니다.

    내 원소와 이번주 오행의 관계로 흐름을 고릅니다.
      같음 / 나를 살려줌 / 내가 내어줌 / 나를 누름 / 내가 누름
-->
<style>
#ssp{
  --void:#0D0A1A; --void-deep:#070512;
  --nebula:#1C1533; --nebula-soft:#251C42;
  --purple-glow:rgba(140,101,214,.35);
  --gold:#D4AF6A; --gold-soft:#C9A66B; --gold-lite:#E8CD96;
  --star:#F2ECE0; --ink-soft:rgba(242,236,224,.72); --ink-dim:rgba(242,236,224,.46);
  --line:rgba(212,175,106,.18);

  max-width:none !important; width:auto !important;
  margin-left:calc(50% - 50vw) !important; margin-right:calc(50% - 50vw) !important;
  padding:0 !important;
  position:relative; z-index:0; overflow-x:clip;
  color:var(--star); text-align:center;
  font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-weight:300; line-height:1.75; font-size:16px;
  word-break:keep-all; overflow-wrap:break-word;
}
#ssp *{margin:0; padding:0; box-sizing:border-box;}
#ssp h1,#ssp h2,#ssp h3{font-family:'Noto Serif KR',serif; color:var(--star); font-weight:700; letter-spacing:normal;}
#ssp a{color:inherit; text-decoration:none;}
#ssp button{font:inherit;}

#ssp .ssp-stars{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,.9), transparent),
    radial-gradient(1px 1px at 82% 12%, rgba(255,255,255,.7), transparent),
    radial-gradient(1.5px 1.5px at 62% 62%, rgba(255,255,255,.8), transparent),
    radial-gradient(1px 1px at 28% 78%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.5px 1.5px at 90% 52%, rgba(255,255,255,.7), transparent),
    radial-gradient(1px 1px at 45% 32%, rgba(255,255,255,.5), transparent),
    var(--void);
}
#ssp .ssp-inner{position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:76px 24px 110px;}
@media(max-width:700px){ #ssp .ssp-inner{padding:48px 18px 80px;} }

#ssp .ssp-kicker{font-family:'IBM Plex Mono',monospace; font-size:.7rem; letter-spacing:.22em;
  text-transform:uppercase; color:var(--gold); margin-bottom:16px;}
#ssp h1{font-size:clamp(1.8rem,4.6vw,2.8rem); line-height:1.35;}
#ssp .ssp-lead{margin:18px auto 0; color:var(--ink-soft); font-size:1rem; max-width:600px;}

/* 이번주 머리판 */
#ssp .weekbox{margin:34px auto 0; max-width:620px; padding:22px 24px; border-radius:12px;
  background:linear-gradient(160deg, var(--nebula-soft), var(--nebula)); border:1px solid var(--gold);}
#ssp .weekbox .wk{font-family:'IBM Plex Mono',monospace; font-size:.7rem; letter-spacing:.16em; color:var(--gold);}
#ssp .weekbox .gz{margin-top:10px; font-family:'Noto Serif KR',serif; font-size:1.7rem; color:var(--star); line-height:1.3;}
#ssp .weekbox .say{margin-top:14px; padding-top:14px; border-top:1px dashed rgba(212,175,106,.2);
  font-size:.92rem; color:var(--ink-soft); line-height:1.9;}

/* 내 자리 찾기 */
#ssp .finder{margin:22px auto 0; max-width:620px; display:flex !important; flex-wrap:wrap;
  gap:9px; justify-content:center; align-items:center;}
#ssp .finder label{font-size:.9rem; color:var(--ink-soft);}
#ssp .finder input{width:82px; padding:12px 14px; border-radius:6px; text-align:center;
  background:var(--void-deep); border:1px solid var(--line); color:var(--star);
  font-family:'IBM Plex Mono',monospace; font-size:17px;}
#ssp .finder button{padding:12px 20px; border-radius:6px; border:0; cursor:pointer; font-weight:700;
  background:linear-gradient(135deg, var(--gold), #B98A47); color:var(--void-deep);}
#ssp .finder .hint{flex:1 0 100%; font-size:.8rem; color:var(--ink-dim); line-height:1.75;}

#ssp .zgrid{display:grid !important; grid-template-columns:repeat(3,1fr); gap:15px; margin-top:44px; text-align:left;}
@media(max-width:900px){ #ssp .zgrid{grid-template-columns:repeat(2,1fr);} }
@media(max-width:600px){ #ssp .zgrid{grid-template-columns:1fr;} }
#ssp .zcard{background:var(--nebula); border:1px solid var(--line); border-radius:12px; padding:24px 22px;
  transition:border-color .25s ease, transform .25s ease, box-shadow .25s ease;}
#ssp .zcard:hover{border-color:var(--gold-soft); transform:translateY(-3px);}
#ssp .zcard.mine{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold), 0 26px 50px -22px var(--purple-glow);}
#ssp .zhead{display:flex !important; align-items:center; gap:12px;}
#ssp .zsym{width:52px; height:52px; flex:0 0 52px; border-radius:50%; display:flex !important;
  align-items:center; justify-content:center; font-size:1.5rem; color:var(--zc);
  background:var(--void-deep); border:1px solid var(--zc);}
#ssp .zname{font-family:'Noto Serif KR',serif; font-weight:700; font-size:1.08rem;}
#ssp .zdate{margin-top:3px; font-family:'IBM Plex Mono',monospace; font-size:.68rem; color:var(--ink-dim);}
#ssp .zrel{margin-top:14px; display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:.64rem;
  letter-spacing:.1em; padding:4px 10px; border-radius:20px;
  color:var(--void-deep); background:var(--gold-soft);}
#ssp .zrel.warn{background:#E0907F;}
#ssp .zrel.calm{background:#B9C2CC;}
#ssp .ztext{margin-top:12px; font-size:.9rem; color:var(--ink-soft); line-height:1.95;}
#ssp .ztext + .ztext{margin-top:9px;}
#ssp .zmine{margin-top:12px; font-size:.86rem; color:var(--gold-lite); line-height:1.9;}

#ssp .zrows{margin-top:16px; padding-top:14px; border-top:1px dashed rgba(212,175,106,.16);}
#ssp .zrow{display:flex !important; gap:12px; padding:7px 0; font-size:.84rem; align-items:flex-start;}
#ssp .zrow dt{flex:0 0 84px; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace; font-size:.7rem; padding-top:3px;}
#ssp .zrow dd{flex:1; color:var(--star);}
#ssp .zdot{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:6px;
  vertical-align:-1px; border:1px solid rgba(242,236,224,.25);}

#ssp .upsell{margin:52px auto 0; max-width:560px; padding:28px 24px;
  border:1px solid var(--line); border-radius:10px;}
#ssp .upsell p{font-size:.92rem; color:var(--ink-soft);}
#ssp .upsell a{display:inline-block; margin-top:14px; font-family:'IBM Plex Mono',monospace;
  font-size:.82rem; color:var(--gold); border-bottom:1px solid var(--gold-soft); padding-bottom:3px;}
#ssp .upsell a:hover{color:var(--gold-lite);}
#ssp .fine{margin:26px auto 0; max-width:620px; font-size:.78rem; color:var(--ink-dim); line-height:1.9;}
@media(prefers-reduced-motion:reduce){
  #ssp *,#ssp *::before,#ssp *::after{animation:none !important; transition:none !important;}
}
</style>

<div id="ssp">
  <div class="ssp-stars" aria-hidden="true"></div>
  <div class="ssp-inner">

    <div class="ssp-kicker">Free &middot; 이번주</div>
    <h1>이번주 별자리 운세</h1>
    <p class="ssp-lead">이번주의 기운을 세우고, 열두 자리가 그 기운과 어떻게 만나는지 하나씩 짚었습니다.</p>

    <div class="weekbox">
      <div class="wk" id="zWeek">THIS WEEK</div>
      <div class="gz" id="zGz">&mdash;</div>
      <p class="say" id="zSay"></p>
    </div>

    <div class="finder">
      <label for="zMon">생일</label>
      <input id="zMon" type="number" inputmode="numeric" placeholder="월" min="1" max="12">
      <input id="zDay" type="number" inputmode="numeric" placeholder="일" min="1" max="31">
      <button type="button" id="zFind">내 자리 찾기</button>
      <div class="hint">별자리는 태어난 달과 날로만 정해집니다. 해는 없어도 돼요.
        가입할 때 생일을 넣어두셨다면 자동으로 찾아드립니다.</div>
    </div>

    <div class="zgrid" id="zGrid"></div>

    <div class="upsell">
      <p>별자리는 태양 하나의 자리예요. 태어난 시각까지 넣으면 달과 상승궁도 볼 수 있습니다.</p>
      <a href="/door-astro/">성좌의 신에게 물어보기 &rarr;</a>
    </div>

    <p class="fine">이 콘텐츠는 서양 점성술의 원소 궁합과 동양 오행의 상생상극을 엮어 만든 재미용 참고 자료입니다.
      실제 일의 결과를 보장하지 않습니다.</p>

  </div>
</div>

<script>
(function(){
  var root=document.getElementById('ssp'); if(!root) return;

  /* ── 열두 자리 ─────────────────────────────────────────────
     el 은 그 자리의 원소를 오행으로 옮긴 것입니다.
     from/to 는 시작하는 달·일입니다 (그 날부터 다음 자리 전날까지). */
  var SIGNS=[
    {n:'양자리',    sym:'♈', el:'화', hex:'#E85D5D', from:[3,21],  to:[4,19],
     own:'먼저 뛰어드는 자리입니다. 재는 사이에 이미 시작해 있습니다. 대신 끝을 맺는 데는 힘이 부칩니다.'},
    {n:'황소자리',  sym:'♉', el:'토', hex:'#7CB579', from:[4,20],  to:[5,20],
     own:'한번 쥐면 놓지 않는 자리입니다. 느린 대신 끝까지 갑니다. 대신 방향을 바꾸는 데 시간이 걸립니다.'},
    {n:'쌍둥이자리',sym:'♊', el:'목', hex:'#E8C85D', from:[5,21],  to:[6,21],
     own:'말과 정보로 사는 자리입니다. 배움이 빠릅니다. 대신 한 가지에 오래 머물기를 답답해합니다.'},
    {n:'게자리',    sym:'♋', el:'수', hex:'#B0C4E8', from:[6,22],  to:[7,22],
     own:'품는 자리입니다. 내 사람이라고 정하면 끝까지 갑니다. 대신 상처를 오래 안고 갑니다.'},
    {n:'사자자리',  sym:'♌', el:'화', hex:'#E8A33D', from:[7,23],  to:[8,22],
     own:'드러나는 자리입니다. 앞에 서면 힘이 납니다. 대신 알아주지 않으면 빨리 식습니다.'},

    {n:'천칭자리',  sym:'♎', el:'목', hex:'#D9A5C4', from:[9,23],  to:[10,22],

    {n:'전갈자리',  sym:'♏', el:'수', hex:'#A05C7B', from:[10,23], to:[11,21],
     own:'깊이 들어가는 자리입니다. 한번 마음을 두면 바닥까지 갑니다. 대신 쉽게 열지 않습니다.'},
    {n:'사수자리',  sym:'♐', el:'화', hex:'#C77B4A', from:[11,22], to:[12,21],
     own:'멀리 보는 자리입니다. 답답한 자리를 못 견딥니다. 대신 발밑을 자주 놓칩니다.'},
    {n:'염소자리',  sym:'♑', el:'토', hex:'#8D8D7A', from:[12,22], to:[1,19],
     own:'쌓아 올리는 자리입니다. 오늘 손해라도 십 년을 봅니다. 대신 쉬는 법을 잘 모릅니다.'},
    {n:'물병자리',  sym:'♒', el:'목', hex:'#7FBFC7', from:[1,20],  to:[2,18],
     own:'남들과 다른 길을 보는 자리입니다. 틀을 답답해합니다. 대신 가까운 사람에게 서늘해 보입니다.'},
    {n:'물고기자리',sym:'♓', el:'수', hex:'#9B8FD4', from:[2,19],  to:[3,20],

  /* 오행 상생: 수→목→화→토→금→수 */
  var GEN={'수':'목','목':'화','화':'토','토':'금','금':'수'};
  /* 오행 상극: 목극토, 토극수, 수극화, 화극금, 금극목 */
  var OVR={'목':'토','토':'수','수':'화','화':'금','금':'목'};
  var EL_H={'목':'木','화':'火','토':'土','금':'金','수':'水'};
  var EL_COLOR={'목':['초록 · 연두','#8FBF8F'],'화':['빨강 · 주황','#E0907F'],
                '토':['노랑 · 황토','#D6B570'],'금':['흰색 · 은색','#B9C2CC'],
                '수':['검정 · 남색','#8AA8D8']};
  var EL_THING={
    '목':['작은 화분','나무 손잡이 펜','초록빛 노트'],
    '화':['향초','붉은 실 팔찌','따뜻한 색 조명'],
    '토':['도자기 컵','흙빛 스카프','작은 돌 오브제'],
    '금':['금속 열쇠고리','은반지','흰 손수건'],
    '수':['유리병','파란 우산','물을 담은 텀블러']
  };

  function motherOf(el){ for(var k in GEN){ if(GEN[k]===el){ return k; } } return el; }

  /* 이번주 기운과 내 원소의 관계 */
  function relOf(mine, week){
    if(mine===week){ return 'same'; }
    if(GEN[week]===mine){ return 'fed'; }    /* 이번주가 나를 살려줌 */
    if(GEN[mine]===week){ return 'give'; }   /* 내가 이번주에 내어줌 */
    if(OVR[week]===mine){ return 'press'; }  /* 이번주가 나를 누름 */
    return 'push';                            /* 내가 이번주를 누름 */
  }

  var REL={
    same:{ tag:'같은 결 · 힘이 실리는 주', cls:'',
      t1:'이번주 기운이 이 자리와 같은 결로 들어옵니다. 평소 하던 방식이 그대로 통하는 주라, 애쓰지 않아도 일이 손에 붙습니다.',
      t2:'하고 싶던 것을 꺼내기 좋습니다. 다만 같은 성질이 겹치면 단점도 같이 커집니다. 평소 듣던 지적이 이번주에 한 번 더 나온다면, 그건 우연이 아니에요.',
      t3:'사람을 만날 때는 나와 다른 결을 가진 쪽이 도움이 됩니다. 비슷한 사람끼리만 모이면 이번주는 확인만 하다 끝납니다.' },
    fed:{ tag:'살려주는 주 · 등을 밀어줌', cls:'',
      t1:'이번주 기운이 이 자리를 살려주는 쪽으로 흐릅니다. 내가 세게 나가지 않아도 주변이 먼저 도와주는 주예요.',
      t2:'부탁·요청·지원을 꺼내기에 일 년 중 손꼽히는 자리입니다. 거절당할 확률이 낮고, 도와주는 사람이 생색을 안 냅니다. 미뤄둔 연락이 있다면 이번주에 하세요.',
      t3:'다만 받는 것에 익숙해지면 다음 주가 허전합니다. 받은 만큼 어디에 쓸지 이번주 안에 정해두면 흐름이 이어집니다.' },
    give:{ tag:'내어주는 주 · 쓰이는 만큼 빠짐', cls:'calm',
      t1:'이번주 기운이 이 자리에서 힘을 가져가는 쪽입니다. 내가 무언가를 만들어 내보내는 주라, 결과는 남는데 몸은 축납니다.',
      t2:'창작·발표·정리처럼 안에 있던 것을 밖으로 꺼내는 일에 좋습니다. 반대로 새로 벌이거나 큰 결정을 내리기에는 힘이 모자랍니다.',
      t3:'끝나고 나서 반드시 비워두는 시간을 넣으세요. 이런 주에 쉬지 않으면 다음 주가 통째로 무너집니다.' },
    press:{ tag:'누르는 주 · 버티는 자리', cls:'warn',
      t1:'이번주 기운이 이 자리를 눌러옵니다. 하는 일마다 한 박자씩 걸리고, 평소 같으면 넘어갈 말에 마음이 상합니다.',
      t2:'큰돈이 오가는 결정과 감정이 실린 대화는 다음 주로 미루세요. 지금 내리는 판단은 평소보다 좁습니다. 대신 참고 버티는 일에는 오히려 힘이 붙습니다.',
      t3:'눌리는 주는 나쁜 주가 아니라 다듬어지는 주입니다. 이번주에 못 넘긴 일이 있다면 그건 아직 때가 아니라는 뜻이에요.' },
    push:{ tag:'밀어내는 주 · 정리에 좋음', cls:'',
      t1:'이번주 기운을 이 자리가 밀어내는 쪽입니다. 내 뜻대로 판을 움직일 수 있는 주라, 오래 끌던 것에 결론이 납니다.',
      t2:'정리·해지·이별·반품처럼 끊어내는 일에 힘이 실립니다. 미뤄온 것을 이번주에 끝내면 뒤끝이 남지 않습니다.',
      t3:'다만 밀어붙이는 힘이 사람에게 향하면 크게 다칩니다. 끊는 것은 일에 쓰고, 사람에게는 한 박자 늦추세요.' }
  };

  /* ── 이번주 간지 — 띠별운세와 같은 값을 씁니다 ── */
  var JI_H=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  var GAN_H=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
  var JI_EL=['수','토','목','목','토','화','화','토','금','금','토','수'];
  function jdn(y,m,d){
    if(m<=2){ y-=1; m+=12; }
    var A=Math.floor(y/100), B=2-A+Math.floor(A/4);
    return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524;
  }
  var now=new Date();
  var dow=now.getDay();
  var back=(dow===0)?6:(dow-1);
  var mon=new Date(now.getFullYear(), now.getMonth(), now.getDate()-back);
  var sun=new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()+6);
  var dayNo=jdn(mon.getFullYear(), mon.getMonth()+1, mon.getDate()) - jdn(1900,1,1);
  var wg=((dayNo)%10+10)%10;
  var wz=((dayNo+10)%12+12)%12;
  var wEl=JI_EL[wz];

  var WEEK_SAY={
    '목':'자라려는 기운입니다. 새로 벌인 일에 힘이 붙고, 배우는 것이 잘 들어옵니다.',
    '화':'드러내는 기운입니다. 말과 표정이 평소보다 멀리 가고, 사람이 모입니다.',
    '토':'품는 기운입니다. 벌여둔 것을 자리에 앉히기 좋고, 서두르면 도리어 늦습니다.',
    '금':'덜어내는 기운입니다. 매듭짓고 정리하는 일이 잘 되고, 군더더기가 눈에 띕니다.',
    '수':'스며드는 기운입니다. 생각이 깊어지고 사람을 잘 읽게 되지만, 시작은 늦습니다.'
  };

  document.getElementById('zWeek').textContent =
    (mon.getMonth()+1)+'월 '+mon.getDate()+'일 ~ '+(sun.getMonth()+1)+'월 '+sun.getDate()+'일';
  document.getElementById('zGz').textContent =
    GAN_H[wg]+JI_H[wz]+' · '+wEl+'('+EL_H[wEl]+')의 주';
  document.getElementById('zSay').textContent =
    '이번주는 '+wEl+'('+EL_H[wEl]+')의 기운이 판을 잡습니다. '+WEEK_SAY[wEl]+
    ' 아래에서 내 자리가 이 기운과 어떻게 만나는지 보세요.';

  /* ── 열두 장 그리기 ── */
  function two(n){ return (n<10?'0':'')+n; }
  function dateLabel(s){
    return s.from[0]+'.'+two(s.from[1])+' ~ '+s.to[0]+'.'+two(s.to[1]);
  }

  var grid=document.getElementById('zGrid');
  var html='';
  for(var i=0;i<SIGNS.length;i++){
    var s=SIGNS[i];
    var rel=relOf(s.el, wEl);
    var R=REL[rel];
    /* 행운의 색은 나를 살려주는 오행에서 가져옵니다 */
    var luck=motherOf(s.el);
    var col=EL_COLOR[luck];
    var things=EL_THING[luck];
    var thing=things[(dayNo+i)%things.length];
    /* 잘 맞는 자리 — 같은 원소 두 자리 가운데 이번주 몫으로 하나 */
    var mates=[];
    for(var k=0;k<SIGNS.length;k++){
      if(k===i){ continue; }
      if(SIGNS[k].el===s.el){ mates.push(SIGNS[k].n); }
    }
    var mate=mates[(dayNo+i)%mates.length];
    /* 조심할 자리 — 나를 누르는 오행을 가진 자리 하나 */
    var foes=[];
    for(var j=0;j<SIGNS.length;j++){
      if(OVR[SIGNS[j].el]===s.el){ foes.push(SIGNS[j].n); }
    }
    var foe=foes.length ? foes[(dayNo+i)%foes.length] : '없음';
    var num=((dayNo+i*7)%45)+1;

    html += '<div class="zcard" id="zs'+i+'" style="--zc:'+s.hex+'">'
      + '<div class="zhead"><div class="zsym">'+s.sym+'</div>'
      + '<div><div class="zname">'+s.n+'</div>'
      + '<div class="zdate">'+dateLabel(s)+' · '+s.el+'('+EL_H[s.el]+')</div></div></div>'
      + '<div class="zrel '+R.cls+'">'+R.tag+'</div>'
      + '<p class="ztext">'+R.t1+'</p>'
      + '<p class="ztext">'+R.t2+'</p>'
      + '<p class="ztext">'+R.t3+'</p>'
      + '<p class="ztext">'+s.n+'는 본래 '+s.own+'</p>'
      + '<dl class="zrows">'
      + '<div class="zrow"><dt>잘 맞는 자리</dt><dd>'+mate+'</dd></div>'
      + '<div class="zrow"><dt>조심할 자리</dt><dd>'+foe+' <span style="color:rgba(242,236,224,.46)">· 이번주엔 부딪히기 쉬워요</span></dd></div>'
      + '<div class="zrow"><dt>행운의 색</dt><dd><span class="zdot" style="background:'+col[1]+'"></span>'+col[0]+'</dd></div>'
      + '<div class="zrow"><dt>행운의 숫자</dt><dd>'+num+'</dd></div>'
      + '<div class="zrow"><dt>행운의 물건</dt><dd>'+thing+'</dd></div>'
      + '</dl>'
      + '<p class="zmine" style="display:none"></p>'
      + '</div>';
  }
  grid.innerHTML=html;

  /* ── 내 자리 찾기 ── */
  function signOf(m,d){
    for(var i=0;i<SIGNS.length;i++){
      var s=SIGNS[i];
      var f=s.from, t=s.to;
      if(f[0]===m){ if(d>=f[1]){ return i; } }
      if(t[0]===m){ if(d<=t[1]){ return i; } }
    }
    return -1;
  }

  var monIn=document.getElementById('zMon');
  var dayIn=document.getElementById('zDay');
  var btn=document.getElementById('zFind');

  function findMine(){
    var m=parseInt(monIn.value,10);
    var d=parseInt(dayIn.value,10);
    if(isNaN(m)){ return; }
    if(isNaN(d)){ return; }
    var i=signOf(m,d);
    if(i<0){ return; }

    var cards=grid.querySelectorAll('.zcard');
    for(var k=0;k<cards.length;k++){
      cards[k].classList.remove('mine');
      var tag=cards[k].querySelector('.zmine');
      if(tag){ tag.style.display='none'; }
    }
    var card=document.getElementById('zs'+i);
    if(!card){ return; }
    card.classList.add('mine');
    var mine=card.querySelector('.zmine');
    if(mine){
      mine.textContent = m+'월 '+d+'일생 · '+SIGNS[i].n+'. 지금 보고 계신 자리예요.';
      mine.style.display='block';
    }
    grid.insertBefore(card, grid.firstChild);
    card.scrollIntoView({behavior:'smooth', block:'center'});
    try{ localStorage.setItem('stella_star_md', m+'-'+d); }catch(e){}
  }
  btn.addEventListener('click', findMine);
  dayIn.addEventListener('keydown', function(e){ if(e.key==='Enter'){ findMine(); } });

  /* 넣어두신 생일이 있으면 바로 찾아둡니다 */
  try{
    var saved=localStorage.getItem('stella_star_md');
    if(saved){
      var bits=saved.split('-');
      monIn.value=bits[0]; dayIn.value=bits[1];
      findMine();
    } else {
      var demo=localStorage.getItem('stella_demo');
      if(demo){
        var o=JSON.parse(demo);
        if(o){ if(o.profile){ if(o.profile.month){ if(o.profile.day){
          /* 별자리는 태양의 자리라 양력 생일로만 정해집니다.
             음력으로 넣으신 분은 자동으로 잡지 않습니다. */
          if(o.profile.calendar!=='lunar'){
            monIn.value=o.profile.month;
            dayIn.value=o.profile.day;
            findMine();
          }
        } } } }
      }
    }
  }catch(e){}
})();
</script>
