             이번주 사주 총평으로 연결되는 안내문
  LP/LN 은 음력 변환표입니다. 손대지 마세요.

<style>
#ssp{
  --void:#0D0A1A; --void-deep:#070512;
  --nebula:#1C1533; --nebula-soft:#251C42;
  --purple-glow:rgba(140,101,214,.35);
  --gold:#D4AF6A; --gold-soft:#C9A66B; --gold-lite:#E8CD96;
  --star:#F2ECE0; --ink-soft:rgba(242,236,224,.72); --ink-dim:rgba(242,236,224,.46);
  --line:rgba(212,175,106,.18);

  max-width:none !important; width:auto !important;
  margin-left:calc(50% - 50vw) !important; margin-right:calc(50% - 50vw) !important;
  padding:0 !important;
  position:relative; z-index:0; overflow-x:clip;
  color:var(--star); text-align:center;
  font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-weight:300; line-height:1.75; font-size:16px;
  word-break:keep-all; overflow-wrap:break-word;
}
#ssp *{margin:0; padding:0; box-sizing:border-box;}
#ssp h1,#ssp h2{font-family:'Noto Serif KR',serif; color:var(--star); font-weight:700; letter-spacing:normal;}
#ssp a{color:inherit; text-decoration:none;}
#ssp button{font:inherit;}

#ssp .ssp-stars{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,.9), transparent),
    radial-gradient(1px 1px at 82% 12%, rgba(255,255,255,.7), transparent),
    radial-gradient(1.5px 1.5px at 62% 62%, rgba(255,255,255,.8), transparent),
    radial-gradient(1px 1px at 28% 78%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.5px 1.5px at 90% 52%, rgba(255,255,255,.7), transparent),
    radial-gradient(1px 1px at 45% 32%, rgba(255,255,255,.5), transparent),
    var(--void);
}
#ssp .ssp-inner{position:relative; z-index:1; max-width:940px; margin:0 auto; padding:76px 24px 110px;}
@media(max-width:700px){ #ssp .ssp-inner{padding:48px 18px 80px;} }

#ssp .ssp-kicker{font-family:'IBM Plex Mono',monospace; font-size:.7rem; letter-spacing:.22em;
  text-transform:uppercase; color:var(--gold); margin-bottom:16px;}
#ssp h1{font-size:clamp(1.8rem,4.6vw,2.8rem); line-height:1.35;}
#ssp .ssp-lead{margin:18px auto 0; color:var(--ink-soft); font-size:1rem; max-width:560px;}


/* ── 입력 카드 ─────────────────────────────────────────── */
#ssp .stage{
  margin:52px auto 0; max-width:700px; padding:44px 40px 40px; border-radius:14px; text-align:left;
  background:radial-gradient(ellipse at 50% 0%, rgba(140,101,214,.14), transparent 62%), var(--nebula);
  border:1px solid var(--line); box-shadow:0 40px 90px -50px rgba(0,0,0,.9);
}
@media(max-width:700px){ #ssp .stage{padding:30px 20px 30px; margin-top:36px; border-radius:12px;} }

/* 양력 / 음력 고르기 */
#ssp .cal-switch{display:flex !important; gap:0; margin-bottom:22px;
  border:1px solid var(--line); border-radius:6px; overflow:hidden;}
#ssp .cal-switch button{flex:1; padding:13px 10px; background:transparent; border:0; cursor:pointer;
  color:var(--ink-soft); font-size:.92rem; transition:background .2s ease, color .2s ease;}
#ssp .cal-switch button.on{background:linear-gradient(135deg, var(--gold), #B98A47); color:var(--void-deep); font-weight:700;}
#ssp .cal-note{margin:-12px 0 20px; font-size:.76rem; color:var(--ink-dim); line-height:1.7;}

#ssp .field-row{display:grid !important; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px;}
@media(max-width:520px){ #ssp .field-row{grid-template-columns:1fr;} }
#ssp .field{display:flex; flex-direction:column; gap:7px;}
#ssp .field label{font-family:'IBM Plex Mono',monospace; font-size:.68rem; color:var(--ink-dim); letter-spacing:.04em;}
#ssp .field input,#ssp .field select{
  background:var(--void-deep); border:1px solid var(--line); color:var(--star);
  padding:14px 15px; border-radius:5px; font-family:inherit; font-size:.95rem; width:100%;
  transition:border-color .2s ease;}
#ssp .field input:focus,#ssp .field select:focus{outline:none; border-color:var(--gold-soft);}
#ssp .field select:disabled{opacity:.4;}
/* 윈도우 크롬은 select 배경만 따르고 글자색은 안 따라옵니다.
   그래서 까만 바탕에 까만 글자가 되어 목록이 빈 칸처럼 보였습니다.
   option 에 색을 직접 적어줘야 합니다. */
#ssp .field select option{background:#1C1533; color:#F2ECE0;}
#ssp .chk{display:flex !important; align-items:center; gap:9px; margin-top:8px;
  font-size:.85rem; color:var(--ink-soft); cursor:pointer;}
#ssp .chk input{accent-color:var(--gold); width:16px; height:16px; flex:0 0 auto;}
#ssp .chk.hide{display:none !important;}

#ssp .btn{width:100%; margin-top:26px; padding:17px 30px; border-radius:3px; border:none; cursor:pointer;
  font-size:.98rem; font-weight:700; color:var(--void-deep);
  background:linear-gradient(135deg, var(--gold), #B98A47);
  box-shadow:0 16px 34px -14px rgba(212,175,106,.55); transition:transform .2s ease;}
#ssp .btn:hover{transform:translateY(-2px);}
#ssp .err{margin-top:14px; font-size:.85rem; color:#E5A0A0; text-align:center; display:none;}
#ssp .err.show{display:block;}

/* ── 결과 ───────────────────────────────────────────────── */
#ssp .result{margin-top:40px; display:none; text-align:center;}
#ssp .result.show{display:block; animation:ssp-rise .55s ease backwards;}
@keyframes ssp-rise{ from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:none;} }
#ssp .solar-echo{font-family:'IBM Plex Mono',monospace; font-size:.74rem; color:var(--ink-dim); margin-bottom:18px;}
#ssp .pillars{display:grid !important; grid-template-columns:repeat(4,1fr); gap:14px;}
@media(max-width:560px){ #ssp .pillars{grid-template-columns:repeat(2,1fr);} }
#ssp .pillar{background:var(--void-deep); border:1px solid var(--line); border-radius:9px;
  padding:24px 10px; animation:ssp-rise .5s ease backwards;}
#ssp .pillar .p-label{font-family:'IBM Plex Mono',monospace; font-size:.6rem; color:var(--ink-dim); letter-spacing:.1em;}
#ssp .pillar .p-hanja{margin-top:12px; font-family:'Noto Serif KR',serif; font-size:2rem; color:var(--gold); line-height:1.2;}
#ssp .pillar .p-kr{margin-top:6px; font-size:.8rem; color:var(--ink-soft);}
#ssp .pillar.unknown-p .p-hanja{color:var(--ink-dim); font-size:1.1rem;}

/* 오행 비율 */
#ssp .elems{margin-top:30px; padding:26px 24px; border-radius:11px;
  background:var(--void-deep); border:1px solid var(--line); text-align:left;}
#ssp .elems-title{font-family:'IBM Plex Mono',monospace; font-size:.64rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--gold); margin-bottom:18px; text-align:center;}
#ssp .erow{display:flex !important; align-items:center; gap:12px; margin-top:11px;}
#ssp .ename{flex:0 0 74px; font-family:'Noto Serif KR',serif; font-size:.9rem; color:var(--star);}
#ssp .ename em{font-style:normal; color:var(--ec);}
#ssp .ebar{flex:1; height:9px; border-radius:20px; background:rgba(255,255,255,.06); overflow:hidden;}
#ssp .efill{height:100%; border-radius:20px; background:var(--ec);
  width:0; transition:width .9s cubic-bezier(.2,.9,.3,1);}
#ssp .epct{flex:0 0 52px; text-align:right; font-family:'IBM Plex Mono',monospace;
  font-size:.8rem; color:var(--ink-soft);}
#ssp .erow.top .epct{color:var(--ec); font-weight:700;}
#ssp .erow.zero .ename,#ssp .erow.zero .epct{opacity:.4;}

#ssp .element-line{margin-top:24px; padding:22px 20px; border-radius:9px;
  background:rgba(212,175,106,.07); border:1px solid var(--line);
  font-family:'Noto Serif KR',serif; font-size:1.05rem;}
#ssp .element-line span{color:var(--gold);}
#ssp .weeklink{margin-top:18px; font-size:.88rem; color:var(--ink-soft);}
#ssp .weeklink a{color:var(--gold); border-bottom:1px solid var(--gold-soft); padding-bottom:2px;}
#ssp .disclaimer{margin-top:20px; font-size:.74rem; color:var(--ink-dim); line-height:1.7;}

#ssp .upsell{margin:46px auto 0; max-width:560px; padding:28px 24px;
  border:1px solid var(--line); border-radius:10px;}
#ssp .upsell p{font-size:.92rem; color:var(--ink-soft);}
#ssp .upsell a{display:inline-block; margin-top:14px; font-family:'IBM Plex Mono',monospace;
  font-size:.82rem; color:var(--gold); border-bottom:1px solid var(--gold-soft); padding-bottom:3px;}
@media(prefers-reduced-motion:reduce){
  #ssp *,#ssp *::before,#ssp *::after{animation:none !important; transition:none !important;}
}
</style>

<div id="ssp">
  <div class="ssp-stars" aria-hidden="true"></div>
  <div class="ssp-inner">

    <div class="ssp-kicker">Free &middot; 심심풀이</div>

          시주는 한국에서 태어나신 것으로 보고 계산해요. 해외에서 태어나셨다면
          <a href="/door-career/" style="color:#D4AF6A">여섯 개의 문</a>에서 나라와 도시를 넣고 보세요.</div>
      </div>
    </div>

    <div class="upsell">
      <p>이 글자들이 무슨 뜻인지, 성격·직업·연애까지 궁금하다면?</p>
      <a href="/#doors">여섯 개의 문 열어보기 &rarr;</a>
    </div>

  </div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var monthSel=$('sMonth'), daySel=$('sDay'), hourSel=$('sHour');
  var unknown=$('sHourUnknown'), leapBox=$('sLeap'), leapWrap=$('leapWrap');
  if(!monthSel) return;

  /* 음력 → 양력 변환표 (1900~2049).
     각 해: bits0~12 = 달 길이(1이면 30일, 순서대로), bits13~16 = 윤달 번호(0이면 없음)
     LN = 그 해 음력 정월 초하루의 1900-01-31 기준 경과일 */
  var LP=[71378,1874,3749,46666,1611,2715,38230,1386,2905,22354,1874,56101,2853,2635,45723,2733,1386,19305,2985,64338,3474,3365,47693,2390,693,38317,1748,3497,23954,3730,52518,1319,2647,45750,2778,1748,28329,1865,63123,2707,1323,51803,2413,2922,39764,2980,2889,23187,2709,62763,1325,2733,46442,3506,3492,32073,3402,72341,2710,1366,51893,2773,1746,36517,3749,3658,27798,2715,62806,1386,2905,46930,1874,1829,38475,2635,70315,685,1387,52073,3497,3474,39717,3365,88653,2646,694,54701,1748,3497,48530,3730,3366,27222,2647,70326,2906,1748,44745,1865,1683,38183,1323,2651,21850,874,64341,2980,2889,47763,2709,1325,27229,2733,79274,1490,3493,48458,3402,2709,38189,1366,2741,21930,1746,52901,3749,3658,44182,3227,1370,27349,2921,96082,1874,2853,54859,2635,1195,42331,1389,2921,23378,3474,64805,3365,2637,46253,694,1461];
  var LN=[0,384,738,1093,1476,1830,2185,2569,2923,3278,3662,4016,4400,4754,5108,5492,5847,6201,6585,6940,7324,7678,8032,8416,8770,9124,9509,9863,10218,10602,10956,11339,11693,12048,12432,12787,13141,13525,13879,14263,14617,14971,15355,15710,16065,16449,16803,17157,17541,17895,18279,18633,18988,19372,19727,20081,20465,20819,21203,21557,21911,22295,22650,23004,23388,23743,24097,24480,24835,25219,25573,25928,26312,26666,27020,27404,27758,28142,28496,28851,29235,29590,29944,30328,30682,31066,31420,31774,32159,32513,32868,33252,33606,33960,34343,34698,35082,35437,35791,36175,36529,36883,37267,37621,37976,38360,38714,39099,39453,39807,40191,40545,40899,41283,41638,42022,42376,42731,43115,43469,43823,44207,44561,44916,45300,45654,46038,46393,46747,47130,47485,47839,48223,48578,48962,49316,49670,50054,50408,50762,51146,51501,51856,52240,52594,52978,53332,53686,54070,54424];
  var LBASE=Date.UTC(1900,0,31);

  function leapMonthOf(y){ var i=y-1900; return (i<0||i>=LP.length)?0:((LP[i]>>13)&15); }
  function lunarToSolar(y,m,d,isLeap){
    var i=y-1900; if(i<0||i>=LN.length) return null;
    var pk=LP[i], leap=(pk>>13)&15, off=LN[i], idx;
    if(isLeap && m!==leap) return null;
    if(!leap || m<leap) idx=m-1;
    else if(m===leap) idx = isLeap ? leap : m-1;
    else idx=m;
    for(var k=0;k<idx;k++) off += ((pk>>k)&1)?30:29;
    if(d<1 || d>(((pk>>idx)&1)?30:29)) return null;
    var t=new Date(LBASE+(off+d-1)*86400000);
    return {y:t.getUTCFullYear(), m:t.getUTCMonth()+1, d:t.getUTCDate()};
  }

  for(var m=1;m<=12;m++) monthSel.add(new Option(m+'월', m));
  for(var d=1;d<=30;d++) daySel.add(new Option(d+'일', d));
  daySel.add(new Option('31일', 31));
  var hourLabels=['23~01시 (자시)','01~03시 (축시)','03~05시 (인시)','05~07시 (묘시)',
                  '07~09시 (진시)','09~11시 (사시)','11~13시 (오시)','13~15시 (미시)',
                  '15~17시 (신시)','17~19시 (유시)','19~21시 (술시)','21~23시 (해시)'];
  hourLabels.forEach(function(l,i){ hourSel.add(new Option(l,i)); });

  unknown.addEventListener('change', function(e){
    hourSel.disabled=e.target.checked; if(e.target.checked) hourSel.value='';
  });

  /* 양력 / 음력 전환 */
  var isLunar=false;
  function setCal(lunar){
    isLunar=lunar;
    $('calSolar').classList.toggle('on', !lunar);
    $('calLunar').classList.toggle('on', lunar);
    $('calNote').textContent = lunar
      ? '음력 생일을 넣으면 양력으로 바꿔서 계산해요. (1900~2049년)'
      : '주민등록상 생일은 대개 양력이에요.';
    refreshLeap();
  }
  $('calSolar').addEventListener('click', function(){ setCal(false); });
  $('calLunar').addEventListener('click', function(){ setCal(true); });

  function refreshLeap(){
    var y=parseInt($('sYear').value,10), m=parseInt(monthSel.value,10);
    var show = isLunar && y && m && leapMonthOf(y)===m;
    leapWrap.classList.toggle('hide', !show);
    if(!show) leapBox.checked=false;
  }
  $('sYear').addEventListener('input', refreshLeap);
  monthSel.addEventListener('change', refreshLeap);

  /* 사주 계산 */
  var stemsKr=['갑','을','병','정','무','기','경','신','임','계'];
  var stemsHan=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
  var branchesKr=['자','축','인','묘','진','사','오','미','신','유','술','해'];
  var branchesHan=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  var stemEl  =['목','목','화','화','토','토','금','금','수','수'];
  var branchEl=['수','토','목','목','토','화','화','토','금','금','토','수'];
  var EL=[['목','木','#7FB77E'],['화','火','#E08A6A'],['토','土','#D4AF6A'],
          ['금','金','#C9CFD8'],['수','水','#7EA6D8']];

  /* ── 절기 ────────────────────────────────────────────────
     사주에서 한 해는 1월 1일이 아니라 입춘에 바뀌고,
     한 달은 1일이 아니라 절기에 바뀝니다.
     전에는 달력 그대로 셌더니, 1월생의 연주가 통째로 한 해 밀렸습니다.
     아래 계산은 전자책이 쓰는 것과 똑같습니다. */
  var TERMS=[
    {deg:285, ji:1,  mon:1},  {deg:315, ji:2,  mon:2},
    {deg:345, ji:3,  mon:3},  {deg:15,  ji:4,  mon:4},
    {deg:45,  ji:5,  mon:5},  {deg:75,  ji:6,  mon:6},
    {deg:105, ji:7,  mon:7},  {deg:135, ji:8,  mon:8},
    {deg:165, ji:9,  mon:9},  {deg:195, ji:10, mon:10},
    {deg:225, ji:11, mon:11}, {deg:255, ji:0,  mon:12}
  ];
  function jdOf(y,m,d,h,mi){
    h=h||0; mi=mi||0;
    if(m<=2){ y-=1; m+=12; }
    var A=Math.floor(y/100), B=2-A+Math.floor(A/4);
    return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))
           +d+B-1524.5+(h+mi/60)/24;
  }
  function sunLon(j){
    var T=(j-2451545.0)/36525.0;
    var L0=(280.46646+36000.76983*T+0.0003032*T*T)%360;
    var M =(357.52911+35999.05029*T-0.0001537*T*T)%360;
    var Mr=M*Math.PI/180;
    var C =(1.914602-0.004817*T-0.000014*T*T)*Math.sin(Mr)
          +(0.019993-0.000101*T)*Math.sin(2*Mr)+0.000289*Math.sin(3*Mr);
    var om=125.04-1934.136*T;
    return (L0+C-0.00569-0.00478*Math.sin(om*Math.PI/180)+720)%360;
  }
  function findTerm(deg, year, mon){
    var lo=jdOf(year,mon,1)-5, hi=jdOf(year,mon,1)+15;
    function f(t){ var v=(sunLon(t)-deg+360)%360; return v>180 ? v-360 : v; }
    for(var i=0;i<60;i++){
      var mid=(lo+hi)/2;
      if(f(lo)*f(mid)<=0){ hi=mid; } else { lo=mid; }
    }
    return (lo+hi)/2;
  }
  var termCache={};
  function termsOfYear(y){
    if(termCache[y]){ return termCache[y]; }
    var list=TERMS.map(function(t){
      return { jd:findTerm(t.deg, y, t.mon), ji:t.ji };
    }).sort(function(a,b){ return a.jd-b.jd; });
    termCache[y]=list;
    return list;
  }

  /* 태어난 순간(한국 시각)을 세계시 율리우스일로 */
  function bornJd(y,m,d,h){
    var hh = (h===null) ? 12 : (h*2+1)%24;   /* 시를 모르면 한낮으로 둡니다 */
    return jdOf(y,m,d,hh,0) - 9/24;
  }

  /* 연주 — 입춘을 새해로 */
  function sajuYearOf(y,m,d,h){
    return (bornJd(y,m,d,h) < findTerm(315,y,2)) ? y-1 : y;
  }
  /* 월지 — 태어난 순간이 어느 절 안에 있는지 */
  function monthJiOf(y,m,d,h){
    var t=bornJd(y,m,d,h);
    var all=termsOfYear(y-1).concat(termsOfYear(y));
    var ji=2;
    for(var i=0;i<all.length;i++){
      if(all[i].jd<=t){ ji=all[i].ji; } else { break; }
    }
    return ji;
  }

  function yearPillar(y){ return {s:((y-4)%10+10)%10, b:((y-4)%12+12)%12}; }
  function dayPillar(y,m,d){
    var diff=Math.round((Date.UTC(y,m-1,d)-Date.UTC(1900,0,31))/86400000);
    return {s:((diff%10)+10)%10, b:((diff+4)%12+12)%12};
  }
  /* 오호둔(五虎遁) — 연간에 따라 인월(寅)의 천간이 정해집니다 */
  function monthPillar(monthJi, ys){
    var startGan=[2,4,6,8,0][ys%5];
    var fromTiger=((monthJi-2)%12+12)%12;
    return { s:((startGan+fromTiger)%10+10)%10, b:monthJi };
  }
  function hourPillar(h, ds){ return (h===null||isNaN(h))?null:{s:(((ds%5)*2)%10+h)%10, b:h}; }

  function card(label,p,i){
    var dl=' style="animation-delay:'+(i*90)+'ms"';
    if(!p) return '<div class="pillar unknown-p"'+dl+'><div class="p-label">'+label+'</div>'
                 +'<div class="p-hanja">모름</div><div class="p-kr">시간 미입력</div></div>';
    return '<div class="pillar"'+dl+'><div class="p-label">'+label+'</div>'
         +'<div class="p-hanja">'+stemsHan[p.s]+branchesHan[p.b]+'</div>'
         +'<div class="p-kr">'+stemsKr[p.s]+branchesKr[p.b]+'</div></div>';
  }

  $('sajuBtn').addEventListener('click', function(){
    var y=parseInt($('sYear').value,10), m=parseInt(monthSel.value,10), d=parseInt(daySel.value,10);
    var h=(unknown.checked||hourSel.value==='')?null:parseInt(hourSel.value,10);
    var err=$('sajuErr');

    if(!y||!m||!d){ err.textContent='년 · 월 · 일을 모두 골라주세요.'; err.classList.add('show'); return; }

    var sy=y, sm=m, sd=d, echo='';
    if(isLunar){
      var conv=lunarToSolar(y,m,d,leapBox.checked);
      if(!conv){
        err.textContent='그 날짜는 음력에 없어요. 날짜를 다시 확인해주세요.';
        err.classList.add('show'); return;
      }
      sy=conv.y; sm=conv.m; sd=conv.d;
      echo='음력 '+y+'.'+m+'.'+d+(leapBox.checked?' (윤달)':'')+'  →  양력 '+sy+'.'+sm+'.'+sd;
    } else {
      var chk=new Date(sy,sm-1,sd);
      if(chk.getMonth()!==sm-1){ err.textContent='그 날짜는 달력에 없어요.'; err.classList.add('show'); return; }
      echo='양력 '+sy+'.'+sm+'.'+sd;
    }
    err.classList.remove('show');
    $('solarEcho').textContent=echo;

    var sajuY = sajuYearOf(sy,sm,sd,h);
    var mJi   = monthJiOf(sy,sm,sd,h);
    var yp=yearPillar(sajuY), dp=dayPillar(sy,sm,sd);
    var mp=monthPillar(mJi, yp.s), hp=hourPillar(h,dp.s);
    if(sajuY!==sy){
      echo += '   (사주로는 '+sajuY+'년 — 입춘 전에 태어나셨어요)';
      $('solarEcho').textContent=echo;
    }
    $('pillars').innerHTML = card('시주 HOUR',hp,0)+card('일주 DAY',dp,1)
                           + card('월주 MONTH',mp,2)+card('년주 YEAR',yp,3);

    /* 오행 세기 — 천간·지지 글자마다 하나씩 */
    var cnt={'목':0,'화':0,'토':0,'금':0,'수':0}, total=0;
    [hp,dp,mp,yp].forEach(function(p){
      if(!p) return;
      cnt[stemEl[p.s]]++; cnt[branchEl[p.b]]++; total+=2;
    });
    var maxV=0; EL.forEach(function(e){ if(cnt[e[0]]>maxV) maxV=cnt[e[0]]; });

    /* 합이 100%가 되도록 최대잔여법으로 반올림 */
    var pcts={}, floors=0, rema=[];
    EL.forEach(function(e){
      var raw=total?cnt[e[0]]/total*100:0, f=Math.floor(raw);
      pcts[e[0]]=f; floors+=f; rema.push([e[0], raw-f]);
    });
    rema.sort(function(a,b){ return b[1]-a[1]; });
    for(var r=0; r<100-floors; r++) pcts[rema[r % rema.length][0]]++;

    var rows='';
    EL.forEach(function(e){
      var v=cnt[e[0]], pct=pcts[e[0]];
      rows += '<div class="erow'+(v===maxV&&v>0?' top':'')+(v===0?' zero':'')+'" style="--ec:'+e[2]+'">'
            + '<div class="ename">'+e[0]+'(<em>'+e[1]+'</em>)</div>'
            + '<div class="ebar"><div class="efill" data-w="'+pct+'"></div></div>'
            + '<div class="epct">'+pct+'%</div></div>';
    });
    $('elemRows').innerHTML=rows;

    var el=stemEl[dp.s], elh=EL.filter(function(e){return e[0]===el;})[0][1];
    $('elementLine').innerHTML='나를 나타내는 글자는 일주의 위 글자, <span>'+stemsKr[dp.s]+'('+stemsHan[dp.s]+')</span>'
      +' 입니다.<br>사장님은 <span>'+el+'('+elh+')</span>의 사람이에요.';

    /* 어느 항목을 봐야 하는지 —
       '나'는 일간(日干)입니다. 오행이 많다고 그 오행의 사주가 아닙니다.
       토가 넷이어도 일간이 갑목이면 그 사람은 목(木)입니다.
       많은 오행은 '나를 둘러싼 기운'이지 '나'가 아니에요.
       전에는 많은 오행을 보라고 했더니 이걸 헷갈리게 만들었습니다. */
    var mineEl=stemEl[dp.s];
    var strong=EL.filter(function(e){return cnt[e[0]]===maxV;}).map(function(e){return e[0];});
    var weak=EL.filter(function(e){return cnt[e[0]]===0;}).map(function(e){return e[0];});

    var msg='이번주 총평에서는 <b style="color:#D4AF6A;font-weight:700">'
          + mineEl + '(' + elh + ')의 기운</b> 항목을 보세요. 그게 사장님 자신입니다.';

    var extra='';
    if(strong.length===1){
      if(strong[0]!==mineEl){
        extra = '사주에 ' + strong[0] + '이(가) 가장 많지만, 그건 <b>나를 둘러싼 기운</b>이지 내가 아니에요. '
              + '나를 나타내는 것은 언제나 일간 하나입니다.';
      } else {
        extra = '마침 ' + mineEl + '의 기운도 가장 많네요. 그만큼 색이 뚜렷한 사주예요.';
      }
    } else {
      extra = '두드러진 기운은 ' + strong.join('·') + '이에요. 다만 그건 나를 둘러싼 기운이지 내가 아닙니다.';
    }
    if(weak.length){
      extra += '<br>' + weak.join('·') + '의 기운은 사주에 없어요. 그 항목은 참고만 하셔도 됩니다.';
    }

    $('weekLink').innerHTML = msg
      + '<br><span style="font-size:.86rem;color:rgba(242,236,224,.6)">' + extra + '</span>'
      + '<br><a href="/weekly-summary/">이번주 사주 총평 보러가기 &rarr;</a>';

    var r=$('sajuResult');
    r.classList.add('show');
    setTimeout(function(){
      r.querySelectorAll('.efill').forEach(function(f){ f.style.width=f.getAttribute('data-w')+'%'; });
    }, 80);
    r.scrollIntoView({behavior:'smooth', block:'nearest'});
  });
})();
</script>
