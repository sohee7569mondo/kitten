<style>
@import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

.stq{
  --cream:#FBF3EA; --cream-deep:#F3E6D6; --paper:#FFFDF9;
  --ink:#4A4038; --ink-soft:#8A7F72;
  --rose:#D9808A; --rose-deep:#C15F6C;
  --sky:#7FA6C4; --sky-deep:#5C86A6;
  --line:#E7D9C7;
  max-width:460px; margin:0 auto; padding:4px 0 8px;
  font-family:'Noto Sans KR', sans-serif; color:var(--ink);
}
.stq *, .stq *:before, .stq *:after{ box-sizing:border-box; }

.stq .brand{ text-align:center; margin-bottom:18px; }
.stq .brand .plane{ font-size:22px; display:inline-block; transform:rotate(45deg); }
.stq .brand .bt{
  font-family:'Gaegu', sans-serif; font-size:15px; color:var(--ink-soft);
  margin:6px 0 0; font-weight:700;
}

.stq .route{ position:relative; height:34px; margin:6px 0 22px; }
.stq .route-line{
  position:absolute; top:16px; left:6px; right:6px; height:2px;
  background-image:linear-gradient(to right, var(--line) 60%, rgba(0,0,0,0) 0%);
  background-size:10px 2px; background-repeat:repeat-x;
}
.stq .route-fill{ position:absolute; top:16px; left:6px; height:2px; background:var(--rose); transition:width .5s ease; }
.stq .route-plane{ position:absolute; top:4px; transform:translateX(-50%) rotate(90deg); font-size:18px; transition:left .5s ease; }
.stq .route-dots{ position:absolute; top:12px; left:6px; right:6px; display:flex; justify-content:space-between; }
.stq .route-dots span{
  width:8px;height:8px;border-radius:50%; background:var(--paper);
  border:2px solid var(--line); transition:all .3s ease;
}
.stq .route-dots span.done{ background:var(--rose); border-color:var(--rose); }
.stq .route-dots span.now{ border-color:var(--rose); transform:scale(1.3); }

.stq .card{
  background:var(--paper); border-radius:22px; padding:22px 20px 26px;
  box-shadow:0 10px 30px rgba(120,90,70,0.10); position:relative; overflow:hidden;
}
.stq .stamp{
  display:inline-flex; align-items:baseline; gap:8px; background:var(--cream-deep);
  border:1.5px dashed var(--rose); border-radius:100px; padding:5px 14px;
}
.stq .stamp .day{ font-family:'Gaegu', sans-serif; font-weight:700; font-size:15px; color:var(--rose-deep); }
.stq .stamp .phase{ font-size:12px; color:var(--ink-soft); }
.stq .qtext{ font-size:18px; line-height:1.5; font-weight:700; margin:2px 4px 18px; }
.stq .qhead{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
.stq .backbtn{
  background:none; border:none; color:var(--ink-soft); font-family:'Noto Sans KR', sans-serif;
  font-size:13px; cursor:pointer; padding:5px 8px 5px 0; display:flex; align-items:center; gap:4px;
  transition:color .15s ease; flex-shrink:0;
}
.stq .backbtn:hover{ color:var(--rose-deep); }

.stq .options{ display:flex; flex-direction:column; gap:14px; }
.stq .opt{
  text-align:left; background:var(--cream); border:2px solid transparent; border-radius:16px;
  padding:10px; cursor:pointer; display:flex; flex-direction:column; gap:10px;
  transition:transform .15s ease, border-color .15s ease, background .15s ease; font-family:inherit; width:100%;
}
.stq .opt:hover{ border-color:var(--sky); transform:translateY(-2px); }
.stq .opt.picked{ border-color:var(--rose); background:#FBEAEA; }
.stq .opt img{
  width:100%; display:block; border-radius:12px; aspect-ratio:16/10;
  object-fit:cover; background:var(--line); margin:0;
}
.stq .opt p{ margin:0 4px 6px; font-size:14px; line-height:1.55; color:var(--ink); }

.stq .intro{ text-align:center; padding:10px 6px 4px; }
.stq .intro .hero{ font-size:42px; margin-bottom:10px; }
.stq .intro h3{
  font-family:'Gaegu', sans-serif; font-size:24px; margin:0 0 10px;
  padding:0; border:0; line-height:1.4; color:var(--ink);
}
.stq .intro p{ font-size:14px; color:var(--ink-soft); line-height:1.6; margin:0 0 24px; }
.stq .btn{
  display:inline-block; background:var(--rose); color:#fff; border:none; border-radius:100px;
  padding:14px 30px; font-size:15px; font-weight:700; font-family:'Noto Sans KR', sans-serif;
  cursor:pointer; box-shadow:0 6px 16px rgba(193,95,108,0.30); transition:transform .15s ease;
}
.stq .btn:hover{ transform:translateY(-2px); }
.stq .btn.ghost{ background:transparent; color:var(--rose-deep); border:2px solid var(--rose); box-shadow:none; }

.stq .result{ text-align:center; padding:6px 4px 2px; }
.stq .ticket{
  background:var(--cream-deep); border-radius:18px; padding:22px 16px 26px;
  margin-bottom:20px; position:relative;
}
.stq .ticket:before, .stq .ticket:after{
  content:''; position:absolute; width:20px;height:20px; background:var(--paper);
  border-radius:50%; top:50%; transform:translateY(-50%);
}
.stq .ticket:before{ left:-10px; }
.stq .ticket:after{ right:-10px; }
.stq .rimg{
  width:100%; border-radius:14px; display:block; margin:0 0 14px;
  aspect-ratio:16/10; object-fit:cover; box-shadow:0 6px 16px rgba(120,90,70,0.15);
}
.stq .type{
  font-family:'Gaegu', sans-serif; font-size:52px; font-weight:700;
  color:var(--rose-deep); letter-spacing:0.05em; margin:0; line-height:1.1;
}
.stq .nick{ font-size:17px; font-weight:700; margin:6px 0 0; color:var(--ink); }
.stq .desc{ font-size:14px; line-height:1.7; color:var(--ink-soft); text-align:left; margin:0 0 22px; }

.stq .share-title{ font-family:'Gaegu', sans-serif; font-size:16px; color:var(--ink-soft); margin:0 0 12px; }
.stq .share-row{ display:flex; justify-content:center; gap:16px; margin:0 0 18px; }
.stq .share-item{
  background:none; border:none; padding:0; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:6px; font-family:inherit;
}
.stq .share-item .ic{
  width:48px;height:48px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:700;
  box-shadow:0 4px 12px rgba(120,90,70,0.14); transition:transform .15s ease;
}
.stq .share-item:hover .ic{ transform:translateY(-2px); }
.stq .share-item .lb{ font-size:11px; color:var(--ink-soft); }
.stq .ic.kakao{ background:#FEE500; color:#3C1E1E; }
.stq .ic.x{ background:#141414; color:#fff; font-size:17px; }
.stq .ic.link, .stq .ic.more{ background:var(--cream-deep); color:var(--ink-soft); }

@media (max-width:360px){
  .stq .qtext{ font-size:16.5px; }
  .stq .type{ font-size:44px; }
}
</style>

</script>

<script>
(function(){
  var root = document.getElementById('stq-root');
  var DATA = JSON.parse(document.getElementById('stq-data').textContent);
  var Q = DATA.questions, IMG = DATA.images, RESULTS = DATA.results;

  var KAKAO_JS_KEY = '7806d048aad9905e98fb7dd4217236d2';
  var OG_IMAGE = DATA.results['ENFP'] ? DATA.results['ENFP'].img : '';
  function initKakao(){
    if(!KAKAO_JS_KEY || !window.Kakao) return false;
    if(!window.Kakao.isInitialized()) window.Kakao.init(KAKAO_JS_KEY);
    return true;
  }

  var state = { step:-1, answers:[] };
  var brandTitle = root.querySelector('.bt');
  var card       = root.querySelector('.card');
  var routeBar   = root.querySelector('.route');
  var routeFill  = root.querySelector('.route-fill');
  var routeDots  = root.querySelector('.route-dots');
  var routePlane = root.querySelector('.route-plane');

  for(var i=0;i<Q.length;i++) routeDots.appendChild(document.createElement('span'));

  function updateRoute(step){
    var pct = Q.length <= 1 ? 0 : (step/(Q.length-1))*100;
    routeFill.style.width = pct + '%';
    routePlane.style.left = pct + '%';
    var dots = routeDots.children;
    for(var i=0;i<dots.length;i++){
      dots[i].className = i < step ? 'done' : (i === step ? 'now' : '');
    }
  }

  function renderIntro(){
    brandTitle.textContent = '';
    routeBar.style.display = 'none';
    card.innerHTML =
      '<div class="intro"><div class="hero">🗼</div>' +
      '<h3>' + DATA.introTitle + '</h3>' +
      '<p>' + DATA.introSub + '</p>' +
      '<button class="btn" id="stqStart">여행 시작하기</button></div>';
    card.querySelector('#stqStart').onclick = function(){
      state = { step:0, answers:[] }; renderQuestion();
    };
  }

  function renderQuestion(){
    var q = Q[state.step];
    brandTitle.textContent = '도쿄 여행 MBTI';
    routeBar.style.display = 'block';
    updateRoute(state.step);

    var opts = q.options.map(function(o,i){
      return '<button class="opt" data-trait="'+o.trait+'" data-idx="'+i+'">' +
             '<img src="'+IMG[o.img]+'" alt="" loading="lazy"><p>'+o.text+'</p></button>';
    }).join('');

    card.innerHTML =
      '<div class="qhead"><button class="backbtn" id="stqBack">← 이전</button>' +
      '<div class="stamp"><span class="day">'+q.day+'</span><span class="phase">'+q.phase+'</span></div></div>' +
      '<div class="qtext">'+q.q+'</div><div class="options">'+opts+'</div>';

    card.querySelector('#stqBack').onclick = function(){
      if(card.dataset.locked === '1') return;
      if(state.step === 0){ state = { step:-1, answers:[] }; renderIntro(); }
      else { state.answers.pop(); state.step -= 1; renderQuestion(); }
    };

    Array.prototype.forEach.call(card.querySelectorAll('.opt'), function(btn){
      btn.onclick = function(){
        if(card.dataset.locked === '1') return;
        card.dataset.locked = '1';
        btn.classList.add('picked');
        state.answers.push(btn.dataset.trait);
        setTimeout(function(){
          card.dataset.locked = '0';
          if(state.step < Q.length - 1){ state.step += 1; renderQuestion(); }
          else renderResult();
        }, 320);
      };
    });
  }

  function computeType(){
    var c = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
    state.answers.forEach(function(t){ c[t] = (c[t]||0) + 1; });
    return (c.E>=c.I?'E':'I') + (c.S>=c.N?'S':'N') + (c.T>=c.F?'T':'F') + (c.J>=c.P?'J':'P');
  }

  function renderResult(forced){
    routeBar.style.display = 'none';
    brandTitle.textContent = '나의 도쿄 여행 유형';
    var type = forced || computeType();
    var r = RESULTS[type] || { nick:'유니크한 여행자', desc:'아직 준비 중인 결과예요.' };

    card.innerHTML =
      '<div class="result"><div class="ticket">' +
      (r.img ? '<img class="rimg" src="'+r.img+'" alt="'+type+'">' : '') +
      '<p class="type">'+type+'</p><p class="nick">'+r.nick+'</p></div>' +
      '<p class="desc">'+r.desc+'</p>' +
      '<p class="share-title">친구는 무슨 유형일까?</p>' +
      '<div class="share-row">' +
        '<button class="share-item" id="stqK"><span class="ic kakao">톡</span><span class="lb">카카오톡</span></button>' +
        '<button class="share-item" id="stqX"><span class="ic x">𝕏</span><span class="lb">X</span></button>' +
        '<button class="share-item" id="stqL"><span class="ic link">🔗</span><span class="lb">링크 복사</span></button>' +
        '<button class="share-item" id="stqM" style="display:none"><span class="ic more">···</span><span class="lb">다른 앱</span></button>' +
      '</div>' +
      '<button class="btn ghost" id="stqRetry">다시 여행 떠나기</button></div>';

    card.querySelector('#stqRetry').onclick = function(){
      state = { step:-1, answers:[] }; renderIntro();
      root.scrollIntoView({ behavior:'smooth', block:'start' });
    };

    var shareUrl  = location.origin + location.pathname + '?r=' + type;
    var shareText = "내 도쿄 여행 유형은 '" + r.nick + "' (" + type + ")";

    card.querySelector('#stqK').onclick = function(){
      if(!initKakao()){ alert('카카오 공유는 등록된 도메인에서만 작동해요.'); return; }
      window.Kakao.Share.sendDefault({
        objectType:'feed',
        content:{ title: type + ' · ' + r.nick, description: shareText, imageUrl: r.img || OG_IMAGE,
                  link:{ mobileWebUrl: shareUrl, webUrl: shareUrl } },
        buttons:[{ title:'나도 테스트하기', link:{ mobileWebUrl: shareUrl, webUrl: shareUrl } }]
      });
    };
    card.querySelector('#stqX').onclick = function(){
      window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(shareText) +
        '&url=' + encodeURIComponent(shareUrl), '_blank', 'noopener,width=560,height=520');
    };
    var lb = card.querySelector('#stqL').querySelector('.lb');
    card.querySelector('#stqL').onclick = function(){
      function done(m){ lb.textContent = m; setTimeout(function(){ lb.textContent = '링크 복사'; }, 1600); }
      if(navigator.clipboard) navigator.clipboard.writeText(shareText + '\n' + shareUrl).then(function(){done('복사됨');}).catch(function(){done('복사 실패');});
      else done('복사 실패');
    };
    if(navigator.share){
      var more = card.querySelector('#stqM');
      more.style.display = 'flex';
      more.onclick = function(){ navigator.share({ text: shareText, url: shareUrl }).catch(function(){}); };
    }
  }

  var shared = new URLSearchParams(location.search).get('r');
  if(shared && RESULTS[shared]) renderResult(shared);
  else renderIntro();
})();
</script>
