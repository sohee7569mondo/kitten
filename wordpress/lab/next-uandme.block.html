<!--
  랩 테스트 결과 → 유앤미 궁합 — 워드프레스 「사용자 정의 HTML」 블록용
  ------------------------------------------------------------------
  · 테스트 페이지(/lab/tokyo/ · /lab/money/ · /lab/cafe/ ·
    /lab/grocery/ · /lab/camping/ · /lab/night-snack/) 맨 아래에
    블록 하나로 더 넣으세요. 테스트 코드는 손대지 않습니다.
  · 결과가 나왔을 때만 뜹니다. 문제 푸는 동안에는 안 보입니다.
  · 여섯 테스트 모두 같은 이 블록을 씁니다.
-->

<style>
.stq-next{
  --paper:#FFFDF9; --ink:#413830; --dim:#8B7F70; --line:#E3D8C6;
  --go:#7B4B6E; --go-deep:#5E3654;
  max-width:460px; margin:22px auto 0; padding:0 2px;
  font-family:'Noto Sans KR', system-ui, sans-serif;
  display:none;
}
.stq-next.on{ display:block; }
.stq-next .box{
  background:var(--paper); border:1px solid var(--line);
  border-radius:20px; padding:24px 22px 22px; text-align:center;
  box-shadow:0 10px 26px -18px rgba(65,56,48,.45);
}
.stq-next .eye{
  font-size:11.5px; letter-spacing:.22em; color:var(--dim);
  margin:0 0 12px;
}
.stq-next h3{
  font-size:19px; line-height:1.5; color:var(--ink);
  margin:0 0 10px; font-weight:700; word-break:keep-all;
}
.stq-next p{
  font-size:13.5px; line-height:1.85; color:var(--dim);
  margin:0 0 18px; word-break:keep-all;
}
.stq-next a.go{
  display:inline-block; background:var(--go); color:#FFFDF9;
  border-radius:30px; padding:13px 26px; text-decoration:none;
  font-size:14.5px; font-weight:700;
  box-shadow:0 12px 24px -14px rgba(94,54,84,.75);
}
.stq-next a.go:hover{ background:var(--go-deep); }
.stq-next .small{
  margin:14px 0 0; font-size:11.5px; color:var(--dim); opacity:.85;
}
@media (max-width:370px){
  .stq-next h3{ font-size:17.5px; }
  .stq-next p{ font-size:12.5px; }
}
</style>

<div class="stq-next" id="stqNext">
  <div class="box">
    <p class="eye">이 다음</p>
    <h3>이 사람하고는 어떨까요</h3>
    <p>여기까지는 재미로 보는 것이었고요.<br>
      마음 가는 사람과 어떤 결인지는 태어난 날로 봅니다.<br>
      둘의 생년월일만 있으면 됩니다.</p>
    <a class="go" href="https://stellasaju.com/uandme/">유앤미에서 궁합 보기 →</a>
    <p class="small">이름과 생년월일만 씁니다. 가입은 안 하셔도 돼요.</p>
  </div>
</div>

<script>
/* 결과가 나왔을 때만 띄웁니다.
   테스트마다 상자 이름이 조금 달라서 세 가지를 다 살핍니다.
   ★ 이 안에 두 겹 앰퍼샌드를 쓰지 않습니다 (사이트 규칙). */
(function(){
  var box = document.getElementById('stqNext');
  if(!box){ return; }

  function done(){
    if(document.querySelector('.result')){ return true; }
    if(document.querySelector('.ticket')){ return true; }
    if(document.querySelector('.nick')){ return true; }
    return false;
  }

  var moved = false;
  function lift(){
    if(moved){ return; }
    var foot = document.querySelector('.footer-note');
    if(!foot){ return; }
    foot.parentNode.insertBefore(box, foot);
    moved = true;
  }

  function look(){
    if(done()){ lift(); box.classList.add('on'); }
    else { box.classList.remove('on'); }
  }

  look();

  var host = document.getElementById('card');
  if(!host){ host = document.body; }
  if(window.MutationObserver){
    var mo = new MutationObserver(look);
    mo.observe(host, { childList:true, subtree:true });
  } else {
    setInterval(look, 600);
  }
})();
</script>
